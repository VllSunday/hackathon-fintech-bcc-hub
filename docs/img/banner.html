<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #07060c; }
  .b {
    position: relative; width: 1280px; height: 320px; overflow: hidden;
    background:
      radial-gradient(520px 300px at 6% 0%, rgba(124, 58, 237, .55), transparent 70%),
      radial-gradient(520px 260px at 46% 118%, rgba(219, 39, 119, .38), transparent 72%),
      radial-gradient(560px 320px at 98% 70%, rgba(8, 145, 178, .55), transparent 70%),
      #07060c;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(ellipse 90% 90% at 40% 50%, #000 40%, transparent 100%);
  }
  .kicker {
    position: absolute; left: 72px; top: 54px;
    font: 500 15px/1 "JetBrains Mono", monospace; letter-spacing: .28em; text-transform: uppercase;
    color: rgba(230, 228, 245, .62);
  }
  .kicker i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 12px;
    background: #67e8f9; box-shadow: 0 0 14px #67e8f9; vertical-align: 2px; }
  .name {
    position: absolute; left: 64px; top: 78px;
    font: 800 150px/1 "Unbounded", sans-serif; letter-spacing: -.02em;
    background: linear-gradient(90deg, #93c5fd 0%, #a78bfa 38%, #e879f9 70%, #f472b6 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(167, 139, 250, .35));
  }
  .tag {
    position: absolute; left: 74px; top: 250px;
    font: 600 22px/1.2 "Manrope", sans-serif; color: #e6e4f5;
  }
  .tag span { color: rgba(230, 228, 245, .6); font-weight: 500; }
  .chips { position: absolute; right: 64px; top: 58px; display: flex; flex-direction: column; gap: 12px; align-items: flex-end; }
  .chip {
    font: 500 14px/1 "JetBrains Mono", monospace; color: #cbd5e1; padding: 10px 14px;
    border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(6px);
  }
  .rail { position: absolute; right: 64px; bottom: 54px; display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(148, 163, 184, .55); }
  .dot.on { border-color: #67e8f9; background: #67e8f9; box-shadow: 0 0 12px #67e8f9; }
  .seg { width: 26px; height: 2px; background: rgba(148, 163, 184, .35); }
  .seg.on { background: linear-gradient(90deg, #67e8f9, #a78bfa); }
</style>
</head>
<body>
  <div class="b">
    <div class="grid"></div>
    <div class="kicker"><i></i>BCC-HUB × MNU FinTech Hackathon</div>
    <div class="name">Specula</div>
    <div class="tag">Находит дефекты в ТЗ до первой строки кода <span>· ISO/IEC/IEEE 29148 · IEEE 830</span></div>
    <div class="chips">
      <div class="chip">цитата → критерий → правка → вопрос</div>
      <div class="chip">Gemini 3.1 Pro · PydanticAI</div>
    </div>
    <div class="rail">
      <div class="dot on"></div><div class="seg on"></div><div class="dot on"></div><div class="seg on"></div>
      <div class="dot on"></div><div class="seg"></div><div class="dot"></div><div class="seg"></div><div class="dot"></div>
    </div>
  </div>
</body>
</html>
