    quotes:
      - "Дать клиенту быстрый способ обезопасить карту без звонка в контакт-центр"
    looks_like: verifiable
    why_not: Размытое «быстрый» стоит в разделе «Цели», это не требование; измеримый срок применения статуса задан в НФТ-1.
  - id: T-02
    quotes:
      - "кроме регулярных платежей (Ф-2)"
    looks_like: set_consistent
    why_not: Ф-1 отклоняет «все операции списания», но прямо делает исключение со ссылкой на Ф-2, поэтому Ф-1 и Ф-2 не противоречат друг другу.
  - id: T-03
    quotes:
      - "Время хранится и передаётся в API в UTC (ISO 8601 с суффиксом Z), в приложении отображается по Алматы."
    looks_like: set_consistent
    why_not: Расхождение UTC в API и времени Алматы в интерфейсе явно оговорено как правило отображения, а сутки для лимита в Ф-7 прямо заданы по Алматы.
  - id: T-04
    quotes:
      - "Для чужой карты возвращается 404, как и для отсутствующей, чтобы не раскрывать существование карты."
    looks_like: conforming
    why_not: Отказ от 403 в пользу 404 для чужой карты — явное и обоснованное правило спецификации, а не нарушение семантики кодов.
  - id: T-05
    quotes:
      - "В документе слова «заморозка» и «временная блокировка» означают одно и то же."
    looks_like: unambiguous
    why_not: Два названия одного статуса явно объявлены синонимами в разделе «Термины», а «блокировка банком» определена отдельно.
  - id: T-06
    quotes:
      - "Новый статус применяется в процессинге не позднее 5 секунд после подтверждения клиентом для 99 % запросов за календарный месяц."
    looks_like: set_consistent
    why_not: 5 секунд в НФТ-1 и 5 000 мс таймаута в части B — одно и то же значение в разных единицах, пересчёт верный; у процента задан период.
