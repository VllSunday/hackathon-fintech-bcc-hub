<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reqaudit</title>
<link rel="icon" href="data:,">
<style>
/* Idea: a paper document on a dark desk. The page chrome follows the theme, the document itself
   always stays paper, and defects are drawn on it like highlighter strokes. */
@property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
:root {
  --bg: #0b1026;
  --glow-a: rgba(61, 91, 255, .34);
  --glow-b: rgba(57, 167, 255, .16);
  --surface: #141a3a;
  --surface-2: #1b2248;
  --line: #2a3260;
  --line-strong: #3d4788;
  --text: #eef1ff;
  --muted: #9aa3cf;
  --accent: #7d97ff;
  --accent-strong: #3d5bff;
  --accent-soft: rgba(108, 140, 255, .16);
  --on-accent: #ffffff;
  --ok: #3ddc97;       --ok-soft: rgba(61, 220, 151, .14);
  --crit: #ff7a86;     --crit-soft: rgba(255, 77, 94, .16);   --crit-fill: #ff4d5e;
  --major: #ffc552;    --major-soft: rgba(255, 176, 32, .16); --major-fill: #ffb020;
  --minor: #74c2ff;    --minor-soft: rgba(57, 167, 255, .16); --minor-fill: #39a7ff;
  --shadow: 0 18px 50px rgba(2, 6, 30, .55);
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, "Liberation Mono", Menlo, monospace;
  --r: 10px;
  --tabs-h: 58px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.2, 1.5, .4, 1);
}
:root[data-theme="light"] {
  --bg: #e8ebf6;
  --glow-a: rgba(61, 91, 255, .16);
  --glow-b: rgba(57, 167, 255, .14);
  --surface: #ffffff;
  --surface-2: #f2f4fb;
  --line: #d5daec;
  --line-strong: #b4bcdb;
  --text: #12152b;
  --muted: #565d80;
  --accent: #3d5bff;
  --accent-strong: #3d5bff;
  --accent-soft: #e3e8ff;
  --ok: #0c8552;       --ok-soft: #dcf5e9;
  --crit: #cc1f38;     --crit-soft: #ffe3e6;   --crit-fill: #f0384d;
  --major: #8a5200;    --major-soft: #fff0cc;  --major-fill: #f2a516;
  --minor: #1b62ab;    --minor-soft: #dcedff;  --minor-fill: #2f95ee;
  --shadow: 0 14px 40px rgba(40, 52, 110, .16);
}
* { box-sizing: border-box; }
html { font-size: 15px; }
body { margin: 0; min-height: 100vh; color: var(--text); font-family: var(--sans); line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  background: radial-gradient(900px 520px at 10% -12%, var(--glow-a), transparent 62%),
    radial-gradient(760px 480px at 102% -4%, var(--glow-b), transparent 60%), var(--bg);
  background-attachment: fixed; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); }
.mono { font-family: var(--mono); font-size: 14px; }
.muted { color: var(--muted); }
.wrap { max-width: 1680px; margin: 0 auto; padding: 0 24px; }
.grow { flex: 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 700; letter-spacing: -.01em; }
h1 { font-size: 26px; line-height: 1.15; }
h2 { font-size: 18px; }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes spin { to { --spin: 360deg; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent-soft); } 100% { box-shadow: 0 0 0 14px transparent; } }
@keyframes blink { 50% { opacity: .25; } }
#app.enter > * { animation: rise .42s var(--ease) backwards; }
#app.enter > *:nth-child(2) { animation-delay: .06s; }
#app.enter > *:nth-child(3) { animation-delay: .12s; }

/* top bar */
.top .wrap { display: flex; align-items: center; gap: 14px; min-height: 60px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700;
  font-size: 18px; letter-spacing: -.01em; color: var(--text); text-decoration: none; }
.logo { position: relative; width: 22px; height: 28px; border-radius: 4px; background: #f7f8fc;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .25); transform: rotate(-6deg); transition: transform .3s var(--spring); }
.logo::before, .logo::after { content: ""; position: absolute; left: 4px; height: 4px; border-radius: 2px; }
.logo::before { top: 7px; width: 14px; background: #ffb020; }
.logo::after { top: 15px; width: 9px; background: #ff4d5e; }
.brand:hover .logo { transform: rotate(4deg) scale(1.08); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 6px 16px;
  border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); color: var(--text);
  text-decoration: none; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap;
  transition: transform .15s var(--ease), border-color .15s, background-color .15s, box-shadow .15s; }
.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.97); }
.btn.primary { border: 0; color: var(--on-accent); background: linear-gradient(135deg, #5d78ff, #3d5bff 55%, #2b43d6);
  box-shadow: 0 8px 22px rgba(61, 91, 255, .42); }
.btn.primary:hover { box-shadow: 0 12px 28px rgba(61, 91, 255, .55); }
.btn.primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; transform: none; }
.btn.big { min-height: 50px; padding: 10px 30px; font-size: 16px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); }
.btn.icon { width: 38px; padding: 0; }
.btn.icon svg { transition: transform .5s var(--spring); }
.btn.icon:hover svg { transform: rotate(40deg); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.pad { padding: 18px 20px; }
.section-title { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 10px; }
.notice { border-radius: var(--r); padding: 11px 16px; margin: 12px 0; background: var(--major-soft); color: var(--text);
  border: 1px solid transparent; border-left: 4px solid var(--major-fill); }
.notice.error { background: var(--crit-soft); border-left-color: var(--crit-fill); }
.notice.ok { background: var(--ok-soft); border-left-color: var(--ok); }
.notice p { margin: 0 0 4px; } .notice p:last-child { margin: 0; }
.notice details p { margin: 6px 0 0; }
.notice code { font-family: var(--mono); font-size: 14px; }
.empty { padding: 34px 18px; text-align: center; color: var(--muted); }

/* upload screen */
.upload { max-width: 980px; padding-top: 4vh; padding-bottom: 60px; display: grid; gap: 22px; }
.drop { position: relative; isolation: isolate; border-radius: 26px; padding: 44px 24px 38px; text-align: center;
  cursor: pointer; background: var(--surface); box-shadow: var(--shadow); display: grid; justify-items: center; gap: 6px;
  transition: transform .25s var(--ease); }
.drop::before { content: ""; position: absolute; inset: -2px; z-index: -2; border-radius: 28px;
  background: conic-gradient(from var(--spin), #3d5bff, #39a7ff, #ffb020, #ff4d5e, #3d5bff);
  animation: spin 7s linear infinite; opacity: .75; transition: opacity .25s; }
.drop::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 26px; background: var(--surface); }
.drop:hover { transform: translateY(-2px); }
.drop:hover::before, .drop.over::before, .drop.has-file::before { opacity: 1; }
.drop.over { transform: scale(1.015); }
.drop.over::after { background: var(--surface-2); }
.drop strong { font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; }
.drop .hint { color: var(--muted); font-size: 14px; }
.paper { position: relative; width: 78px; height: 98px; margin-bottom: 14px; border-radius: 8px; background: #f7f8fc;
  box-shadow: 0 16px 34px rgba(0, 0, 0, .32); transform: rotate(-5deg); display: grid; align-content: center; gap: 8px;
  padding: 0 13px; transition: transform .45s var(--spring); }
.paper i { display: block; height: 6px; border-radius: 3px; background: #cfd4e8; width: var(--w, 100%); }
.paper i:nth-child(2) { background: #ffb020; } .paper i:nth-child(4) { background: #ff4d5e; }
.drop:hover .paper { transform: rotate(3deg) translateY(-6px); }
.drop.over .paper { transform: rotate(0) translateY(-12px) scale(1.12); }
.drop.has-file .paper { animation: pop .45s var(--spring); transform: rotate(0); }
.form-row { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }
.models { text-align: center; color: var(--muted); font-family: var(--mono); font-size: 14px; }
.runs { display: grid; gap: 8px; }
.run { display: grid; grid-template-columns: minmax(0, 1fr) auto auto repeat(4, 64px); gap: 6px 18px; align-items: center;
  padding: 13px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--text);
  text-decoration: none; animation: rise .45s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 55ms + .15s);
  transition: transform .18s var(--ease), border-color .18s, box-shadow .18s; }
.run:hover { transform: translateX(6px); border-color: var(--accent); box-shadow: var(--shadow); }
.run-doc { min-width: 0; display: grid; }
.run-doc b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-doc span { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-date { font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat { display: grid; justify-items: end; line-height: 1.15; }
.stat b { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.crit b { color: var(--crit); }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px; border-radius: 999px; font-size: 14px;
  font-weight: 600; white-space: nowrap; background: var(--major-soft); color: var(--major); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.completed { background: var(--ok-soft); color: var(--ok); }
.pill.partial, .pill.interrupted, .pill.input_rejected { background: var(--crit-soft); color: var(--crit); }
.pill.running { background: var(--accent-soft); color: var(--accent); }
.pill.running::before { animation: blink 1s infinite; }
@media (max-width: 860px) {
  .run { grid-template-columns: minmax(0, 1fr) auto; }
  .run .stat { justify-items: start; }
  .run-date { display: none; }
  .run { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .run-doc { grid-column: 1 / 4; } .run .pill { grid-column: 4; justify-self: end; }
}

/* generic tables */
table { border-collapse: collapse; width: 100%; }
.grid-table th, .grid-table td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line);
  vertical-align: top; font-size: 14px; }
.grid-table tr:last-child td { border-bottom: 0; }
.grid-table th { color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
.grid-table td.mono, .grid-table td.prio, .grid-table th { white-space: nowrap; }
.grid-table .chip { flex-wrap: nowrap; white-space: nowrap; }
.grid-table tbody tr { transition: background-color .15s; }
.grid-table tbody tr.click { cursor: pointer; }
.grid-table tbody tr.click:hover { background: var(--surface-2); }
.num { text-align: right !important; font-variant-numeric: tabular-nums; }
.table-scroll { overflow-x: auto; }
.card.table-scroll { overflow: auto; }

/* run screen: the sheet being read */
.runview { max-width: 1280px; padding-top: 3vh; padding-bottom: 50px; }
.scan { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 44px; align-items: center; justify-content: center;
  max-width: 820px; margin: 0 auto 34px; }
.sheet { position: relative; width: 190px; height: 246px; border-radius: 12px; background: #f7f8fc; overflow: hidden;
  box-shadow: 0 26px 60px rgba(0, 0, 0, .42); padding: 26px 22px; display: grid; align-content: start; gap: 12px;
  transform: rotate(-3deg); transition: transform .6s var(--spring); }
.scan.finished .sheet { transform: rotate(0); }
.sheet i { display: block; height: 8px; border-radius: 4px; width: var(--w); background: #dfe3f1;
  transition: background-color .5s var(--ease); }
.sheet i.on { background: #232745; }
.sheet i.on.critical { background: #ff4d5e; } .sheet i.on.major { background: #ffb020; } .sheet i.on.minor { background: #39a7ff; }
.beam { position: absolute; left: 0; right: 0; top: 0; height: 64px; pointer-events: none; opacity: 0;
  background: linear-gradient(180deg, rgba(61, 91, 255, 0), rgba(61, 91, 255, .28));
  border-bottom: 2px solid #3d5bff; box-shadow: 0 6px 22px rgba(61, 91, 255, .55); }
@keyframes sweep { 0% { transform: translateY(-64px); } 100% { transform: translateY(246px); } }
.scan.running .beam { opacity: 1; animation: sweep 1.9s cubic-bezier(.45, 0, .55, 1) infinite alternate; }
.badge { position: absolute; right: 14px; bottom: 14px; width: 46px; height: 46px; border-radius: 50%; display: none;
  place-items: center; color: #fff; background: #16a765; font-size: 24px; font-weight: 700; line-height: 1; }
.scan.finished .badge { display: grid; animation: pop .5s var(--spring); }
.scan.failed .badge { background: #f0384d; }
.scan-info { min-width: 0; display: grid; gap: 6px; justify-items: start; }
.scan-info h1 { overflow-wrap: anywhere; }
.clock { font-family: var(--display); font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums; }
.now { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; min-height: 28px; }
.now .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.scan.running .now .dot { animation: pulse 1.2s infinite; }
.scan.finished .now .dot { background: var(--ok); } .scan.failed .now .dot { background: var(--crit); }
.scan-info .btn { margin-top: 10px; }
@media (max-width: 620px) { .scan { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 24px; }
  .scan-info { justify-items: center; text-align: center; } .clock { font-size: 48px; } }

/* stage track */
.chain { display: grid; grid-template-columns: repeat(var(--stages, 10), minmax(0, 1fr)); margin: 18px 0 6px; }
.stage { position: relative; display: grid; justify-items: center; align-content: start; gap: 2px; text-align: center;
  padding: 0 6px; min-width: 0; }
.stage::before { content: ""; position: absolute; top: 14px; left: 50%; width: 100%; height: 2px; background: var(--line);
  transition: background-color .5s; }
.stage:last-child::before { display: none; }
.stage.done::before, .stage.not_needed::before { background: var(--accent); }
.node { position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--bg); border: 2px solid var(--line-strong); margin-bottom: 8px; color: var(--on-accent);
  transition: background-color .4s, border-color .4s, transform .4s var(--spring); }
.stage.done .node { background: var(--accent-strong); border-color: var(--accent-strong); transform: scale(1.04); }
.stage.done .node::after { content: ""; width: 10px; height: 5px; border-left: 2px solid; border-bottom: 2px solid;
  transform: rotate(-45deg) translate(1px, -1px); }
.stage.running .node { border-color: var(--accent); animation: pulse 1.2s infinite; }
.stage.running .node::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
  animation: blink 1s infinite; }
.stage.error .node, .stage.interrupted .node { background: var(--crit-fill); border-color: var(--crit-fill); }
.stage.error .node::after, .stage.interrupted .node::after { content: "!"; font-weight: 700; font-size: 16px; line-height: 1; }
.stage.not_needed .node, .stage.skipped .node { border-style: dashed; }
.stage .code { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.stage .name { font-weight: 600; font-size: 14px; line-height: 1.25; }
.stage .state { font-size: 13px; font-weight: 600; color: var(--muted); }
.stage.done .state, .stage.pending .state { display: none; }
.stage.running .state { color: var(--accent); }
.stage.error .state, .stage.interrupted .state { color: var(--crit); }
.stage .meta { font-size: 13px; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }
.stage.pending { opacity: .55; }
@media (max-width: 1100px) {
  .chain { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .stage { grid-template-columns: 30px minmax(0, 1fr); justify-items: start; text-align: left; column-gap: 14px; }
  .stage .node { grid-row: 1 / span 4; margin: 0; }
  .stage::before { top: 30px; left: 14px; width: 2px; height: calc(100% - 16px); }
}

/* report head */
.report-head { padding-top: 10px; padding-bottom: 18px; }
.title-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.title-row h1 { flex: 1; min-width: 240px; }
.passport { display: flex; flex-wrap: wrap; gap: 6px 26px; margin: 0 0 18px; }
.passport div { min-width: 0; display: flex; gap: 7px; align-items: baseline; font-size: 14px; }
.passport dt { color: var(--muted); }
.passport dd { margin: 0; overflow-wrap: anywhere; }
.head-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 16px; }
@media (max-width: 980px) { .head-grid { grid-template-columns: minmax(0, 1fr); } }
.verdict { position: relative; overflow: hidden; padding: 22px 24px; border-radius: 20px; background: var(--surface);
  border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; grid-template-columns: auto minmax(0, 1fr);
  gap: 16px 30px; align-items: center; --v: var(--line-strong); --v-soft: transparent; }
.verdict.no { --v: var(--crit); --v-soft: var(--crit-soft); }
.verdict.conditional { --v: var(--major); --v-soft: var(--major-soft); }
.verdict.yes { --v: var(--ok); --v-soft: var(--ok-soft); }
.verdict::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(520px 260px at 0% 0%, var(--v-soft), transparent 70%); }
.verdict > * { position: relative; }
.verdict .q { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
@keyframes stamp { 0% { opacity: 0; transform: scale(2.4) rotate(-14deg); } 60% { opacity: 1; transform: scale(.94) rotate(-4deg); }
  100% { opacity: 1; transform: scale(1) rotate(-4deg); } }
.verdict .word { display: inline-block; font-family: var(--display); font-size: 44px; font-weight: 800; line-height: 1;
  letter-spacing: -.02em; color: var(--v); padding: 12px 22px 14px; border: 4px solid var(--v); border-radius: 14px;
  box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 5px var(--v); transform: rotate(-4deg);
  animation: stamp .55s cubic-bezier(.3, 1.2, .5, 1) .45s backwards; max-width: 100%; overflow-wrap: anywhere; }
.verdict .word.plain { font-size: 24px; }
.verdict p { margin: 0 0 8px; max-width: 70ch; }
.verdict p:last-child { margin-bottom: 0; }
.fixes { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.fixes li { animation: rise .4s var(--ease) backwards; animation-delay: calc(var(--i) * 90ms + .85s); }
.fixes button { width: 100%; display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; text-align: left;
  transition: transform .15s var(--ease), border-color .15s; }
.fixes button:hover { transform: translateX(5px); border-color: var(--accent); }
.fixes .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blocking { margin-top: 14px; }
.blocking ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.blocking li { overflow-wrap: anywhere; }
.findings details.resolved { margin-top: 14px; }
.findings details.resolved summary { cursor: pointer; color: var(--muted); }
.notes h4 { margin: 0 0 4px; }
.notes > div + div { margin-top: 12px; }
.notes ul { margin: 4px 0 0; padding-left: 18px; }
.blk.doubt { box-shadow: inset 3px 0 0 var(--major, #c98a00); }
.fixes .mono { flex: none; white-space: nowrap; }
@media (max-width: 760px) { .verdict { grid-template-columns: minmax(0, 1fr); } }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left;
  text-decoration: underline; text-underline-offset: 3px; text-decoration-color: transparent; transition: text-decoration-color .15s; }
.linkish:hover { text-decoration-color: currentColor; }
.figures { padding: 18px 22px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--shadow); display: grid; align-content: space-between; gap: 16px; }
.numbers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
.numbers b { display: block; font-family: var(--display); font-size: 46px; font-weight: 800; line-height: 1;
  letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.numbers span { font-size: 14px; color: var(--muted); }
.numbers .crit b { color: var(--crit); }
@keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
.sevbar { display: flex; gap: 3px; height: 12px; transform-origin: left; animation: grow .9s var(--ease) .5s backwards; }
.sevbar span { min-width: 6px; border-radius: 6px; }
.sevbar .critical { background: var(--crit-fill); } .sevbar .major { background: var(--major-fill); }

  if (s == null) return null;

  if (s < 1) return s.toFixed(2).replace('.', ',') + ' с';
  if (s < 60) return s.toFixed(1).replace('.', ',') + ' с';
  return Math.floor(s / 60) + ' мин ' + Math.round(s % 60) + ' с';
}
function onActivate(el, fn) {
  el.addEventListener('click', fn);
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(e); } });
  return el;
}

// ---------------------------------------------------------------- server
async function api(path, options) {
  let response;
  try {
    response = await fetch(path, options);
  } catch (e) {
    throw new Error('Сервер не отвечает. Проверьте, что в консоли запущен reqaudit-ui, и обновите страницу.');
  }
  let body = null;
  try { body = await response.json(); } catch (e) { /* not JSON */ }
  if (!response.ok) {
    throw new Error((body && body.error) || `Сервер ответил ошибкой ${response.status}. Посмотрите вывод reqaudit-ui в консоли.`);
  }
  return body;
}
function errorBox(err, retry) {

let pollTimer = null;

function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function route() {

  }).catch((err) => message.append(errorBox(err)));

    api('/api/runs').then(({ runs }) => {
      clear(runsBox);
      runs.forEach((run, i) => {
        const target = run.has_report ? `#/report/${run.run_id}` : `#/run/${run.run_id}`;

          stat(run.units, 'требований'), stat(run.findings, 'нарушений'),
          stat(run.critical, 'критичных', 'crit'), stat(run.questions, 'вопросов')));

    }).catch((err) => clear(runsBox).append(errorBox(err, loadRuns)));

// ---------------------------------------------------------------- stage track
// The track is built once and then only updated, so its animations are not restarted by every poll.
function stageChain(progress) {
  const el = h('div', { class: 'chain' });
  const parts = new Map();
  el.update = (p) => {
    const now = Date.now();
    el.style.setProperty('--stages', p.stages.length);
    for (const s of p.stages) {
      let part = parts.get(s.code);
      if (!part) {
        part = { state: h('div', { class: 'state' }), meta: h('div', { class: 'meta' }) };
        part.root = h('div', null, h('div', { class: 'node' }), h('div', { class: 'code' }, s.code),
          h('div', { class: 'name' }, s.title), part.state, part.meta);
        parts.set(s.code, part);
        el.append(part.root);
      }
      const meta = [];
      const time = s.status === 'running' && s.started_at
        ? fmtSeconds(Math.max(0, (now - Date.parse(s.started_at)) / 1000)) : fmtSeconds(s.seconds);
      if (time) meta.push(h('div', null, time));
      if (s.llm_calls) meta.push(h('div', null, `${s.llm_calls} ${plural(s.llm_calls, 'вызов', 'вызова', 'вызовов')} модели`));
      if (s.cache_hits) meta.push(h('div', null, `из кэша ${s.cache_hits}`));
      if (s.llm_failed) meta.push(h('div', null, `без ответа ${s.llm_failed}`));
      for (const [key, one, few, many] of SUMMARY_RU[s.code] || []) {
        const n = s.summary && s.summary[key];
        if (typeof n === 'number') meta.push(h('div', null, `${n} ${plural(n, one, few, many)}`));
      }
      if (s.error) meta.push(h('div', null, s.error));
      part.root.className = `stage ${s.status}`;
      if (s.status === 'running') part.root.setAttribute('aria-current', 'step'); else part.root.removeAttribute('aria-current');
      part.state.textContent = STAGE_STATE[s.status] || s.status;
      append(clear(part.meta), meta);
    }
  };
  el.update(progress);
  return el;
}
function runNotice(progress) {
  const failed = progress.stages.find((s) => s.status === 'error');
  switch (progress.status) {
    case 'checks_incomplete':
      return h('div', { class: 'notice' }, h('p', null, 'Модель не ответила на часть проверок. Что осталось без оценки, отмечено в отчёте.'));
    case 'partial':
      return h('div', { class: 'notice error' }, h('p', null, h('b', null, `Этап ${failed ? failed.code : ''} остановился. `),
        failed && failed.error ? failed.error : ''));
    case 'input_rejected':
      return h('div', { class: 'notice error' }, h('p', null, h('b', null, 'Документ не принят. '),
        failed && failed.error ? failed.error : ''));
    case 'interrupted':
      return h('div', { class: 'notice error' }, h('p', null, 'Прогон прерван до записи отчёта.'));
    default:
      return null;
  }
}

// ---------------------------------------------------------------- run screen
function screenRun(runId) {
  // The sheet fills with lines as stages finish; three of them come out highlighted.
  const TINT = { 1: 'major', 3: 'critical', 6: 'minor' };
  const lines = [92, 70, 96, 58, 84, 66, 90, 48, 76].map((w, i) => h('i', { class: TINT[i] || null, style: `--w:${w}%` }));
  const badge = h('div', { class: 'badge' });
  const title = h('h1', null, 'Прогон');
  const nowText = h('span');
  const clock = h('div', { class: 'clock' }, '00:00');
  const actions = h('div');
  const scan = h('div', { class: 'scan' },
    h('div', { class: 'sheet', 'aria-hidden': 'true' }, lines, h('div', { class: 'beam' }), badge),
    h('div', { class: 'scan-info' }, title,
      h('div', { class: 'now', role: 'status' }, h('span', { class: 'dot' }), nowText), clock, actions));
  const noticeBox = h('div');
  const chainBox = h('div');
  const box = h('div', { class: 'wrap runview' }, scan, noticeBox, chainBox);
  clear(app).append(box);
  let chain = null;
  let sawRunning = false;
  let last = null;

  function draw(progress) {
    last = progress;
    const stages = progress.stages;
    const running = progress.status === 'running';
    const failed = ['partial', 'input_rejected', 'interrupted'].includes(progress.status);
    const done = stages.filter((s) => s.status === 'done' || s.status === 'not_needed').length;
    const lit = Math.round(done / Math.max(1, stages.length) * lines.length);
    lines.forEach((line, i) => line.classList.toggle('on', i < lit));
    title.textContent = progress.input || 'Прогон';
    scan.className = `scan ${running ? 'running' : 'finished'}${failed ? ' failed' : ''}`;
    badge.textContent = failed ? '!' : '✓';
    const current = stages.find((s) => s.status === 'running');
    nowText.textContent = running ? (current ? current.title : 'Запуск') : cap(RUN_STATUS[progress.status] || progress.status);
    const startedMs = Date.parse(progress.started_at || '');
    const seconds = running && !Number.isNaN(startedMs)
      ? Math.max(0, (Date.now() - startedMs) / 1000) : stages.reduce((sum, s) => sum + (s.seconds || 0), 0);
    clock.textContent = fmtClock(seconds);
    clear(actions);
    if (progress.has_report) actions.append(h('a', { class: 'btn primary big', href: `#/report/${runId}` }, 'Открыть отчёт'));
    const notice = runNotice(progress);
    clear(noticeBox);
    if (notice) noticeBox.append(notice);
    if (chain) chain.update(progress); else { chain = stageChain(progress); chainBox.append(chain); }
  }
  async function tick() {
    let progress;
    try {
      progress = await api(`/api/runs/${runId}/progress`);
    } catch (err) {
      stopPolling();
      clear(box).append(errorBox(err, () => route()));
      return;
    }
    if (progress.status === 'running') sawRunning = true;
    draw(progress);
    if (progress.status !== 'running') {
      stopPolling();
      // Watched live to the end: go straight to the result.
      if (sawRunning && progress.has_report) go(`#/report/${runId}`);
    }
  }
  tick();
  pollTimer = setInterval(() => { if (last && last.status === 'running') tick(); }, 1000);
}

function showReport(R) {
  const P = R.passport || {};

  const findingById = new Map(R.findings.map((f) => [f.id, f]));
  const unitById = new Map(R.units.map((u) => [u.id, u]));
  const unitsOfBlock = new Map();
  for (const u of R.units) for (const id of u.block_ids) {
    if (!unitsOfBlock.has(id)) unitsOfBlock.set(id, []);
    unitsOfBlock.get(id).push(u.id);
  }
  // Quote ranges per block: where each finding's evidence sits in the block text.
  const marksOfBlock = new Map();
  for (const f of R.findings) for (const ev of f.evidence) {
    const block = blockById.get(ev.block_id);
    if (!block) continue;
    const [start, end] = ev.span || [0, block.text.length];
    if (!marksOfBlock.has(block.id)) marksOfBlock.set(block.id, []);
    marksOfBlock.get(block.id).push({ start, end, id: f.id, severity: f.severity });
  }
  const criterion = (code) => R.criteria[code] || { label: code, standard: null, level: null };
  const state = { tab: 'doc', active: null, pane: 'doc', severities: new Set(), criterion: '', unit: '' };

      figure(critical, plural(critical, 'критичное', 'критичных', 'критичных'), 'crit'),

      const ids = [...new Set(covering.map((m) => m.id))];
      const k = `${style.bold[i]}|${style.code[i]}|${ids.join(',')}`;
      if (k !== key) {

        if (ids.length) {
          const worst = covering.reduce((a, m) => (SEV[m.severity].rank < SEV[a.severity].rank ? m : a), covering[0]);

        h('p', { style: 'margin:0 0 6px' }, R.profile.summary),
        h('p', { class: 'muted', style: 'margin:0' }, 'Части документа: ',
          R.profile.parts.map((p) => `«${p.name}» — ${PART_RU[p.role] || p.role}${p.parent ? `, детализирует «${p.parent}»` : ''}`).join('; '),
          '. Нумерация требований: ', R.profile.numbering, '.'),
        R.coverage ? h('p', { class: 'muted', style: 'margin:6px 0 0' },
          `Учтено блоков текста: ${R.coverage.blocks_checked}. Входят в требования: ${R.coverage.in_units}. Не содержат требований: ${R.coverage.skipped}`,
          Object.keys(R.coverage.skipped_by_reason || {}).length
            ? ` (${Object.entries(R.coverage.skipped_by_reason).map(([k, v]) => `${SKIP_RU[k] || k} — ${v}`).join(', ')})` : '',
          '.', R.coverage.unclassified && R.coverage.unclassified.length
            ? ` Не удалось классифицировать: ${R.coverage.unclassified.length}; эти блоки не проверялись.` : '') : null));
    }
    const notes = [];
    const cov = R.coverage || {};
    const obligations = Object.entries(cov.obligations_outside || {});
    if (obligations.length) {
      notes.push(h('div', null, h('h4', null, `Сверка вторым способом: ${obligations.length} ${plural(obligations.length, 'блок', 'блока', 'блоков')} с явным обязательством вне требований`),
        h('p', { class: 'muted' }, 'Код нашёл в них слова обязательства, а модель не выделила требование. Их читает общая проверка документа.'),
        h('ul', null, obligations.map(([id, word]) => h('li', null,
          h('button', { class: 'linkish', type: 'button', onclick: () => { ensureDocVisible(); flashBlocks([id]); } }, id), ` — «${word}»`)))));
    }
    if ((cov.dropped_units || []).length) {
      notes.push(h('div', null, h('h4', null, 'Отброшены как не подтверждённые текстом документа'),
        h('ul', null, cov.dropped_units.map((reason) => h('li', null, reason)))));
    }
    if ((R.plan_notes || []).length) {
      notes.push(h('div', null, h('h4', null, 'Решения при планировании проверок'),
        h('ul', null, R.plan_notes.map((note) => h('li', null, note)))));
    }
    if ((R.markers || []).length) {
      const judged = R.markers.filter((m) => m.defect).length;
      notes.push(h('div', null, h('h4', null, `Слова-маркеры: найдено кодом ${R.markers.length}, признано дефектом ${judged}`),
        h('ul', null, R.markers.map((m) => h('li', null, h('span', { class: 'mono' }, m.unit_id), ` «${m.word}» (${m.category}): `,
          m.defect == null ? 'рецензент не ответил' : m.defect ? h('b', null, 'дефект') : 'не дефект',
          m.reason ? h('span', { class: 'muted' }, ` — ${m.reason}`) : null)))));
    }
    if (notes.length) box.append(h('div', { class: 'card pad notes', style: 'margin-bottom:12px' }, notes));
    if (!R.units.length) {
      box.append(h('div', { class: 'card empty' }, 'Требования не выделены: прогон не дошёл до нарезки или в документе их не нашлось. ' +
        'Причина указана на вкладке «Ход прогона».'));
      return box;
    }
    const body = h('tbody');
    for (const u of R.units) {
      const related = R.findings.filter((f) => f.unit_ids.includes(u.id));
      const row = h('tr', { class: 'click', tabindex: '0', title: 'Показать в документе' },
        h('td', { class: 'mono' }, u.id),
        h('td', { class: 'mono' }, u.doc_label || h('span', { class: 'muted', style: 'font-family:var(--sans)' }, 'нет, присвоен агентом')),
        h('td', null, KIND_RU[u.kind] || u.kind),
        h('td', null, u.place),
        h('td', null, u.summary),
        h('td', null, related.length ? related.map((f) => h('button', { class: `chip ${f.severity}`, type: 'button', style: 'margin:0 4px 4px 0',
          title: f.title, onclick: (e) => { e.stopPropagation(); select(f.id, 'jump'); } }, h('b', null, f.id), SEV[f.severity].word))
          : h('span', { class: 'muted' }, R.checks_ran ? 'замечаний нет' : '—')));
      onActivate(row, (e) => { if (!e.target.closest('.chip')) flashBlocks(u.block_ids); });
      body.append(row);
    }
    box.append(h('div', { class: 'card table-scroll' }, h('table', { class: 'grid-table' },
      h('thead', null, h('tr', null, h('th', null, 'ID в отчёте'), h('th', null, 'ID в документе'), h('th', null, 'Тип'),
        h('th', null, 'Место'), h('th', null, 'Формулировка'), h('th', null, 'Находки'))), body)));
    return box;
  }

  function tabMatrix() {
    const box = h('div', { class: 'tabpanel' });
    if (!R.units.length || !R.checks_ran) {
      box.append(h('div', { class: 'card empty' }, 'Матрица строится по результатам проверки требований, а в этом прогоне она не выполнялась.'));
      return box;
    }
    const failed = new Set((R.check_failures || []).filter((c) => c.stage === 's5').map((c) => c.cell));
    const checked = new Map(); // "unit|criterion" -> true
    const setChecked = new Set();
    for (const cell of R.cells || []) {
      if (failed.has(cell.title)) continue;
      for (const c of cell.criteria) {
        // A cell over the whole set says nothing about one requirement's own criteria.
        if (!cell.unit_ids.length && criterion(c).level !== 'requirement') setChecked.add(c);
        for (const u of cell.unit_ids) checked.set(`${u}|${c}`, true);
      }
    }
    const used = new Set();
    for (const cell of R.cells || []) for (const c of cell.criteria) if (cell.unit_ids.length) used.add(c);
    for (const f of R.findings) if (f.unit_ids.length) used.add(f.criterion);
    const order = Object.keys(R.criteria).filter((c) => used.has(c));
    const levels = { requirement: 'Отдельное требование', set: 'Набор требований', document: 'Документ' };
    const groups = [];
    for (const c of order) {
      const level = criterion(c).level;
      if (groups.length && groups[groups.length - 1].level === level) groups[groups.length - 1].span++;
      else groups.push({ level, span: 1 });
    }
    box.append(h('div', { class: 'legend' },
      Object.keys(SEV).map((s) => h('span', { class: 'swatch' }, h('span', { class: `cellbox ${s}` }, SEV[s].letter), SEV[s].word)),
      h('span', { class: 'swatch' }, h('span', { class: 'cellbox ok' }, '✓'), 'без замечаний'),
      h('span', { class: 'swatch' }, h('span', { class: 'cellbox none' }, '·'), 'не проверялось')));
    const table = h('table', { class: 'matrix card' });
    table.append(h('thead', null,
      h('tr', null, h('th', { class: 'group corner', rowspan: '2' }, 'Требование'),
        groups.map((g) => h('th', { class: 'group', colspan: String(g.span) }, levels[g.level] || g.level))),
      h('tr', null, order.map((c) => h('th', { title: criterion(c).standard || '' }, h('div', { class: 'vert' }, criterion(c).label))))));
    const body = h('tbody');
    for (const [n, u] of R.units.entries()) {
      const row = h('tr', { style: `--i:${n}` }, onActivate(h('th', { class: 'rowhead mono', tabindex: '0', title: u.summary }, unitLabel(u.id)),
        () => flashBlocks(u.block_ids)));
      for (const c of order) {
        const hits = R.findings.filter((f) => f.criterion === c && f.unit_ids.includes(u.id))
          .sort((a, b) => SEV[a.severity].rank - SEV[b.severity].rank);
        let cell;
        if (hits.length) {
          const worst = hits[0];
          cell = h('button', { type: 'button', title: hits.map((f) => `${f.id} · ${SEV[f.severity].word} · ${f.title}`).join('\n'),
            'aria-label': `${u.id}, ${criterion(c).label}: ${SEV[worst.severity].word}, ${hits.map((f) => f.id).join(', ')}`,
            onclick: () => select(worst.id, 'jump') },
            h('span', { class: `cellbox ${worst.severity}` }, hits.length > 1 ? hits.length : SEV[worst.severity].letter));
        } else if (checked.has(`${u.id}|${c}`) || setChecked.has(c)) {
          cell = h('span', { class: 'cellbox ok', title: 'без замечаний' }, '✓');
        } else {
          cell = h('span', { class: 'cellbox none', title: 'не проверялось' }, '·');
        }
        row.append(h('td', null, cell));
      }
      body.append(row);
    }
    table.append(body);
    box.append(h('div', { class: 'table-scroll', style: 'overflow:visible' }, table));
    return box;
  }

  function evidenceSide(f, ev, n) {
    const owners = unitsOfBlock.get(ev.block_id) || [];
    return h('div', { class: 'side' },
      h('div', { class: 'muted' }, owners.length ? h('span', { class: 'mono' }, owners.map(unitLabel).join(', ')) : 'вне требований',
        ev.place && ev.place !== '—' ? ` · ${ev.place}` : ''),
      h('blockquote', { class: 'quote' }, ev.display || ev.quote,
        h('footer', null, ev.verified ? h('span', { class: 'verified' }, checkIcon(), 'подтверждена кодом') : h('span', { class: 'verified no' }, 'не проверена кодом'),
          h('button', { class: 'linkish', type: 'button', onclick: () => { select(f.id, 'jump'); scrollToEvidence(f, n); } }, 'показать в документе'))));
  }
  function tabSet() {
    const box = h('div', { class: 'tabpanel' });
    if (!R.checks_ran) {
      box.append(h('div', { class: 'card empty' }, 'Набор требований не проверялся: прогон остановился раньше.'));
      return box;
    }
    const setLevel = R.findings.filter((f) => f.scope !== 'requirement');
    const conflicts = setLevel.filter((f) => f.criterion === 'set_consistent');
    const others = setLevel.filter((f) => f.criterion !== 'set_consistent');
    box.append(h('h2', { style: 'margin-bottom:10px' }, `Противоречия между требованиями: ${conflicts.length}`));
    if (!conflicts.length) box.append(h('div', { class: 'card empty' }, 'Противоречий между требованиями не найдено.'));
    for (const f of conflicts) {
      box.append(h('section', { class: 'card pair' },
        h('div', { class: 'pair-head' }, h('span', { class: `sev ${f.severity}` }, SEV[f.severity].word),
          h('span', { class: 'mono' }, f.id), h('span', { class: 'ftitle' }, f.title),
          h('button', { class: 'linkish', type: 'button', onclick: () => select(f.id, 'jump') }, 'открыть находку')),
        h('div', { class: 'pair-body' }, f.evidence.map((ev, n) => evidenceSide(f, ev, n))),
        h('div', { class: 'pair-note' }, f.explanation)));
    }
    if (others.length) {
      box.append(h('h2', { style: 'margin:18px 0 10px' }, `Другие дефекты набора и документа: ${others.length}`));
      const body = h('tbody');
      for (const f of others) {
        const row = h('tr', { class: 'click', tabindex: '0' },
          h('td', null, h('span', { class: `sev ${f.severity}` }, SEV[f.severity].word)),
          h('td', { class: 'mono' }, f.id), h('td', null, criterion(f.criterion).label), h('td', null, f.title),
          h('td', { class: 'mono' }, f.unit_ids.join(', ') || '—'));
        onActivate(row, () => select(f.id, 'jump'));
        body.append(row);
      }
      box.append(h('div', { class: 'card table-scroll' }, h('table', { class: 'grid-table' },
        h('thead', null, h('tr', null, h('th', null, 'Критичность'), h('th', null, 'ID'), h('th', null, 'Критерий'),
          h('th', null, 'Находка'), h('th', null, 'Требования'))), body)));
    }
    if (R.facts && R.facts.conflicts && R.facts.conflicts.length) {
      const factById = new Map(R.facts.facts.map((x) => [x.id, x]));
      box.append(h('h2', { style: 'margin:18px 0 10px' }, `Расхождения значений, найденные кодом: ${R.facts.conflicts.length}`));
      for (const c of R.facts.conflicts) {
        const facts = c.fact_ids.map((id) => factById.get(id)).filter(Boolean);
        box.append(h('section', { class: 'card pair' },
          h('div', { class: 'pair-head' }, h('span', { class: 'ftitle' }, c.summary)),
          h('div', { class: 'pair-body' }, facts.map((x) => h('div', { class: 'side' },
            h('div', { class: 'muted' }, h('span', { class: 'mono' }, x.id), ` · ${x.entity_label}: `, h('b', null, x.value)),
            h('blockquote', { class: 'quote' }, x.display || x.quote, h('footer', null,
              h('button', { class: 'linkish', type: 'button', onclick: () => flashBlocks([x.block_id]) }, 'показать в документе'))))))));
      }
    }
    return box;
  }

  function tabQuestions() {
    const box = h('div', { class: 'tabpanel' });
    if (!R.questions.length) {
      box.append(h('div', { class: 'card empty' }, (R.completed || []).includes('s8')
        ? 'Вопросов к автору нет: находки не требуют уточнений.'
        : 'Вопросы не сформулированы: прогон не дошёл до этапа s8.'));
      return box;
    }
    const body = h('tbody');
    for (const q of R.questions) {
      body.append(h('tr', null,
        h('td', { class: 'mono' }, q.id), h('td', { class: 'prio' }, PRIORITY_RU[q.priority] || q.priority), h('td', null, q.addressee),
        h('td', null, q.text, q.answer ? h('p', { class: 'fix-text', style: 'margin:6px 0 0' }, h('b', null, 'Ответ автора: '), q.answer) : null),
        h('td', null, q.blocks_development ? h('b', null, 'да') : 'нет'),
        h('td', null, q.finding_ids.map((id) => findingById.get(id)).filter(Boolean).map((f) =>
          h('button', { class: `chip ${f.severity}`, type: 'button', style: 'margin:0 4px 4px 0', title: f.title,
            onclick: () => select(f.id, 'jump') }, h('b', null, f.id), SEV[f.severity].word)))));
    }
    box.append(h('div', { class: 'card table-scroll' }, h('table', { class: 'grid-table' },
      h('thead', null, h('tr', null, h('th', null, 'ID'), h('th', null, 'Приоритет'), h('th', null, 'Кому'), h('th', null, 'Вопрос'),
        h('th', null, 'Блокирует разработку'), h('th', null, 'Находки'))), body)));
    return box;
  }

  function tabRun() {
    const box = h('div', { class: 'tabpanel' });
    append(box, [runNotice(R.progress), stageChain(R.progress)]);
    const rows = [];
    const row = (label, value) => { if (value != null && value !== '') rows.push(h('tr', null, h('td', { class: 'muted', style: 'width:260px' }, label), h('td', null, value))); };
    row('Идентификатор прогона', h('span', { class: 'mono' }, R.run_id));
    row('SHA-256 входного файла', P.input_sha256 ? h('span', { class: 'mono' }, P.input_sha256) : null);
    if (R.intake) {
      row('Формат по содержимому', R.intake.detected_format);
      row('Размер', `${R.intake.size_bytes} байт`);
      row('Кодировка', R.intake.encoding);
    }
    if (R.document) {
      row('Цепочка чтения', (R.document.reader_chain || []).join(' → '));
      row('Блоков текста', R.document.blocks.length);
    }
    if (typeof P.llm_calls === 'number') row('Запросов к модели', `${P.llm_calls}, ответов из кэша: ${P.llm_cache_hits}`);
    if (P.llm_calls) {
      row('Токены', `вход ${P.llm_input_tokens} (из кэша провайдера ${P.llm_cached_tokens}), выход ${P.llm_output_tokens}`);
      row('Стоимость по справочнику цен', `≈ $${P.llm_cost_usd.toFixed(2).replace('.', ',')}`);
    }
    if (R.rejected && R.checks_ran) {
      row('Кандидатов отклонено оппонентом и арбитром', R.rejected.by_review);
      row('Кандидатов отклонено проверкой цитат', R.rejected.by_gate);
    }
    if (rows.length) box.append(h('div', { class: 'card table-scroll', style: 'margin-top:14px' }, h('table', { class: 'grid-table' }, h('tbody', null, rows))));
    const notes = [...(P.setup_notes || []), ...((R.intake && R.intake.warnings) || []), ...((R.document && R.document.warnings) || []),
      ...((R.document && R.document.issues) || []).map((i) => (i.line ? `строка ${i.line}: ` : '') + i.message)];
    if (notes.length) box.append(h('div', { class: 'card pad', style: 'margin-top:12px' }, h('div', { class: 'section-title' }, 'Замечания настройки и чтения'),
      notes.map((n) => h('p', { style: 'margin:0 0 4px' }, n))));
    return box;
  }

  const builders = { units: tabUnits, matrix: tabMatrix, set: tabSet, questions: tabQuestions, run: tabRun };
  function showTab(id) {
    state.tab = id;
    for (const [name, button] of tabButtons) button.setAttribute('aria-selected', String(name === id));
    clear(panel);
    if (id === 'doc') {
      panel.className = 'wrap';
      panel.append(paneSwitch, split);
      paintActive();
    } else {
      panel.className = 'wrap';
      panel.append(builders[id]());
    }
    moveIndicator();
  }

  clear(app).append(head, tabs, panel);
  setPane('doc');
  drawList();
  showTab('doc');
}

route();
})();
</script>
</body>
</html>
