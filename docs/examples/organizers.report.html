рисутствуют в API, а их типы и обязательность не противоречат друг другу.", "block_ids": ["b0017", "b0031", "b0063"]}], "findings": [{"id": "D-001", "scope": "set", "criterion": "set_complete", "unit_ids": ["R-002"], "title": "В API не передается сумма расходов за месяц для UI", "explanation": "Интерфейс приложения требует отображения суммы расходов за месяц. Однако API уведомлений не предусматривает передачу этого значения ни в методе сохранения, ни в отсутствующем методе чтения. Без этих данных мобильное приложение не сможет корректно отрисовать экран интерфейса пользователя.", "evidence": [{"block_id": "b0018", "quote": "На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить».", "verified": true, "place": "строка 29", "display": "На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить».", "span": [31, 115]}, {"block_id": "b0034", "quote": "Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API».", "verified": true, "place": "строка 52", "display": "Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API».", "span": [0, 109]}], "severity": "critical", "suggestion": "Добавить параметр с накопленной суммой расходов за месяц (например, `monthlyExpenses`) в ответ метода чтения настроек.", "status": "confirmed", "trail": ["reviewer", "opponent:upheld", "gate:passed"], "question": "Какой метод API должен возвращать приложению накопленную сумму расходов за месяц для отображения на экране?", "question_to": "analyst", "cell": "parent_child", "severity_reason": null, "remark": false, "merged": [], "review_note": "Документ требует отображать на экране сумму расходов за месяц, но не описывает, как приложение получает эти данные из API или другого источника. Это критический пробел в интеграционном взаимодействии, необходимый для работы UI.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-002", "scope": "set", "criterion": "set_complete", "unit_ids": ["R-002", "R-008", "R-011", "R-016", "R-020", "R-026"], "title": "В спецификации API отсутствует метод чтения настроек", "explanation": "Часть A требует, чтобы мобильное приложение читало и отображало текущие настройки пользователя и сумму расходов за месяц. Однако в спецификации REST API (Часть B) описан только метод сохранения `/alerts/saveLimit`, а метод для получения данных отсутствует. Без него разработчики не смогут реализовать открытие экрана уведомлений.", "evidence": [{"block_id": "b0018", "quote": "На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить».", "verified": true, "place": "строка 29", "display": "На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить».", "span": [31, 115]}, {"block_id": "b0034", "quote": "Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API».", "verified": true, "place": "строка 52", "display": "Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API».", "span": [0, 109]}, {"block_id": "b0067", "quote": "Сохранение порога. Функциональные требования: чтение порога", "verified": true, "place": "строка 103", "display": "Сохранение порога. Функциональные требования: чтение порога", "span": [20, 79]}, {"block_id": "b0072", "quote": "Dev: `/alerts/saveLimit` . Prod: —", "verified": true, "place": "строка 108", "display": "Dev: /alerts/saveLimit . Prod: —", "span": [20, 54]}], "severity": "critical", "suggestion": "Добавить в Часть B спецификацию метода для получения текущих настроек пользователя, возвращающего установленный порог и статус переключателя.", "status": "confirmed", "trail": ["reviewer", "opponent:fix_rewritten", "opponent:upheld", "gate:passed", "merged:D-010", "merged:D-011", "merged:D-012", "merged:D-013"], "question": "Где описан API-метод для получения приложением суммы за месяц и текущих настроек при открытии экрана?", "question_to": "analyst", "cell": "focus-1", "severity_reason": null, "remark": false, "merged": [{"title": "Отсутствует API-метод для чтения порога", "criterion": "set_complete", "severity": "critical", "explanation": "Архитектура решения предполагает, что приложение и сервис расходов получают текущие настройки порога через REST API. Однако в спецификации API (Часть B) описан только метод сохранения порога (`/alerts/saveLimit`), а метод для чтения настроек отсутствует. Без него приложение не сможет отобразить текущий порог при открытии экрана, а бэкенд не сможет проверить достижение лимита."}, {"title": "Отсутствует метод чтения текущего порога карты", "criterion": "set_consistent", "severity": "critical", "explanation": "Сценарий интеграции требует получения порога карты сервисом расходов. Однако спецификация API описывает только операцию сохранения, где параметры amount и enabled обязательны, что делает невозможным простое чтение настроек без их изменения."}, {"title": "Отсутствует метод API для чтения настроек", "criterion": "set_complete", "severity": "critical", "explanation": "Основной документ требует, чтобы приложение читало и сохраняло настройки через API, и спецификация API заявляет чтение в описании. Однако в спецификации описан только метод сохранения порога (`saveLimit`), а метод для чтения отсутствует. Разработчики мобильного приложения не смогут реализовать инициализацию экрана настроек."}, {"title": "Чтение порога требует обязательной перезаписи", "criterion": "set_consistent", "severity": "critical", "explanation": "В описании метода заявлено выполнение функционального требования по чтению порога. При этом параметры amount и enabled указаны как обязательные, а логика метода всегда выполняет замену настройки. Клиент не может запросить текущие настройки порога, не передав новые значения, что делает безопасное чтение невозможным."}], "review_note": "Документ требует, чтобы приложение читало настройки через REST API, но метод чтения отсутствует. Предложенное исправление некорректно, так как по архитектуре сервис настроек не имеет доступа к сумме расходов, поэтому метод должен возвращать только сами настройки.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-003", "scope": "set", "criterion": "set_complete", "unit_ids": ["R-004"], "title": "Отсутствует валидация активности и валюты карты в API", "explanation": "Бизнес-требования разрешают устанавливать порог только для активных карт в валюте KZT. Однако в логике работы метода API проверяется только принадлежность карты клиенту, а проверки статуса активности и валюты карты отсутствуют. Это приведет к тому, что клиент сможет установить порог по заблокированной или валютной карте.", "evidence": [{"block_id": "b0023", "quote": "Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно.", "verified": true, "place": "строка 37", "display": "Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно.", "span": [11, 96]}, {"block_id": "b0081", "quote": "2. Проверить принадлежность карты клиенту.", "verified": true, "place": "строка 118", "display": "Проверить принадлежность карты клиенту.", "span": [0, 42]}], "severity": "critical", "suggestion": "Добавить в раздел «Логика работы метода» проверки: статус карты — активна, валюта счета карты — KZT. При невыполнении возвращать ошибку с соответствующим сообщением.", "status": "confirmed", "trail": ["reviewer", "opponent:upheld", "calibrated:major→critical", "gate:passed"], "question": "Должен ли метод API сам проверять статус и валюту карты, или это обеспечивается на стороне фронтенда?", "question_to": "analyst", "cell": "parent_child", "severity_reason": "Противоречие между функциональным требованием и логикой API заставит команду выбирать, нужно ли реализовывать проверку валюты и статуса карты.", "remark": false, "merged": [], "review_note": "Бизнес-требования явно ограничивают функционал только для активных карт в валюте KZT, но в логике работы API эти проверки отсутствуют. Отсутствие проверок в альтернативных сценариях является валидным дефектом со статусом major.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-004", "scope": "pair", "criterion": "set_consistent", "unit_ids": ["R-003", "R-005", "R-014"], "title": "Противоречие в правиле определения месяца покупки", "explanation": "Правило Ф-2 устанавливает, что месяц определяется по дате совершения покупки (в примере — 31 января). Однако критерий приемки ожидает, что покупка, совершенная 31 января, но проведенная 1 февраля, увеличит февральский счетчик. Разработчикам неясно, какую дату использовать для отнесения суммы к месяцу: дату авторизации (совершения) или дату клиринга (проведения).", "evidence": [{"block_id": "b0024", "quote": "Месяц определяется по дате совершения покупки в Алматы.", "verified": true, "place": "строка 38", "display": "Месяц определяется по дате совершения покупки в Алматы.", "span": [11, 66]}, {"block_id": "b0041", "quote": "Покупка 31 января в 23:58 на 4 000 ₸", "verified": true, "place": "строка 64", "display": "Покупка 31 января в 23:58 на 4 000 ₸", "span": [2, 38]}, {"block_id": "b0041", "quote": "Провести 1 февраля в 00:03 по Алматы", "verified": true, "place": "строка 64", "display": "Провести 1 февраля в 00:03 по Алматы", "span": [41, 77]}, {"block_id": "b0041", "quote": "Февральский счётчик вырос на 4 000 ₸", "verified": true, "place": "строка 64", "display": "Февральский счётчик вырос на 4 000 ₸", "span": [80, 116]}], "severity": "critical", "suggestion": "Выбрать, по какой дате определяется месяц. Если по дате проведения, изменить в Ф-2 «по дате совершения покупки» на «по дате проведения покупки». Если по дате совершения, исправить в таблице критериев приемки ожидаемый результат на «Январский счётчик вырос на 4 000 ₸».", "status": "confirmed", "trail": ["reviewer", "merged:acceptance#1", "merged:values#2", "merged:focus-2#5", "opponent:fix_rewritten", "opponent:upheld", "gate:passed", "merged:D-001"], "question": "По какой дате покупка относится к месяцу: по дате совершения (авторизации) или по дате проведения (клиринга)?", "question_to": "product_owner", "cell": "consistency", "severity_reason": null, "remark": false, "merged": [{"title": "Многозначность термина «проведённые покупки»", "criterion": "unambiguous", "severity": "critical", "explanation": "Термин «проведённые покупки» может означать как успешно авторизованные операции (холдирование), так и операции, прошедшие финансовое списание (клиринг). Если разработчики реализуют расчет по клирингу, который происходит через несколько дней, это нарушит прямое требование извещать клиента «в момент покупки»."}], "review_note": "Правило Ф-2 устанавливает определение месяца по дате совершения, тогда как критерий приемки демонстрирует определение месяца по дате проведения. В ситуации, когда эти даты попадают в разные месяцы (как в примере 31 января / 1 февраля), возникает противоречие, ведущее к разному поведению.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-005", "scope": "requirement", "criterion": "complete", "unit_ids": ["R-006"], "title": "Не указан текст push-уведомления", "explanation": "В требовании сказано, что клиент получает уведомление, но не задан его текст. Разработчикам неизвестно, какие именно слова и переменные (например, сумму или маску карты) выводить в сообщении, чтобы клиент понял суть уведомления.", "evidence": [{"block_id": "b0025", "quote": "* **Ф-3.** Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push.", "verified": true, "place": "строка 39", "display": "Ф-3. Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push.", "span": [4, 110]}], "severity": "critical", "suggestion": "В разделе «Функциональные требования» указать точный шаблон текста push-уведомления с переменными, например: «Превышен лимит расходов. Месячная сумма достигла {amount} ₸».", "status": "confirmed", "trail": ["reviewer", "opponent:fix_rewritten", "opponent:upheld", "gate:passed"], "question": "Какой точный текст должен быть у отправляемого push-уведомления?", "question_to": "product_owner", "cell": "req-01", "severity_reason": null, "remark": false, "merged": [], "review_note": "Текст push-уведомления — это результат работы основного сценария (core flow), который видит клиент. Его отсутствие приведет к тому, что разработчикам придется угадывать текст сообщения, что недопустимо для спецификации.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-006", "scope": "pair", "criterion": "set_consistent", "unit_ids": ["R-006", "R-007"], "title": "Противоречие в лимите уведомлений при изменении порога", "explanation": "Правило Ф-3 ограничивает количество уведомлений до одного в месяц на карту. Однако Ф-4 утверждает, что при повышении порога новое достижение вызовет push независимо от истории. Если клиент уже получил уведомление в этом месяце, а затем повысил порог и снова его достиг, оба правила применяются одновременно и требуют взаимоисключающих действий (отправить и не отправить).", "evidence": [{"block_id": "b0025", "quote": "На карту приходится максимум один такой push за календарный месяц.", "verified": true, "place": "строка 39", "display": "На карту приходится максимум один такой push за календарный месяц.", "span": [111, 177]}, {"block_id": "b0026", "quote": "Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.", "verified": true, "place": "строка 40", "display": "Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.", "span": [63, 170]}], "severity": "critical", "suggestion": "Выбрать приоритетное правило. Если можно отправлять несколько пушей при смене порога, добавить в Ф-3 исключение: «кроме случаев изменения порога (см. Ф-4)». Если действует жесткий лимит один пуш в месяц, в Ф-4 заменить «независимо от истории» на условие «если в этом месяце пуш еще не отправлялся».", "status": "confirmed", "trail": ["reviewer", "merged:values#1", "opponent:fix_rewritten", "opponent:upheld", "gate:passed"], "question": "Может ли клиент получить второе уведомление за месяц, если он повысил порог после первого срабатывания?", "question_to": "product_owner", "cell": "consistency", "severity_reason": null, "remark": false, "merged": [], "review_note": "Ф-3 строго ограничивает количество уведомлений одним за календарный месяц, а Ф-4 требует отправки пуша при достижении нового порога независимо от истории. Если клиент получил пуш, а затем в том же месяце повысил порог и снова его достиг, оба правила применимы, но требуют противоположных действий (не отправлять по Ф-3 и отправить по Ф-4).", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-007", "scope": "requirement", "criterion": "complete", "unit_ids": ["R-007"], "title": "Нет правила для нового порога ниже текущих расходов", "explanation": "Требование Ф-4 описывает логику только для случая, когда накопленная сумма строго ниже нового порога. Неясно, как должна вести себя система, если пользователь задает порог, который уже равен текущим расходам или меньше их: отправить push немедленно при сохранении настройки или не отправлять ничего.", "evidence": [{"block_id": "b0026", "quote": "При изменении порога накопленная сумма сохраняется. Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.", "verified": true, "place": "строка 40", "display": "При изменении порога накопленная сумма сохраняется. Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.", "span": [11, 170]}], "severity": "critical", "suggestion": "Дополнить Ф-4 правилом: «Если накопленная сумма равна новому порогу или превышает его, push-уведомление в момент сохранения не отправляется».", "status": "confirmed", "trail": ["reviewer", "opponent:fix_rewritten", "opponent:upheld", "calibrated:major→critical", "gate:passed"], "question": "Нужно ли отправлять push при сохранении порога, если расходы месяца уже равны ему или превышают его?", "question_to": "product_owner", "cell": "focus-1", "severity_reason": "Отсутствие правила для случая, когда новый порог меньше накопленных расходов, заставит команду угадывать, нужно ли отправлять уведомление в этот момент.", "remark": false, "merged": [], "review_note": "В правиле Ф-4 действительно пропущен сценарий, когда текущие расходы уже равны или превышают новый порог. Предложенное исправление некорректно, так как запрет уведомлений «до конца месяца» нарушит логику в случае возврата покупки, который опустит сумму ниже порога, сделав возможным новое достижение.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-008", "scope": "requirement", "criterion": "unambiguous", "unit_ids": ["R-008"], "title": "Неясно, какая сумма передаётся в push", "explanation": "Слово «сумму» можно интерпретировать по-разному: это может быть сумма текущей операции (покупки), общая сумма накопленных расходов за месяц или размер установленного порога. Неясно, какое значение сервис расходов должен передавать для отправки.", "evidence": [{"block_id": "b0028", "quote": "Сервис расходов → push: передать последние четыре цифры карты и сумму при достижении порога.", "verified": true, "place": "строка 43", "display": "Сервис расходов → push: передать последние четыре цифры карты и сумму при достижении порога.", "span": [100, 192]}], "severity": "critical", "suggestion": "Уточнить, какая именно сумма передаётся, например: «...и накопленную сумму расходов за месяц при достижении порога».", "status": "confirmed", "trail": ["reviewer", "opponent:adjusted", "gate:passed"], "question": "Какую сумму нужно передавать в сервис push: сумму последней покупки, общие расходы за месяц или сам порог?", "question_to": "analyst", "cell": "req-01", "severity_reason": null, "remark": false, "merged": [], "review_note": "Слово «сумму» действительно неоднозначно: в системе есть сумма текущей покупки, сумма установленного порога и накопленная сумма расходов. Разные команды могут передать разные значения в интеграции, что приведет к ошибкам в уведомлениях.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-009", "scope": "requirement", "criterion": "unambiguous", "unit_ids": ["R-016"], "title": "Противоречивое описание назначения метода API", "explanation": "В описании одновременно указаны два разных действия: «Сохранение порога» и «чтение порога». Разработчику неясно, должен ли этот метод только изменять настройки, только возвращать их, или выполнять оба действия.", "evidence": [{"block_id": "b0067", "quote": "| **Description** | Сохранение порога. Функциональные требования: чтение порога |", "verified": true, "place": "строка 103", "display": "Description · Сохранение порога. Функциональные требования: чтение порога", "span": [4, 79]}], "severity": "critical", "suggestion": "Оставить в описании только то действие, которое фактически выполняет метод, например: «Сохранение порога».", "status": "confirmed", "trail": ["reviewer", "opponent:severity_disputed", "arbiter:severity", "calibrated:minor→critical", "gate:passed"], "question": "Метод предназначен для сохранения порога или для его чтения?", "question_to": "analyst", "cell": "req-03", "severity_reason": "Противоречие в описании назначения метода вызывает конфликт с его логикой и блокирует реализацию функционала чтения порога.", "remark": false, "merged": [], "review_note": "Оппонент: В поле Description действительно присутствует путаница между чтением и сохранением. Однако логика работы метода описана пошагово и однозначно, поэтому реализация не пострадает. Дефект касается только информационного поля. Арбитр: Поле Description является информационным текстом, в то время как фактическое поведение системы детально и однозначно описано в разделе «Логика работы метода» [b0080]–[b0084]. Согласно шкале критичности, дефекты формулировок, не влияющие на работу системы, оцениваются как minor.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-010", "scope": "set", "criterion": "set_complete", "unit_ids": ["R-001", "R-009"], "title": "Нет обработки сбоев сервиса push", "explanation": "Документ не описывает поведение системы в случае недоступности сервиса push или возврата им ошибки. Неясно, должен ли сервис учета расходов повторять попытки отправки уведомления, с каким интервалом, или уведомление считается безвозвратно потерянным.", "evidence": [{"block_id": "b0016", "quote": "Карточный процессинг → учёт расходов → сервис push.", "verified": true, "place": "строка 26", "display": "Карточный процессинг → учёт расходов → сервис push.", "span": [40, 91]}, {"block_id": "b0030", "quote": "Сервис передаёт push на отправку в течение минуты после получения события.", "verified": true, "place": "строка 46", "display": "Сервис передаёт push на отправку в течение минуты после получения события.", "span": [0, 74]}], "severity": "major", "suggestion": "Описать в нефункциональных требованиях сценарий при недоступности сервиса push: зафиксировать количество и интервал повторных попыток отправки или указать, что при сбое событие только логируется без повторных попыток.", "status": "confirmed", "trail": ["reviewer", "opponent:fix_rewritten", "opponent:upheld", "gate:passed"], "question": null, "question_to": null, "cell": "completeness", "severity_reason": null, "remark": false, "merged": [], "review_note": "Недоступность или ошибки стороннего сервиса (сервиса push) — это стандартный сценарий сбоя, для которого на уровне требований должно быть определено поведение системы (например, логирование, отказ или повторные попытки). Отсутствие этого описания оставляет пробел во вторичном сценарии.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-011", "scope": "set", "criterion": "set_complete", "unit_ids": ["R-002", "R-004"], "title": "Не указаны тексты ошибок валидации в UI", "explanation": "Спецификация UI требует отображать сообщение при ошибке ввода порога, однако сами тексты сообщений не приведены. Тестировщики и разработчики будут вынуждены самостоятельно придумывать тексты для случаев, когда сумма меньше 1000, больше 1000000 или введено нечисловое значение, что приведет к расхождениям.", "evidence": [{"block_id": "b0018", "quote": "При ошибке ввода сообщение появляется под полем.", "verified": true, "place": "строка 29", "display": "При ошибке ввода сообщение появляется под полем.", "span": [116, 164]}, {"block_id": "b0023", "quote": "Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно.", "verified": true, "place": "строка 37", "display": "Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно.", "span": [11, 96]}], "severity": "major", "suggestion": "В разделе «Дизайн процесса UI» зафиксировать конкретные тексты сообщений об ошибках для трех сценариев: введено значение меньше 1000, введено значение больше 1 000 000, введено нечисловое значение.", "status": "confirmed", "trail": ["reviewer", "opponent:fix_rewritten", "opponent:upheld", "gate:passed"], "question": null, "question_to": null, "cell": "completeness", "severity_reason": null, "remark": false, "merged": [], "review_note": "Тексты сообщений об ошибках, которые показываются пользователю, являются частью требований к поведению интерфейса. Поскольку спецификация требует показывать сообщение при ошибке ввода, отсутствие самих текстов оставляет этот аспект неопределенным.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-012", "scope": "requirement", "criterion": "conforming", "unit_ids": ["R-016", "R-020"], "title": "Использование метода GET для изменения данных", "explanation": "Спецификация описывает метод сохранения и изменения порога как HTTP-запрос GET. По стандартам REST метод GET должен использоваться только для безопасного чтения и быть идемпотентным, а изменение данных должно выполняться методами POST, PUT или PATCH.", "evidence": [{"block_id": "b0068", "quote": "| **REST type** | GET |", "verified": true, "place": "строка 104", "display": "REST type · GET", "span": [4, 21]}, {"block_id": "b0083", "quote": "4. Заменить настройку и вернуть результат сохранения.", "verified": true, "place": "строка 120", "display": "Заменить настройку и вернуть результат сохранения.", "span": [0, 53]}, {"block_id": "b0067", "quote": "| **Description** | Сохранение порога. Функциональные требования: чтение порога |", "verified": true, "place": "строка 103", "display": "Description · Сохранение порога. Функциональные требования: чтение порога", "span": [4, 79]}], "severity": "major", "suggestion": "Изменить тип метода с GET на POST или PUT.", "status": "confirmed", "trail": ["reviewer", "opponent:upheld", "gate:passed", "merged:D-017"], "question": "Какой HTTP-метод (POST или PUT) следует использовать для сохранения настроек вместо GET?", "question_to": "architect", "cell": "api_contract", "severity_reason": null, "remark": false, "merged": [{"title": "Использование GET для изменения данных", "criterion": "conforming", "severity": "major", "explanation": "Метод предназначен для сохранения порога, но использует HTTP-метод GET. Использование GET для изменения состояния на сервере нарушает стандартную семантику REST и HTTP-методов, согласно которой GET должен быть безопасным."}], "review_note": "Использование метода GET для изменения состояния нарушает стандарты проектирования REST API, что подпадает под критерий conforming. Использование неподходящего HTTP-метода меняет поведение интерфейса.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-013", "scope": "pair", "criterion": "set_consistent", "unit_ids": ["R-021", "R-030"], "title": "Противоречие в составе полей при ошибке сохранения", "explanation": "Правило логики метода (п. 5) требует при отклонении суммы возвращать прежнее состояние (значения порога и переключателя). Однако таблица параметров ответа указывает, что поле amount возвращается только «При успехе», а пример ответа с ошибкой не содержит полей amount и enabled. Разработчик бэкенда не будет знать, включать ли эти поля в ответ с ошибкой.", "evidence": [{"block_id": "b0084", "quote": "5. При отклонении суммы вернуть прежнее состояние и результат ERROR.", "verified": true, "place": "строка 121", "display": "При отклонении суммы вернуть прежнее состояние и результат ERROR.", "span": [0, 68]}, {"block_id": "b0106", "quote": "| `amount` | string | При успехе | Порог в тенге | `limit_kzt` |", "verified": true, "place": "строка 156", "display": "amount · string · При успехе · Порог в тенге · limit_kzt", "span": [3, 61]}, {"block_id": "b0114", "quote": "{\"result\":\"ERROR\",\"message\":\"Проверьте сумму\"}", "verified": true, "place": "строки 170–172", "display": "{\"result\":\"ERROR\",\"message\":\"Проверьте сумму\"}", "span": [8, 54]}], "severity": "major", "suggestion": "Определить, нужно ли возвращать прежнее состояние при ошибке. Если да, в таблице ответа убрать условие «При успехе» для поля amount, а в пример ответа с ошибкой добавить поля amount и enabled. Если возвращать не нужно, удалить требование «вернуть прежнее состояние» из п. 5 логики работы метода.", "status": "confirmed", "trail": ["reviewer", "opponent:fix_rewritten", "opponent:upheld", "gate:passed"], "question": "Должен ли ответ с ошибкой содержать предыдущие значения порога и статуса включения?", "question_to": "analyst", "cell": "consistency", "severity_reason": null, "remark": false, "merged": [], "review_note": "Пункт 5 логики метода требует возвращать прежнее состояние (порог и признак включения) при отклонении суммы, однако таблица параметров ответа указывает, что amount возвращается только «При успехе», а пример ответа с ошибкой этих полей не содержит. Возникает противоречие в формате неуспешного ответа.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-014", "scope": "set", "criterion": "set_consistent", "unit_ids": ["R-019", "R-021", "R-031", "R-032"], "title": "Противоречие в коде ответа при ошибке валидации", "explanation": "Раздел «Статусы» указывает, что при неверных параметрах возвращается код 400. Однако в примере для успешного кода 200 показан ответ с результатом ERROR и сообщением об ошибке суммы. Неясно, какой HTTP-код (200 или 400) должен возвращать сервис при попытке сохранить сумму вне допустимого диапазона, что приведет к рассинхронизации обработки ошибок между клиентом и сервером.", "evidence": [{"block_id": "b0084", "quote": "5. При отклонении суммы вернуть прежнее состояние и результат ERROR.", "verified": true, "place": "строка 121", "display": "При отклонении суммы вернуть прежнее состояние и результат ERROR.", "span": [0, 68]}, {"block_id": "b0110", "quote": "**400.** Ответ в случае, если параметры запроса заполнены неверно.", "verified": true, "place": "строки 162–163", "display": "Ответ в случае, если параметры запроса заполнены неверно.", "span": [57, 121]}, {"block_id": "b0114", "quote": "{\"result\":\"ERROR\",\"message\":\"Проверьте сумму\"}", "verified": true, "place": "строки 170–172", "display": "{\"result\":\"ERROR\",\"message\":\"Проверьте сумму\"}", "span": [8, 54]}, {"block_id": "b0110", "quote": "**200.** Ответ в случае успешного выполнения метода.", "verified": true, "place": "строки 162–163", "display": "Ответ в случае успешного выполнения метода.", "span": [2, 52]}], "severity": "major", "suggestion": "Перенести пример ответа с ошибкой валидации из описания кода 200 в код 400. В пункте 5 раздела «Логика работы метода» заменить возврат результата ERROR на возврат HTTP-статуса 400. В таблице параметров ответа для поля result убрать значение ERROR.", "status": "confirmed", "trail": ["reviewer", "merged:focus-2#3", "opponent:fix_rewritten", "opponent:upheld", "gate:passed", "merged:D-022", "merged:D-023"], "question": "Какой HTTP-статус должен возвращаться, если сумма не проходит проверку: 200 с бизнес-ошибкой или 400 Bad Request?", "question_to": "architect", "cell": "parent_child", "severity_reason": null, "remark": false, "merged": [{"title": "Неоднозначное условие для кода 400", "criterion": "unambiguous", "severity": "major", "explanation": "Фраза «заполнены неверно» допускает разные трактовки. Один разработчик может возвращать 400 при нарушении бизнес-правил (например, сумма вне лимита), а другой — только при технических ошибках (отсутствие обязательного параметра или неверный тип данных)."}, {"title": "Ошибка валидации возвращается с HTTP-статусом 200", "criterion": "set_consistent", "severity": "major", "explanation": "Описание статус-кодов указывает, что 200 означает успех, а 400 — ошибку параметров. Однако в примере для успешного ответа (200) приведен JSON с ошибкой валидации суммы. HTTP-статусы и бизнес-результаты противоречат друг другу, что сломает обработку ошибок на клиенте."}], "review_note": "Подтверждается конфликт: для ошибки неверной суммы одновременно предписано возвращать HTTP 200 с результатом ERROR (в пункте 5 и примере) и HTTP 400 (общее описание статусов). Это приведет к рассинхронизации обработки ошибок.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-015", "scope": "pair", "criterion": "set_consistent", "unit_ids": ["R-027", "R-028"], "title": "Указание Content-Type при отсутствии тела запроса", "explanation": "В требованиях к запросу указан заголовок Content-Type: application/json, однако ниже явно сказано, что тело не используется (все параметры передаются в URL). Передача заголовка о типе контента для пустого тела избыточна и противоречива.", "evidence": [{"block_id": "b0100", "quote": "* **Content-Type:** `application/json` .", "verified": true, "place": "строка 147", "display": "Content-Type: application/json .", "span": [4, 40]}, {"block_id": "b0101", "quote": "* Тело не используется.", "verified": true, "place": "строка 148", "display": "Тело не используется.", "span": [2, 23]}], "severity": "major", "suggestion": "Удалить требование заголовка Content-Type для запроса или перенести параметры из строки запроса в JSON-тело.", "status": "confirmed", "trail": ["reviewer", "merged:consistency#4", "opponent:upheld", "gate:passed"], "question": "Следует ли передавать параметры в теле запроса (JSON) или убрать заголовок Content-Type?", "question_to": "analyst", "cell": "api_contract", "severity_reason": null, "remark": false, "merged": [], "review_note": "Противоречие действительно присутствует: указание заголовка Content-Type: application/json имеет смысл только при наличии тела запроса, однако ниже явно сказано, что тело не используется.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-016", "scope": "requirement", "criterion": "complete", "unit_ids": ["R-034", "R-036"], "title": "Отсутствует формат ответа для статуса 403 Forbidden", "explanation": "Статус 403 указан в списке возможных ответов метода, однако его описание и пример тела ответа пропущены. В разделе 403 вместо этого приведено описание статуса 404, что оставляет структуру ошибки 403 неизвестной для разработчиков.", "evidence": [{"block_id": "b0115", "quote": "**403.** Ответ в случае, если на указанный ресурс доступ запрещен.", "verified": true, "place": "строки 174–176", "display": "Ответ в случае, если на указанный ресурс доступ запрещен.", "span": [79, 143]}, {"block_id": "b0120", "quote": "#### 403. Unsuccessful — Forbidden", "verified": true, "place": "строка 188", "display": "#### 403. Unsuccessful — Forbidden", "span": [5, 34]}, {"block_id": "b0121", "quote": "Для чужой карты возвращается 404, как и для отсутствующей карты.", "verified": true, "place": "строки 189–190", "display": "Для чужой карты возвращается 404, как и для отсутствующей карты.", "span": [0, 64]}], "severity": "major", "suggestion": "Добавить пример JSON-ответа для статуса 403 или исключить этот статус из списка, если при ошибке доступа используется только 404.", "status": "confirmed", "trail": ["reviewer", "opponent:upheld", "gate:passed"], "question": "Какое тело ответа должно возвращаться при статусе 403?", "question_to": "analyst", "cell": "api_contract", "severity_reason": null, "remark": false, "merged": [], "review_note": "Структура и пример ответа для статуса 403 действительно пропущены в описании, вместо этого сразу приведён статус 404. Это является пробелом в описании возможных ошибок метода.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-017", "scope": "requirement", "criterion": "complete", "unit_ids": ["R-034"], "title": "Не описано условие возврата кода 403", "explanation": "Формулировка скопирована из стандарта HTTP и не задает конкретных условий для данного метода. Разработчик не будет знать, при каких именно бизнес-сценариях (какой ресурс и чьи права) API должно возвращать ошибку 403.", "evidence": [{"block_id": "b0115", "quote": "**403.** Ответ в случае, если на указанный ресурс доступ запрещен.", "verified": true, "place": "строки 174–176", "display": "Ответ в случае, если на указанный ресурс доступ запрещен.", "span": [79, 143]}], "severity": "major", "suggestion": "Явно описать конкретное бизнес-условие (например, отсутствие определенной роли), при провале которого метод вернет 403, либо указать на удаление этого кода из раздела «Статусы», чтобы не оставлять выбор за разработчиком.", "status": "confirmed", "trail": ["reviewer", "opponent:fix_rewritten", "opponent:upheld", "gate:passed"], "question": "При каком бизнес-условии метод должен вернуть статус 403?", "question_to": "analyst", "cell": "req-05", "severity_reason": null, "remark": false, "merged": [], "review_note": "Статус 403 указан в списке ответов, но документ не содержит ни одного бизнес-правила или сценария ограничения доступа, вызывающего этот статус. Это оставляет команду без понимания, когда применять код.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-018", "scope": "document", "criterion": "suspicious_content", "unit_ids": [], "title": "Мета-комментарий о состоянии текста", "explanation": "Документ содержит мета-информацию, адресованную проверяющему, которая описывает текущее состояние текста, а не требования к разрабатываемой системе. Подобных комментариев не должно быть в финальной спецификации.", "evidence": [{"block_id": "b0002", "quote": "Комплект из двух исходных документов. Текст требований не вычитывался и не исправлялся.", "verified": true, "place": "строки 3–4", "display": "Комплект из двух исходных документов. Текст требований не вычитывался и не исправлялся.", "span": [0, 87]}, {"block_id": "b0002", "quote": "Текст требований не вычитывался и не исправлялся.", "verified": true, "place": "строки 3–4", "display": "Текст требований не вычитывался и не исправлялся.", "span": [38, 87]}], "severity": "minor", "suggestion": "Удалить текст «Текст требований не вычитывался и не исправлялся.» и аналогичные мета-комментарии.", "status": "confirmed", "trail": ["reviewer", "merged:completeness#5", "opponent:upheld", "gate:passed", "merged:D-026"], "question": "Следует ли удалить мета-комментарии о состоянии текста из спецификации?", "question_to": "analyst", "cell": "req-04", "severity_reason": null, "remark": false, "merged": [{"title": "Служебный комментарий в тексте требований", "criterion": "suspicious_content", "severity": "minor", "explanation": "В документе содержится комментарий, описывающий процесс подготовки спецификации, который адресован проверяющему. Подобные мета-инструкции не являются частью требований и не должны присутствовать в финальном документе для разработчиков."}], "review_note": "В тексте действительно содержится мета-комментарий, адресованный читателю, о том, что документ не вычитывался. Подобные инструкции подпадают под suspicious_content.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}, {"id": "D-019", "scope": "document", "criterion": "document_integrity", "unit_ids": [], "title": "Незаполненные шаблонные разделы и чек-листы", "explanation": "В документе присутствуют незаполненные шаблонные разделы: требования к тестированию и чек-лист ревью. Это нарушает формальную целостность документа и скрывает информацию о реальном статусе согласования требований.", "evidence": [{"block_id": "b0037", "quote": "заполняются тестировщиками", "verified": true, "place": "строка 57", "display": "заполняются тестировщиками", "span": [0, 26]}, {"block_id": "b0044", "quote": "Документ (версия/дата) в источнике не заполнен. Пункты чек-листа приведены как в шаблоне, отметки не проставлены.", "verified": true, "place": "строка 68", "display": "Документ (версия/дата) в источнике не заполнен. Пункты чек-листа приведены как в шаблоне, отметки не проставлены.", "span": [0, 113]}], "severity": "minor", "suggestion": "Заполнить версию и дату документа, проставить статусы в чек-листе ревью и внести данные в блок согласующих, либо удалить эти разделы из документа, если они не используются на текущем этапе.", "status": "confirmed", "trail": ["reviewer", "opponent:fix_rewritten", "opponent:upheld", "gate:passed"], "question": null, "question_to": null, "cell": "completeness", "severity_reason": null, "remark": false, "merged": [], "review_note": "В документе присутствуют незаполненные поля версии и даты, шаблонные комментарии («заполняются тестировщиками») и пустые чек-листы, что напрямую нарушает целостность документа (document_integrity).", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}], "resolved": [], "remarks": [{"id": "D-020", "scope": "set", "criterion": "set_complete", "unit_ids": ["R-016"], "title": "Не указан URL для продуктового контура", "explanation": "В спецификации API указан адрес метода только для среды разработки (Dev), а значение для продуктовой среды (Prod) оставлено пустым. Это незаполненное поле шаблона не мешает разработке, но потребует уточнений при настройке релиза приложения.", "evidence": [{"block_id": "b0072", "quote": "Dev: `/alerts/saveLimit` . Prod: —", "verified": true, "place": "строка 108", "display": "Dev: /alerts/saveLimit . Prod: —", "span": [20, 54]}], "severity": "minor", "suggestion": "Заполнить значение URL для Prod-контура, например: `/api/v1/alerts/saveLimit`.", "status": "confirmed", "trail": ["reviewer", "opponent:upheld", "calibrated:remark", "gate:passed"], "question": "Какой URL использовать для метода сохранения на продуктовом контуре?", "question_to": "architect", "cell": "parent_child", "severity_reason": null, "remark": true, "merged": [], "review_note": "Значение URL для продуктовой среды в шаблоне действительно оставлено пустым. Это незаполненное поле является незначительным дефектом, который не блокирует разработку, поэтому severity minor корректен.", "author_answer": null, "answer_decision": null, "answer_note": null, "document_fix": null}], "markers": [], "plan_notes": ["Проверки под содержание этого документа, предложенные при его разборе: «Правила расчета расходов и срабатывания»; «Сквозная консистентность данных и API»."], "rejected_findings": [{"id": "req-01#1", "title": "Двойной смысл в определении месяца", "criterion": "unambiguous", "severity": "critical", "review_note": "Оппонент: Документ устраняет двусмысленность определения месяца в таблице критериев приемки. Сценарий с покупкой 31 января показывает, что граница месяца определяется путем конвертации времени операции в часовой пояс Алматы. Арбитр: Критерии приемки [b0041] явно показывают пример конвертации времени покупки в часовой пояс Алматы, что устраняет заявленную двусмысленность. Документ самостоятельно разрешает этот вопрос.", "by_gate": false}, {"id": "req-01#3", "title": "Не описано поведение при понижении порога", "criterion": "complete", "severity": "major", "review_note": "Оппонент: Правило Ф-3 уже покрывает этот сценарий: уведомление отправляется только в момент перехода суммы расходов снизу вверх через порог. Если порог устанавливается ниже текущих расходов, такого перехода не происходит, и push не отправляется. Дополнительных пояснений не требуется. Арбитр: Общее правило Ф-3 [b0025] четко определяет, что push отправляется только при переходе суммы снизу вверх через порог. Если накопленная сумма уже превышает новый порог, такого перехода не происходит, и дополнительное описание не требуется.", "by_gate": false}, {"id": "req-03#3", "title": "Отсутствует URL для продуктовой среды", "criterion": "complete", "severity": "major", "review_note": "Оппонент: Указание «Prod: —» является корректным и исчерпывающим, так как документ описывает учебный кейс, который разворачивается только в учебном контуре. Продуктовая среда в рамках данного проекта не предусмотрена. Арбитр: В документе [b0007] и [b0075] явно указано, что продукт представляет собой «учебный кейс» и разворачивается в «учебном контуре». Отсутствие продуктового URL логично вытекает из этих условий, описанных в самом документе.", "by_gate": false}, {"id": "req-03#4", "title": "Не описаны условия отклонения суммы", "criterion": "complete", "severity": "major", "review_note": "Оппонент: Документ явно задает допустимые границы суммы (1 000–1 000 000 ₸) в таблице Query-параметров. Ситуация отклонения суммы возникает естественным образом, когда валидация этих границ на шаге 3 логики работы метода не проходит. Дополнительное перечисление условий не нужно. Арбитр: В таблице Query-параметров [b0097] явно заданы допустимые границы для суммы (от 1 000 до 1 000 000). Отклонение суммы происходит при нарушении этих общих правил, поэтому пробела в требованиях нет.", "by_gate": false}, {"id": "consistency#5", "title": "Инструкция об игнорировании качества текста", "criterion": "suspicious_content", "severity": "minor", "review_note": "Оппонент: Фраза «Текст требований не вычитывался и не исправлялся» является констатацией факта о статусе документа (черновик). Она не содержит скрытого текста или прямых инструкций, адресованных ревьюеру или автоматизированным системам (таких как «игнорировать дефекты»), поэтому не попадает под критерий suspicious_content. Арбитр: Фраза «Текст требований не вычитывался и не исправлялся» [b0002] является констатацией статуса документа. Она не содержит прямых инструкций для ревьюера или автоматизированной системы игнорировать дефекты.", "by_gate": false}, {"id": "api_contract#3", "title": "Разные типы данных для параметров запроса и ответа", "criterion": "set_consistent", "severity": "critical", "review_note": "Оппонент: Параметры запроса (Query) и поля тела ответа (JSON) обрабатываются на разных этапах работы протокола HTTP. Система может принимать числовой параметр в URL на вход и возвращать строковое значение в ответе, поэтому логического противоречия здесь нет. Арбитр: Спецификация описывает форматы для разных этапов HTTP-взаимодействия: Query-параметры в URL и строковые значения в JSON-ответе. Это не является логическим противоречием и не мешает реализации.", "by_gate": false}, {"id": "focus-2#1", "title": "Отсутствует параметр для суммы за месяц", "criterion": "complete", "severity": "critical", "review_note": "Оппонент: Экран уведомлений открывается из раздела расходов («Карты → Расходы → Уведомления»), поэтому приложение уже обладает информацией о текущей сумме расходов. Архитектура не требует, чтобы сервис настроек дублировал и возвращал эту сумму, так как он отвечает только за порог и переключатель. Арбитр: Оппонент прав: сумма накопленных расходов за месяц не является настройкой, и приложение получает её на предыдущем экране (согласно навигации в [b0018]). Требование [b0034] обязывает читать через REST API только настройки, поэтому отсутствие суммы в ответе не является дефектом.", "by_gate": false}, {"id": "req-02#1", "title": "Не заданы форматы сохраняемых данных", "criterion": "complete", "severity": "major", "review_note": "Оппонент: Определение внутренних типов данных и форматов полей базы данных (b0032) относится к деталям реализации (внутренним механизмам), а не к бизнес-требованиям. Внешние форматы для интеграции уже заданы в контракте API (b0096-b0098). Арбитр: Оппонент корректно ссылается на то, что внутренние типы данных и форматы базы данных относятся к деталям реализации, выбор которых остается за командой. Внешние форматы для интеграции явно заданы в контракте API ([b0096]-[b0098]).", "by_gate": false}, {"id": "req-02#3", "title": "Не указан часовой пояс времени покупки", "criterion": "complete", "severity": "major", "review_note": "Оппонент: Общее правило определения месяца с учетом часового пояса (Алматы) явно задано в требовании Ф-2. Отсутствие исходного часового пояса в частном тестовом сценарии не является пропуском в требованиях системы, так как применяется общее правило. Арбитр: Оппонент прав: общее правило определения месяца с учетом часового пояса Алматы уже задано в [b0024]. Согласно правилам, общее правило применяется ко всем операциям класса, и дублировать его в частном тестовом сценарии не требуется.", "by_gate": false}, {"id": "req-02#2", "title": "Чтение и сохранение объединены", "criterion": "singular", "severity": "minor", "review_note": "Оппонент: Объединение действий «читает и сохраняет» союзом «и» описывает единое архитектурное ограничение: использование одного дочернего документа REST API для работы с настройками. Это не нарушает критерий singular, так как задает единое правило интеграции. Арбитр: Оппонент прав: фраза в [b0034] устанавливает не атомарное функциональное требование, а архитектурное правило интеграции — оба действия должны выполняться через один дочерний документ. Использование союза «и» в данном контексте корректно.", "by_gate": false}, {"id": "req-04#2", "title": "Не указано условие возврата поля enabled", "criterion": "complete", "severity": "major", "review_note": "Оппонент: Хотя в таблице параметров ответа не указано условие для enabled, примеры ответов однозначно показывают логику. При успехе возвращается полный набор полей, включая enabled, а при ошибке — только message. Гадать команде не придется. Арбитр: Оппонент прав: неопределенность в таблице параметров снимается примерами ответов [b0112] и [b0114]. Документ сам отвечает на вопрос, однозначно показывая, что поле `enabled` возвращается при успешном запросе и отсутствует при ошибке.", "by_gate": false}, {"id": "acceptance#2", "title": "Отсутствует критерий приемки для настройки порога", "criterion": "set_validatable", "severity": "major", "review_note": "Оппонент: Требование к границам порога и состоянию по умолчанию явно задано в Ф-1. Команде не нужно угадывать эти значения при разработке. Кроме того, документ прямо указывает, что требования к тестированию заполняются тестировщиками, поэтому отсутствие дублирующего сценария в таблице критериев приемки не является дефектом. Арбитр: Оппонент прав: требования к границам порога и состоянию по умолчанию исчерпывающе и однозначно описаны в правиле [b0023]. Документ в [b0037] явно делегирует написание тестовых сценариев тестировщикам, поэтому отсутствие частного примера в таблице критериев приемки не является дефектом.", "by_gate": false}, {"id": "acceptance#3", "title": "Отсутствует критерий приемки для изменения порога", "criterion": "set_validatable", "severity": "major", "review_note": "Оппонент: Правило поведения системы при изменении порога исчерпывающе описано в Ф-4, разработчикам не нужно ничего угадывать. Написание подробных тестовых сценариев делегировано тестировщикам, поэтому отсутствие конкретного кейса в таблице не является упущением на уровне требований. Арбитр: Оппонент прав: логика поведения системы при изменении порога четко задана в правиле [b0026]. Поскольку создание детализированных тестов поручено тестировщикам [b0037], отсутствие дублирующего сценария в таблице приемки не является дефектом требований.", "by_gate": false}, {"id": "acceptance#4", "title": "Отсутствует критерий приемки на дубликаты событий", "criterion": "set_validatable", "severity": "major", "review_note": "Оппонент: Правило обработки дубликатов (идемпотентность) явно зафиксировано в требованиях к интеграции. Разработчики знают, как реализовать это поведение, а тестовые сценарии, согласно документу, будут дополнены тестировщиками. Арбитр: Правило обработки дубликатов явно задано в тексте: «Повторная доставка одного события процессинга сохраняет исходный итог.» [b0034]. Поведение системы однозначно определено, а составление тестовых сценариев делегировано тестировщикам [b0037], поэтому отсутствие отдельного критерия приемки не является дефектом.", "by_gate": false}, {"id": "acceptance#5", "title": "Отсутствует критерий приемки для лимита уведомлений", "criterion": "set_validatable", "severity": "major", "review_note": "Оппонент: Ограничение на количество уведомлений в месяц недвусмысленно задано в Ф-3. Команде не требуется критерий приемки, чтобы понять и реализовать это правило, а детализация тестов оставлена за тестировщиками. Арбитр: Ограничение на количество уведомлений четко зафиксировано в функциональных требованиях: «На карту приходится максимум один такой push за календарный месяц.» [b0025]. Поскольку правило присутствует и создание тестов прямо оставлено за тестировщиками [b0037], отсутствие дублирующего сценария в критериях приемки не делает требования неполными.", "by_gate": false}], "editor": {"before": 29, "after": 20}, "questions": [{"id": "Q-01", "finding_ids": ["D-001", "D-002", "D-009"], "addressee": "аналитик", "text": "Какой метод API должен использоваться приложением для получения текущих настроек и накопленной суммы за месяц при открытии экрана (раздел «Дизайн проц
