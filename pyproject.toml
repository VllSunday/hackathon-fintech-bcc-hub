[project]
name = "reqaudit"
version = "0.2.0"
description = "Агент проверки качества требований по ISO/IEC/IEEE 29148 и IEEE 830"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.3",
    "fastapi>=0.115",
    "genai-prices>=0.2",
    "pydantic>=2.9",
    "pydantic-ai-slim[anthropic,google,openai]>=2.75.0",
    "pymupdf>=1.26,<2",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "striprtf>=0.0.26",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Structural PDF reading with Docling: about 1.2 GB with torch, models download on first use.
docling = ["docling>=2.150"]

[project.scripts]
reqaudit = "reqaudit.cli:main"
reqaudit-eval = "reqaudit.eval:main"
reqaudit-ui = "reqaudit.ui.server:main"
reqaudit-diagnose = "reqaudit.diagnose:main"
reqaudit-bench = "reqaudit.bench:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reqaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls a real model API; needs keys in .env"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
