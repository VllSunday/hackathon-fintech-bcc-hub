[project]
name = "reqaudit"
version = "0.1.0"
description = "Агент проверки качества требований по ISO/IEC/IEEE 29148 и IEEE 830"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "charset-normalizer>=3.3",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.scripts]
reqaudit = "reqaudit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reqaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
