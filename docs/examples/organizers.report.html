ранения расходов. |\n| R-025 | — | Схема взаимодействия приложения и хранилища | однозначность, проверяемость, полнота, атомарность, уместность уровня детализации, выполнимость, соответствие шаблону | соответствует | — | Корректная высокоуровневая схема интеграционного взаимодействия. |\n| R-026 | — | Query-параметры метода: cardId, amount, enabled | однозначность, проверяемость, полнота, атомарность, уместность уровня детализации, выполнимость, соответствие шаблону | соответствует | D-002 | Query-параметры запроса описаны полно, форматы и размеры указаны. |\n| R-027 | — | Формат тела запроса application/json | однозначность, проверяемость, полнота, атомарность, уместность уровня детализации, выполнимость, соответствие шаблону | соответствует | D-015 | Заголовок Content-Type указан явно. |\n| R-028 | — | Тело запроса не используется | однозначность, проверяемость, полнота, атомарность, уместность уровня детализации, выполнимость, соответствие шаблону | соответствует | D-015 | Указание на отсутствие тела запроса понятно. |\n| R-029 | — | Правила успешных и неуспешных кодов ответа | однозначность, проверяемость, полнота, атомарность, уместность уровня детализации, выполнимость, соответствие шаблону | соответствует | — | Общее разделение кодов ответа на успешные и неуспешные понятно описано. |\n| R-030 | — | Параметры тела ответа: result, amount, enabled, message | однозначность, проверяемость, полнота, атомарность, уместность уровня детализации, выполнимость, соответствие шаблону | соответствует | D-013 | Отсутствует условие возврата параметра enabled, что создает неоднозначность при ошибках. |\n| R-031 | — | Код 200 при успешном выполнении метода | однозначность, проверяемость, полнота, атомарность, уместность уровня детализации, выполнимость, соответствие шаблону | соответствует | D-014 | Стандартное описание статус-кода 200. |\n| R-032 | — | Код 400 при неверных параметрах запроса | однозначность, проверяемость, полнота, атомарность, уместность уровня детализации, выполнимость, соответствие шаблону | соответствует | D-014 | Понятие «заполнены неверно» допускает разные трактовки (техническая или бизнес-валидация). |\n| R-033 | — | Код 401 при отсутствии авторизации | однозначность, проверяемость, полнота, атомарность, уместность уровня детализации, выполнимость, соответствие шаблону | соответствует | — | Стандартное условие для 401, авторизация описана в общих параметрах. |\n| R-034 | — | Код 403 при запрете доступа к ресурсу | однозначность, проверяемость, полнота, атомарность, уместность уровня детализации, выполнимость, соответствие шаблону | полнота (D-016); полнота (D-017) | — | Отсутствует конкретное условие в бизнес-логике, при котором возвращается 403. |\n| R-035 | — | Код 500 при внутренней ошибке сервера | однозначность, проверяемость, полнота, атомарность, уместность уровня детализации, выполнимость, соответствие шаблону | соответствует | — | Стандартное описание 500 ошибки, дополнительных условий не требуется. |\n| R-036 | — | Код 404 для чужой или отсутствующей карты | однозначность, проверяемость, полнота, атомарность, уместность уровня детализации, выполнимость, соответствие шаблону | полнота (D-016) | — | Поведение при чужой или отсутствующей карте описано однозначно. |\n\n### Замечания к отдельным требованиям\n\n#### D-005. Не указан текст push-уведомления\n\nКритерий: полнота (ISO/IEC/IEEE 29148:2018, п. 5.2.5; IEEE Std 830-1998, п. 4.3.3) · Серьёзность: критичный · Требования: R-006\n\nВ требовании сказано, что клиент получает уведомление, но не задан его текст. Разработчикам неизвестно, какие именно слова и переменные (например, сумму или маску карты) выводить в сообщении, чтобы клиент понял суть уведомления.\n\n> «Ф-3. Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push.» — строка 39\n\n**Как исправить.** В разделе «Функциональные требования» указать точный шаблон текста push-уведомления с переменными, например: «Превышен лимит расходов. Месячная сумма достигла {amount} ₸».\n\n**Вопрос автору.** Какой точный текст должен быть у отправляемого push-уведомления?\n\n#### D-007. Нет правила для нового порога ниже текущих расходов\n\nКритерий: полнота (ISO/IEC/IEEE 29148:2018, п. 5.2.5; IEEE Std 830-1998, п. 4.3.3) · Серьёзность: критичный · Требования: R-007\n\nТребование Ф-4 описывает логику только для случая, когда накопленная сумма строго ниже нового порога. Неясно, как должна вести себя система, если пользователь задает порог, который уже равен текущим расходам или меньше их: отправить push немедленно при сохранении настройки или не отправлять ничего.\n\n> «При изменении порога накопленная сумма сохраняется. Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.» — строка 40\n\n**Как исправить.** Дополнить Ф-4 правилом: «Если накопленная сумма равна новому порогу или превышает его, push-уведомление в момент сохранения не отправляется».\n\n**Вопрос автору.** Нужно ли отправлять push при сохранении порога, если расходы месяца уже равны ему или превышают его?\n\n#### D-008. Неясно, какая сумма передаётся в push\n\nКритерий: однозначность (ISO/IEC/IEEE 29148:2018, п. 5.2.5; IEEE Std 830-1998, п. 4.3.2) · Серьёзность: критичный · Требования: R-008\n\nСлово «сумму» можно интерпретировать по-разному: это может быть сумма текущей операции (покупки), общая сумма накопленных расходов за месяц или размер установленного порога. Неясно, какое значение сервис расходов должен передавать для отправки.\n\n> «Сервис расходов → push: передать последние четыре цифры карты и сумму при достижении порога.» — строка 43\n\n**Как исправить.** Уточнить, какая именно сумма передаётся, например: «...и накопленную сумму расходов за месяц при достижении порога».\n\n**Вопрос автору.** Какую сумму нужно передавать в сервис push: сумму последней покупки, общие расходы за месяц или сам порог?\n\n#### D-009. Противоречивое описание назначения метода API\n\nКритерий: однозначность (ISO/IEC/IEEE 29148:2018, п. 5.2.5; IEEE Std 830-1998, п. 4.3.2) · Серьёзность: критичный · Требования: R-016\n\nВ описании одновременно указаны два разных действия: «Сохранение порога» и «чтение порога». Разработчику неясно, должен ли этот метод только изменять настройки, только возвращать их, или выполнять оба действия.\n\n> «Description · Сохранение порога. Функциональные требования: чтение порога» — строка 103\n\n**Как исправить.** Оставить в описании только то действие, которое фактически выполняет метод, например: «Сохранение порога».\n\n**Вопрос автору.** Метод предназначен для сохранения порога или для его чтения?\n\n#### D-012. Использование метода GET для изменения данных\n\nКритерий: соответствие шаблону (ISO/IEC/IEEE 29148:2018, п. 5.2.5) · Серьёзность: существенный · Требования: R-016, R-020\n\nСпецификация описывает метод сохранения и изменения порога как HTTP-запрос GET. По стандартам REST метод GET должен использоваться только для безопасного чтения и быть идемпотентным, а изменение данных должно выполняться методами POST, PUT или PATCH.\n\n> «REST type · GET» — строка 104\n\n> «Заменить настройку и вернуть результат сохранения.» — строка 120\n\n> «Description · Сохранение порога. Функциональные требования: чтение порога» — строка 103\n\n**Как исправить.** Изменить тип метода с GET на POST или PUT.\n\n**Сведено в эту находку** (редактор счёл это тем же дефектом):\n\n- Использование GET для изменения данных — соответствие шаблону (ISO/IEC/IEEE 29148:2018, п. 5.2.5), существенный. Метод предназначен для сохранения порога, но использует HTTP-метод GET. Использование GET для изменения состояния на сервере нарушает стандартную семантику REST и HTTP-методов, согласно которой GET должен быть безопасным.\n\n**Вопрос автору.** Какой HTTP-метод (POST или PUT) следует использовать для сохранения настроек вместо GET?\n\n#### D-016. Отсутствует формат ответа для статуса 403 Forbidden\n\nКритерий: полнота (ISO/IEC/IEEE 29148:2018, п. 5.2.5; IEEE Std 830-1998, п. 4.3.3) · Серьёзность: существенный · Требования: R-034, R-036\n\nСтатус 403 указан в списке возможных ответов метода, однако его описание и пример тела ответа пропущены. В разделе 403 вместо этого приведено описание статуса 404, что оставляет структуру ошибки 403 неизвестной для разработчиков.\n\n> «Ответ в случае, если на указанный ресурс доступ запрещен.» — строки 174–176\n\n> «#### 403. Unsuccessful — Forbidden» — строка 188\n\n> «Для чужой карты возвращается 404, как и для отсутствующей карты.» — строки 189–190\n\n**Как исправить.** Добавить пример JSON-ответа для статуса 403 или исключить этот статус из списка, если при ошибке доступа используется только 404.\n\n**Вопрос автору.** Какое тело ответа должно возвращаться при статусе 403?\n\n#### D-017. Не описано условие возврата кода 403\n\nКритерий: полнота (ISO/IEC/IEEE 29148:2018, п. 5.2.5; IEEE Std 830-1998, п. 4.3.3) · Серьёзность: существенный · Требования: R-034\n\nФормулировка скопирована из стандарта HTTP и не задает конкретных условий для данного метода. Разработчик не будет знать, при каких именно бизнес-сценариях (какой ресурс и чьи права) API должно возвращать ошибку 403.\n\n> «Ответ в случае, если на указанный ресурс доступ запрещен.» — строки 174–176\n\n**Как исправить.** Явно описать конкретное бизнес-условие (например, отсутствие определенной роли), при провале которого метод вернет 403, либо указать на удаление этого кода из раздела «Статусы», чтобы не оставлять выбор за разработчиком.\n\n**Вопрос автору.** При каком бизнес-условии метод должен вернуть статус 403?\n\n## Проверка всего набора требований\n\nАгент выписал из документа 62 факта (значения, единицы, типы, диапазоны, сравнения) и сверил их кодом. Расхождения, найденные кодом; решение по каждому принимал рецензент, подтверждённые вошли в находки ниже:\n\n- порог: разные значения «range»: «от 1 000 до 1 000 000» (F-002); «обе границы включены» (F-027); «1 000–1 000 000» (F-036)\n- порог: разные значения «type»: «целый» (F-001); «Целое» (F-025); «integer» (F-033); «string» (F-047)\n- порог: разные значения «unit»: «₸» (F-003); «в тенге» (F-016); «тенге» (F-026); «тенге» (F-037); «тенге» (F-048)\n- `enabled`: разные значения «range»: «0 или 1» (F-041); ««0» или «1»» (F-050)\n- `enabled`: разные значения «type»: «integer» (F-038); «string» (F-049)\n- result: разные значения «value»: «OK» (F-054); «ERROR» (F-057)\n- `amount`: разные значения «type»: «integer» (F-033); «string» (F-047)\n- порог: разные значения «unit»: «₸» (F-003); «в тенге» (F-016)\n- В документе разные единицы измерения (деньги: kzt, в тенге, в тиынах): порог — «₸» (F-003); сумму покупки — «в тиынах» (F-015); порог — «в тенге» (F-016); тенге — «тенге» (F-026); Порог в тенге — «тенге» (F-037); Порог в тенге — «тенге» (F-048)\n- накопленные расходы (в тиынах) сравнивается с amount (kzt, в тенге): единицы различаются\n\n#### D-001. В API не передается сумма расходов за месяц для UI\n\nКритерий: полнота набора (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.3) · Серьёзность: критичный · Требования: R-002\n\nИнтерфейс приложения требует отображения суммы расходов за месяц. Однако API уведомлений не предусматривает передачу этого значения ни в методе сохранения, ни в отсутствующем методе чтения. Без этих данных мобильное приложение не сможет корректно отрисовать экран интерфейса пользователя.\n\n> «На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить».» — строка 29\n\n> «Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API».» — строка 52\n\n**Как исправить.** Добавить параметр с накопленной суммой расходов за месяц (например, `monthlyExpenses`) в ответ метода чтения настроек.\n\n**Вопрос автору.** Какой метод API должен возвращать приложению накопленную сумму расходов за месяц для отображения на экране?\n\n#### D-002. В спецификации API отсутствует метод чтения настроек\n\nКритерий: полнота набора (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.3) · Серьёзность: критичный · Требования: R-002, R-008, R-011, R-016, R-020, R-026\n\nЧасть A требует, чтобы мобильное приложение читало и отображало текущие настройки пользователя и сумму расходов за месяц. Однако в спецификации REST API (Часть B) описан только метод сохранения `/alerts/saveLimit`, а метод для получения данных отсутствует. Без него разработчики не смогут реализовать открытие экрана уведомлений.\n\n> «На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить».» — строка 29\n\n> «Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API».» — строка 52\n\n> «Сохранение порога. Функциональные требования: чтение порога» — строка 103\n\n> «Dev: /alerts/saveLimit . Prod: —» — строка 108\n\n**Как исправить.** Добавить в Часть B спецификацию метода для получения текущих настроек пользователя, возвращающего установленный порог и статус переключателя.\n\n**Сведено в эту находку** (редактор счёл это тем же дефектом):\n\n- Отсутствует API-метод для чтения порога — полнота набора (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.3), критичный. Архитектура решения предполагает, что приложение и сервис расходов получают текущие настройки порога через REST API. Однако в спецификации API (Часть B) описан только метод сохранения порога (`/alerts/saveLimit`), а метод для чтения настроек отсутствует. Без него приложение не сможет отобразить текущий порог при открытии экрана, а бэкенд не сможет проверить достижение лимита.\n- Отсутствует метод чтения текущего порога карты — непротиворечивость (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.4), критичный. Сценарий интеграции требует получения порога карты сервисом расходов. Однако спецификация API описывает только операцию сохранения, где параметры amount и enabled обязательны, что делает невозможным простое чтение настроек без их изменения.\n- Отсутствует метод API для чтения настроек — полнота набора (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.3), критичный. Основной документ требует, чтобы приложение читало и сохраняло настройки через API, и спецификация API заявляет чтение в описании. Однако в спецификации описан только метод сохранения порога (`saveLimit`), а метод для чтения отсутствует. Разработчики мобильного приложения не смогут реализовать инициализацию экрана настроек.\n- Чтение порога требует обязательной перезаписи — непротиворечивость (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.4), критичный. В описании метода заявлено выполнение функционального требования по чтению порога. При этом параметры amount и enabled указаны как обязательные, а логика метода всегда выполняет замену настройки. Клиент не может запросить текущие настройки порога, не передав новые значения, что делает безопасное чтение невозможным.\n\n**Вопрос автору.** Где описан API-метод для получения приложением суммы за месяц и текущих настроек при открытии экрана?\n\n#### D-003. Отсутствует валидация активности и валюты карты в API\n\nКритерий: полнота набора (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.3) · Серьёзность: критичный · Требования: R-004\n\nБизнес-требования разрешают устанавливать порог только для активных карт в валюте KZT. Однако в логике работы метода API проверяется только принадлежность карты клиенту, а проверки статуса активности и валюты карты отсутствуют. Это приведет к тому, что клиент сможет установить порог по заблокированной или валютной карте.\n\n> «Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно.» — строка 37\n\n> «Проверить принадлежность карты клиенту.» — строка 118\n\n**Как исправить.** Добавить в раздел «Логика работы метода» проверки: статус карты — активна, валюта счета карты — KZT. При невыполнении возвращать ошибку с соответствующим сообщением.\n\n**Вопрос автору.** Должен ли метод API сам проверять статус и валюту карты, или это обеспечивается на стороне фронтенда?\n\n#### D-004. Противоречие в правиле определения месяца покупки\n\nКритерий: непротиворечивость (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.4) · Серьёзность: критичный · Требования: R-003, R-005, R-014\n\nПравило Ф-2 устанавливает, что месяц определяется по дате совершения покупки (в примере — 31 января). Однако критерий приемки ожидает, что покупка, совершенная 31 января, но проведенная 1 февраля, увеличит февральский счетчик. Разработчикам неясно, какую дату использовать для отнесения суммы к месяцу: дату авторизации (совершения) или дату клиринга (проведения).\n\n> «Месяц определяется по дате совершения покупки в Алматы.» — строка 38\n\n> «Покупка 31 января в 23:58 на 4 000 ₸» — строка 64\n\n> «Провести 1 февраля в 00:03 по Алматы» — строка 64\n\n> «Февральский счётчик вырос на 4 000 ₸» — строка 64\n\n**Как исправить.** Выбрать, по какой дате определяется месяц. Если по дате проведения, изменить в Ф-2 «по дате совершения покупки» на «по дате проведения покупки». Если по дате совершения, исправить в таблице критериев приемки ожидаемый результат на «Январский счётчик вырос на 4 000 ₸».\n\n**Сведено в эту находку** (редактор счёл это тем же дефектом):\n\n- Многозначность термина «проведённые покупки» — однозначность (ISO/IEC/IEEE 29148:2018, п. 5.2.5; IEEE Std 830-1998, п. 4.3.2), критичный. Термин «проведённые покупки» может означать как успешно авторизованные операции (холдирование), так и операции, прошедшие финансовое списание (клиринг). Если разработчики реализуют расчет по клирингу, который происходит через несколько дней, это нарушит прямое требование извещать клиента «в момент покупки».\n\n**Вопрос автору.** По какой дате покупка относится к месяцу: по дате совершения (авторизации) или по дате проведения (клиринга)?\n\n#### D-006. Противоречие в лимите уведомлений при изменении порога\n\nКритерий: непротиворечивость (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.4) · Серьёзность: критичный · Требования: R-006, R-007\n\nПравило Ф-3 ограничивает количество уведомлений до одного в месяц на карту. Однако Ф-4 утверждает, что при повышении порога новое достижение вызовет push независимо от истории. Если клиент уже получил уведомление в этом месяце, а затем повысил порог и снова его достиг, оба правила применяются одновременно и требуют взаимоисключающих действий (отправить и не отправить).\n\n> «На карту приходится максимум один такой push за календарный месяц.» — строка 39\n\n> «Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.» — строка 40\n\n**Как исправить.** Выбрать приоритетное правило. Если можно отправлять несколько пушей при смене порога, добавить в Ф-3 исключение: «кроме случаев изменения порога (см. Ф-4)». Если действует жесткий лимит один пуш в месяц, в Ф-4 заменить «независимо от истории» на условие «если в этом месяце пуш еще не отправлялся».\n\n**Вопрос автору.** Может ли клиент получить второе уведомление за месяц, если он повысил порог после первого срабатывания?\n\n#### D-010. Нет обработки сбоев сервиса push\n\nКритерий: полнота набора (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.3) · Серьёзность: существенный · Требования: R-001, R-009\n\nДокумент не описывает поведение системы в случае недоступности сервиса push или возврата им ошибки. Неясно, должен ли сервис учета расходов повторять попытки отправки уведомления, с каким интервалом, или уведомление считается безвозвратно потерянным.\n\n> «Карточный процессинг → учёт расходов → сервис push.» — строка 26\n\n> «Сервис передаёт push на отправку в течение минуты после получения события.» — строка 46\n\n**Как исправить.** Описать в нефункциональных требованиях сценарий при недоступности сервиса push: зафиксировать количество и интервал повторных попыток отправки или указать, что при сбое событие только логируется без повторных попыток.\n\n#### D-011. Не указаны тексты ошибок валидации в UI\n\nКритерий: полнота набора (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.3) · Серьёзность: существенный · Требования: R-002, R-004\n\nСпецификация UI требует отображать сообщение при ошибке ввода порога, однако сами тексты сообщений не приведены. Тестировщики и разработчики будут вынуждены самостоятельно придумывать тексты для случаев, когда сумма меньше 1000, больше 1000000 или введено нечисловое значение, что приведет к расхождениям.\n\n> «При ошибке ввода сообщение появляется под полем.» — строка 29\n\n> «Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно.» — строка 37\n\n**Как исправить.** В разделе «Дизайн процесса UI» зафиксировать конкретные тексты сообщений об ошибках для трех сценариев: введено значение меньше 1000, введено значение больше 1 000 000, введено нечисловое значение.\n\n#### D-013. Противоречие в составе полей при ошибке сохранения\n\nКритерий: непротиворечивость (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.4) · Серьёзность: существенный · Требования: R-021, R-030\n\nПравило логики метода (п. 5) требует при отклонении суммы возвращать прежнее состояние (значения порога и переключателя). Однако таблица параметров ответа указывает, что поле amount возвращается только «При успехе», а пример ответа с ошибкой не содержит полей amount и enabled. Разработчик бэкенда не будет знать, включать ли эти поля в ответ с ошибкой.\n\n> «При отклонении суммы вернуть прежнее состояние и результат ERROR.» — строка 121\n\n> «amount · string · При успехе · Порог в тенге · limit_kzt» — строка 156\n\n> «{\"result\":\"ERROR\",\"message\":\"Проверьте сумму\"}» — строки 170–172\n\n**Как исправить.** Определить, нужно ли возвращать прежнее состояние при ошибке. Если да, в таблице ответа убрать условие «При успехе» для поля amount, а в пример ответа с ошибкой добавить поля amount и enabled. Если возвращать не нужно, удалить требование «вернуть прежнее состояние» из п. 5 логики работы метода.\n\n**Вопрос автору.** Должен ли ответ с ошибкой содержать предыдущие значения порога и статуса включения?\n\n#### D-014. Противоречие в коде ответа при ошибке валидации\n\nКритерий: непротиворечивость (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.4) · Серьёзность: существенный · Требования: R-019, R-021, R-031, R-032\n\nРаздел «Статусы» указывает, что при неверных параметрах возвращается код 400. Однако в примере для успешного кода 200 показан ответ с результатом ERROR и сообщением об ошибке суммы. Неясно, какой HTTP-код (200 или 400) должен возвращать сервис при попытке сохранить сумму вне допустимого диапазона, что приведет к рассинхронизации обработки ошибок между клиентом и сервером.\n\n> «При отклонении суммы вернуть прежнее состояние и результат ERROR.» — строка 121\n\n> «Ответ в случае, если параметры запроса заполнены неверно.» — строки 162–163\n\n> «{\"result\":\"ERROR\",\"message\":\"Проверьте сумму\"}» — строки 170–172\n\n> «Ответ в случае успешного выполнения метода.» — строки 162–163\n\n**Как исправить.** Перенести пример ответа с ошибкой валидации из описания кода 200 в код 400. В пункте 5 раздела «Логика работы метода» заменить возврат результата ERROR на возврат HTTP-статуса 400. В таблице параметров ответа для поля result убрать значение ERROR.\n\n**Сведено в эту находку** (редактор счёл это тем же дефектом):\n\n- Неоднозначное условие для кода 400 — однозначность (ISO/IEC/IEEE 29148:2018, п. 5.2.5; IEEE Std 830-1998, п. 4.3.2), существенный. Фраза «заполнены неверно» допускает разные трактовки. Один разработчик может возвращать 400 при нарушении бизнес-правил (например, сумма вне лимита), а другой — только при технических ошибках (отсутствие обязательного параметра или неверный тип данных).\n- Ошибка валидации возвращается с HTTP-статусом 200 — непротиворечивость (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.4), существенный. Описание статус-кодов указывает, что 200 означает успех, а 400 — ошибку параметров. Однако в примере для успешного ответа (200) приведен JSON с ошибкой валидации суммы. HTTP-статусы и бизнес-результаты противоречат друг другу, что сломает обработку ошибок на клиенте.\n\n**Вопрос автору.** Какой HTTP-статус должен возвращаться, если сумма не проходит проверку: 200 с бизнес-ошибкой или 400 Bad Request?\n\n#### D-015. Указание Content-Type при отсутствии тела запроса\n\nКритерий: непротиворечивость (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.4) · Серьёзность: существенный · Требования: R-027, R-028\n\nВ требованиях к запросу указан заголовок Content-Type: application/json, однако ниже явно сказано, что тело не используется (все параметры передаются в URL). Передача заголовка о типе контента для пустого тела избыточна и противоречива.\n\n> «Content-Type: application/json .» — строка 147\n\n> «Тело не используется.» — строка 148\n\n**Как исправить.** Удалить требование заголовка Content-Type для запроса или перенести параметры из строки запроса в JSON-тело.\n\n**Вопрос автору.** Следует ли передавать параметры в теле запроса (JSON) или убрать заголовок Content-Type?\n\n#### D-018. Мета-комментарий о состоянии текста\n\nКритерий: подозрительное содержимое · Серьёзность: незначительный · Требования: документ целиком\n\nДокумент содержит мета-информацию, адресованную проверяющему, которая описывает текущее состояние текста, а не требования к разрабатываемой системе. Подобных комментариев не должно быть в финальной спецификации.\n\n> «Комплект из двух исходных документов. Текст требований не вычитывался и не исправлялся.» — строки 3–4\n\n> «Текст требований не вычитывался и не исправлялся.» — строки 3–4\n\n**Как исправить.** Удалить текст «Текст требований не вычитывался и не исправлялся.» и аналогичные мета-комментарии.\n\n**Сведено в эту находку** (редактор счёл это тем же дефектом):\n\n- Служебный комментарий в тексте требований — подозрительное содержимое, незначительный. В документе содержится комментарий, описывающий процесс подготовки спецификации, который адресован проверяющему. Подобные мета-инструкции не являются частью требований и не должны присутствовать в финальном документе для разработчиков.\n\n**Вопрос автору.** Следует ли удалить мета-комментарии о состоянии текста из спецификации?\n\n#### D-019. Незаполненные шаблонные разделы и чек-листы\n\nКритерий: целостность документа · Серьёзность: незначительный · Требования: документ целиком\n\nВ документе присутствуют незаполненные шаблонные разделы: требования к тестированию и чек-лист ревью. Это нарушает формальную целостность документа и скрывает информацию о реальном статусе согласования требований.\n\n> «заполняются тестировщиками» — строка 57\n\n> «Документ (версия/дата) в источнике не заполнен. Пункты чек-листа приведены как в шаблоне, отметки не проставлены.» — строка 68\n\n**Как исправить.** Заполнить версию и дату документа, проставить статусы в чек-листе ревью и внести данные в блок согласующих, либо удалить эти разделы из документа, если они не используются на текущем этапе.\n\n## Уточняющие вопросы\n\n| ID | Кому | Вопрос | Приоритет | Блокирует разработку | Дефекты | Ответ автора |\n|---|---|---|---|---|---|---|\n| Q-01 | аналитик | Какой метод API должен использоваться приложением для получения текущих настроек и накопленной суммы за месяц при открытии экрана (раздел «Дизайн процесса UI»), а также сервисом расходов для получения порога («Sequence Diagram»)? В разделе REST API описан только метод сохранения. | 1 | да | D-001, D-002, D-009 | — |\n| Q-02 | аналитик | К какому месяцу должна относиться покупка и когда она учитывается в расходах: по дате совершения (авторизации) или по дате проведения (клиринга)? В Ф-2 и критериях приёмки есть противоречие. | 1 | да | D-004 | — |\n| Q-03 | аналитик | Какой точный текст push-уведомления должен отправляться клиенту при достижении порога (Ф-3)? | 1 | да | D-005 | — |\n| Q-04 | аналитик | Может ли клиент получить второе push-уведомление за один месяц, если после первого срабатывания он повысил порог? В Ф-3 указан максимум один push, а в Ф-4 — отправка независимо от истории. | 1 | да | D-006 | — |\n| Q-05 | аналитик | Нужно ли отправлять push-уведомление сразу в момент сохранения нового порога (Ф-4), если текущая сумма расходов за месяц уже равна ему или превышает его? | 1 | да | D-007 | — |\n| Q-06 | аналитик | Какую именно сумму необходимо передавать в сервис push из сервиса расходов при достижении порога («Sequence Diagram»): сумму текущей покупки, общую накопленную сумму за месяц или сам порог? | 1 | да | D-008 | — |\n| Q-07 | аналитик | Должен ли метод API (`saveLimit`) самостоятельно проверять статус (активность) и валюту карты, или эти условия из Ф-1 гарантированно соблюдаются на стороне вызывающего приложения? | 1 | да | D-003 | — |\n| Q-08 | архитектор | Следует ли использовать HTTP-метод POST или PUT вместо GET для метода `/alerts/saveLimit`, так как он изменяет данные? | 2 | нет | D-012 | — |\n| Q-09 | архитектор | Какой HTTP-статус должен возвращаться, если переданная сумма не проходит валидацию (раздел «Статусы»): 200 OK (с result=ERROR) или 400 Bad Request? | 2 | нет | D-014 | — |\n| Q-10 | аналитик | Должен ли неуспешный ответ API (ошибка валидации) содержать предыдущие значения порога и статуса, как описано в шаге 5 логики метода, несмотря на то что в таблице ответа `amount` указан только для успеха? | 2 | нет | D-013 | — |\n| Q-11 | архитектор | Следует ли передавать параметры `cardId`, `amount` и `enabled` в теле запроса (JSON), учитывая заголовок `Content-Type: application/json` в разделе «Request body», или нужно убрать этот заголовок? | 2 | нет | D-015 | — |\n| Q-12 | архитектор | Какой формат ответа и какие поля должны возвращаться при HTTP-статусе 403 Forbidden (раздел «Статусы»)? | 2 | нет | D-016 | — |\n| Q-13 | аналитик | При каких бизнес-условиях метод должен возвращать статус 403 Forbidden (в отличие от 401 и 404, описанных в разделе «Статусы»)? | 2 | нет | D-017 | — |\n| Q-14 | архитектор | Как система должна обрабатывать ситуации сбоя в сервисе push (например, если отправка не удалась в течение требуемой минуты, указанной в нефункциональных требованиях)? Нужны ли повторные попытки? | 2 | нет | D-010 | — |\n| Q-15 | аналитик | Какие тексты сообщений об ошибках валидации суммы (от 1 000 до 1 000 000 ₸) должны отображаться в UI под полем ввода («Дизайн процесса UI»)? | 2 | нет | D-011 | — |\n| Q-16 | архитектор | Какой URL следует использовать для метода сохранения на продуктовом контуре (поле «Request URL» в общих параметрах API)? | 3 | нет | D-020 | — |\n| Q-17 | аналитик | Можно ли удалить из итогового документа служебные комментарии в разделе «Уведомление о расходах по карте» о том, что текст не вычитывался и не исправлялся? | 3 | нет | D-018 | — |\n| Q-18 | аналитик | Нужно ли заполнить пустые шаблонные таблицы и чек-листы в разделах «Ревью требований» и «Блок согласующих» перед началом разработки? | 3 | нет | D-019 | — |\n\nОтветы можно вписать в файл `\u003cотчёт>.answers.md`, который агент положил рядом с отчётом, и запустить проверку снова с `--answers \u003cфайл>`, либо ответить в терминале с `--ask`: агент перепроверит связанные находки.\n\n## Сводка\n\n| Показатель | Значение |\n|---|---|\n| Требований выделено | 36 |\n| Нарушений найдено | 19 |\n| из них критичных | 9 |\n| существенных | 8 |\n| незначительных | 2 |\n| Кандидатов отклонено оппонентом и арбитром | 15 |\n| Кандидатов отклонено проверкой цитат | 0 |\n\n| Критерий | Нарушений |\n|---|---|\n| полнота набора | 5 |\n| непротиворечивость | 5 |\n| полнота | 4 |\n| однозначность | 2 |\n| соответствие шаблону | 1 |\n| подозрительное содержимое | 1 |\n| целостность документа | 1 |\n\nКритичные дефекты — противоречивые, непроверяемые и неполные формулировки и другие, без которых нельзя начинать разработку:\n\n- **Противоречивые:**\n  - D-004: Противоречие в правиле определения месяца покупки (непротиворечивость)\n  - D-006: Противоречие в лимите уведомлений при изменении порога (непротиворечивость)\n- **Непроверяемые:**\n  - D-008: Неясно, какая сумма передаётся в push (однозначность)\n  - D-009: Противоречивое описание назначения метода API (однозначность)\n- **Неполные:**\n  - D-001: В API не передается сумма расходов за месяц для UI (полнота набора)\n  - D-002: В спецификации API отсутствует метод чтения настроек (полнота набора)\n  - D-003: Отсутствует валидация активности и валюты карты в API (полнота набора)\n  - D-005: Не указан текст push-уведомления (полнота)\n  - D-007: Нет правила для нового порога ниже текущих расходов (полнота)\n\n## Итог\n\n**Нет.** Начинать разработку и тестирование по этому документу нельзя: 9 критичных дефектов делают поведение системы неопределённым или противоречивым.\n\nИсправить в первую очередь:\n\n1. D-001 — В API не передается сумма расходов за месяц для UI\n2. D-002 — В спецификации API отсутствует метод чтения настроек\n3. D-003 — Отсутствует валидация активности и валюты карты в API\n4. D-004 — Противоречие в правиле определения месяца покупки\n5. D-005 — Не указан текст push-уведомления\n6. D-006 — Противоречие в лимите уведомлений при изменении порога\n7. D-007 — Нет правила для нового порога ниже текущих расходов\n\n## Замечания, не влияющие на поведение системы\n\nВерные наблюдения, которые не меняют того, что команда построит или проверит: тексты сообщений, оформление описания, параметры развёртывания. В число дефектов и в вывод они не входят.\n\n#### D-020. Не указан URL для продуктового контура\n\nКритерий: полнота набора (ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.3) · Серьёзность: незначительный · Требования: R-016\n\nВ спецификации API указан адрес метода только для среды разработки (Dev), а значение для продуктовой среды (Prod) оставлено пустым. Это незаполненное поле шаблона не мешает разработке, но потребует уточнений при настройке релиза приложения.\n\n> «Dev: /alerts/saveLimit . Prod: —» — строка 108\n\n**Как исправить.** Заполнить значение URL для Prod-контура, например: `/api/v1/alerts/saveLimit`.\n\n**Вопрос автору.** Какой URL использовать для метода сохранения на продуктовом контуре?\n\n## Приложение. Отклонённые кандидаты\n\nНаходки, которые рецензент предложил, но оппонент с арбитром или проверка цитат не пропустили в отчёт.\n\n| Кандидат | Критерий | Кем отклонён | Почему |\n|---|---|---|---|\n| Двойной смысл в определении месяца | однозначность | оппонент и арбитр | Оппонент: Документ устраняет двусмысленность определения месяца в таблице критериев приемки. Сценарий с покупкой 31 января показывает, что граница месяца определяется путем конвертации времени операции в часовой пояс Алматы. Арбитр: Критерии приемки [b0041] явно показывают пример конвертации времени |\n| Не описано поведение при понижении порога | полнота | оппонент и арбитр | Оппонент: Правило Ф-3 уже покрывает этот сценарий: уведомление отправляется только в момент перехода суммы расходов снизу вверх через порог. Если порог устанавливается ниже текущих расходов, такого перехода не происходит, и push не отправляется. Дополнительных пояснений не требуется. Арбитр: Общее п |\n| Отсутствует URL для продуктовой среды | полнота | оппонент и арбитр | Оппонент: Указание «Prod: —» является корректным и исчерпывающим, так как документ описывает учебный кейс, который разворачивается только в учебном контуре. Продуктовая среда в рамках данного проекта не предусмотрена. Арбитр: В документе [b0007] и [b0075] явно указано, что продукт представляет собой |\n| Не описаны условия отклонения суммы | полнота | оппонент и арбитр | Оппонент: Документ явно задает допустимые границы суммы (1 000–1 000 000 ₸) в таблице Query-параметров. Ситуация отклонения суммы возникает естественным образом, когда валидация этих границ на шаге 3 логики работы метода не проходит. Дополнительное перечисление условий не нужно. Арбитр: В таблице Qu |\n| Инструкция об игнорировании качества текста | подозрительное содержимое | оппонент и арбитр | Оппонент: Фраза «Текст требований не вычитывался и не исправлялся» является констатацией факта о статусе документа (черновик). Она не содержит скрытого текста или прямых инструкций, адресованных ревьюе const SUN = 'M12 3v2m0 14v2m9-9h-2M5 12H3m15.4-6.4L17 7M7 17l-1.4 1.4m0-12.8L7 7m10 10 1.4 1.4M12 8a4 4 0 100 8 4 4 0 000-8z';
const MOON = 'M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z';
function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const label = theme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
  clear(themeButton).append(strokeIcon(theme === 'dark' ? SUN : MOON));
  themeButton.setAttribute('aria-label', label);
  themeButton.title = label;
  try { localStorage.setItem('reqaudit-theme', theme); } catch (e) { /* private mode */ }
}
themeButton.addEventListener('click', () =>
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
(function () {
  let saved = null;
  try { saved = localStorage.getItem('reqaudit-theme'); } catch (e) { /* private mode */ }
  setTheme(saved === 'dark' ? 'dark' : 'light');
})();

// ---------------------------------------------------------------- server
async function api(path, options) {
  let response;
  try {
    response = await fetch(path, options);
  } catch (e) {
    throw new Error('Сервер не отвечает. Проверьте, что в консоли запущен reqaudit-ui, и обновите страницу.');
  }
  let body = null;
  try { body = await response.json(); } catch (e) { /* not JSON */ }
  if (!response.ok) {
    throw new Error((body && body.error) || `Сервер ответил ошибкой ${response.status}. Посмотрите вывод reqaudit-ui в консоли.`);
  }
  return body;
}
function errorBox(err, retry) {
  return h('div', { class: 'notice error', role: 'alert' }, h('p', null, err.message || String(err)),
    retry ? h('p', null, h('button', { class: 'btn', type: 'button', onclick: retry }, 'Повторить')) : null);
}

// ---------------------------------------------------------------- router
let pollTimer = null;
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function route() {
  stopPolling();
  window.scrollTo(0, 0);
  app.classList.remove('enter');
  void app.offsetWidth;
  app.classList.add('enter');
  if (EMBEDDED) { nav.hidden = true; return showReport(EMBEDDED); }
  const parts = location.hash.replace(/^#\/?/, '').split('?')[0].split('/').filter(Boolean);
  clear(nav);
  if (parts[0] !== 'run' && parts[0] !== 'report') return screenUpload();
  nav.append(h('a', { class: 'btn ghost', href: '#/' }, 'Все прогоны'));
  window.onresize = null;
  if (parts[0] === 'run' && parts[1]) return screenRun(parts[1]);
  if (parts[0] === 'report' && parts[1]) return screenReport(parts[1]);
  return screenUpload();
}
window.addEventListener('hashchange', route);

// ---------------------------------------------------------------- upload screen
function screenUpload() {
  document.title = 'reqaudit — проверка требований';
  let file = null;
  let busy = false;
  const dropTitle = h('strong', null, 'Перетащите документ сюда');
  const dropHint = h('span', { class: 'hint' }, 'или выберите файл: PDF, DOCX, MD, TXT, HTML, RTF');
  const input = h('input', { type: 'file', hidden: true, accept: '.pdf,.md,.markdown,.docx,.txt,.html,.htm,.rtf' });
  const drop = h('div', { class: 'drop', tabindex: '0', role: 'button', 'aria-label': 'Выбрать документ' }, dropTitle, dropHint, input);
  const submit = h('button', { class: 'btn primary big', type: 'button', disabled: true }, 'Проверить');
  const message = h('div');
  const keyNote = h('div');
  const journalCount = h('span');
  let profile = 'quick';
  const runsBox = h('div', { class: 'runs' });

  function choose(f) {
    if (!f) return;
    file = f;
    dropTitle.textContent = f.name;
    dropHint.textContent = `${(f.size / 1024).toFixed(1).replace('.', ',')} КБ`;
    drop.classList.remove('has-file');
    void drop.offsetWidth;
    drop.classList.add('has-file');
    submit.disabled = busy;
    clear(message);
  }
  onActivate(drop, (e) => { if (e.target !== input) input.click(); });
  input.addEventListener('change', () => choose(input.files[0]));
  input.addEventListener('click', (e) => e.stopPropagation());
  for (const type of ['dragenter', 'dragover']) drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.add('over'); });
  for (const type of ['dragleave', 'drop']) drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.remove('over'); });
  drop.addEventListener('drop', (e) => choose(e.dataTransfer.files[0]));

  submit.addEventListener('click', async () => {
    if (!file || busy) return;
    busy = true; submit.disabled = true; submit.textContent = 'Запускаю…';
    clear(message);
    try {
      const started = await api(`/api/runs?name=${encodeURIComponent(file.name)}&profile=${encodeURIComponent(profile)}`,
        { method: 'POST', body: file, headers: { 'Content-Type': 'application/octet-stream' } });
      go(`#/run/${started.run_id}`);
    } catch (err) {
      message.append(errorBox(err));
      busy = false; submit.disabled = false; submit.textContent = 'Проверить';
    }
  });

  clear(app).append(h('div', { class: 'wrap upload' },
    h('section', null, h('h1', null, 'Новая проверка'), drop, h('div', { class: 'form-row' }, submit), keyNote, message),
    h('section', null, h('div', { class: 'journal-head' }, h('h2', null, 'Журнал прогонов'), journalCount), runsBox)));

  api('/api/config').then((config) => {
    // One button, one run: the profile is the server's default (REQAUDIT_PROFILE in .env).
    if (config.default_profile) profile = config.default_profile;
    if (!config.model_ready) {
      keyNote.append(h('div', { class: 'notice' },
        h('p', null, h('b', null, 'Нет ключа модели. '), 'Добавьте в файл .env ', h('code', null, 'OPENAI_API_KEY'), ', ',
          h('code', null, 'GEMINI_API_KEY'), ' или ', h('code', null, 'VERTEX_API_KEY'), ' и обновите страницу.')));
    }
  }).catch((err) => message.append(errorBox(err)));

  function loadRuns() {
    // The journal's shape is known before its data: rows of a table.
    clear(runsBox).append(h('div', { class: 'skeleton', style: 'padding:16px' }, [70, 55, 62].map((w) => h('i', { style: `--w:${w}%` }))));
    api('/api/runs').then(({ runs }) => {
      clear(runsBox);
      journalCount.textContent = runs.length || '';
      if (!runs.length) { runsBox.append(h('div', { class: 'empty' }, 'Прогонов пока нет.')); return; }
      runsBox.append(h('div', { class: 'run-head' }, h('span', null, 'Документ'), h('span', null, 'Дата'), h('span', null, 'Статус'),
        ['Треб.', 'Наруш.', 'Крит.', 'Вопр.'].map((label) => h('span', { class: 'num' }, label))));
      runs.forEach((run, i) => {
        const target = run.has_report ? `#/report/${run.run_id}` : `#/run/${run.run_id}`;
        const known = run.has_report && run.checks_ran;
        const stat = (value, label, cls) => h('div', { class: 'stat' + (cls ? ' ' + cls : '') },
          h('b', null, known ? value : '—'), h('span', null, label));
        runsBox.append(h('a', { class: 'run', href: target, style: `--i:${i}` },
          h('div', { class: 'run-doc' }, h('b', null, run.document || 'без имени'),
            run.title ? h('span', { class: 'muted' }, run.title) : null),
          h('div', { class: 'run-date muted' }, fmtDate(run.started_at)),
          run.has_report && !run.checks_ran && run.status === 'completed'
            ? h('span', { class: 'pill partial' }, 'без проверки')
            : h('span', { class: `pill ${run.status || ''}` }, RUN_STATUS[run.status] || run.status || '—'),
          stat(run.units, 'требований'), stat(run.findings, 'нарушений'),
          stat(run.critical, 'критичных', known && run.critical ? 'crit' : 'zero'), stat(run.questions, 'вопросов')));
      });
    }).catch((err) => clear(runsBox).append(errorBox(err, loadRuns)));
  }
  loadRuns();
}

// ---------------------------------------------------------------- stage track
// The track is built once and then only updated, so its animations are not restarted by every poll.
function stageChain(progress) {
  const el = h('div', { class: 'chain' });
  const parts = new Map();
  el.update = (p) => {
    const now = Date.now();
    el.style.setProperty('--stages', p.stages.length);
    for (const s of p.stages) {
      let part = parts.get(s.code);
      if (!part) {
        part = { state: h('div', { class: 'state' }), meta: h('div', { class: 'meta' }) };
        part.root = h('div', null, h('div', { class: 'node' }), DEBUG ? h('div', { class: 'code' }, s.code) : null,
          h('div', { class: 'name' }, stageTitle(s)), part.state, part.meta);
        parts.set(s.code, part);
        el.append(part.root);
      }
      const meta = [];
      if (DEBUG) {
        const time = s.status === 'running' && s.started_at
          ? fmtSeconds(Math.max(0, (now - Date.parse(s.started_at)) / 1000)) : fmtSeconds(s.seconds);
        if (time) meta.push(h('div', null, time));
        if (s.llm_calls) meta.push(h('div', null, `${s.llm_calls} ${plural(s.llm_calls, 'вызов', 'вызова', 'вызовов')} модели`));
        if (s.cache_hits) meta.push(h('div', null, `из кэша ${s.cache_hits}`));
      }
      if (s.llm_failed) meta.push(h('div', null, `модель не ответила: ${s.llm_failed}`));
      for (const [key, one, few, many] of SUMMARY_RU[s.code] || []) {
        const n = s.summary && s.summary[key];
        if (typeof n === 'number') meta.push(h('div', null, `${n} ${plural(n, one, few, many)}`));
      }
      if (s.error) meta.push(h('div', null, s.error));
      part.root.className = `stage ${s.status}`;
      if (s.status === 'running') part.root.setAttribute('aria-current', 'step'); else part.root.removeAttribute('aria-current');
      part.state.textContent = STAGE_STATE[s.status] || s.status;
      append(clear(part.meta), meta);
    }
  };
  el.update(progress);
  return el;
}
function runNotice(progress) {
  const failed = progress.stages.find((s) => s.status === 'error');
  switch (progress.status) {
    case 'checks_incomplete':
      return h('div', { class: 'notice' }, h('p', null, 'Модель не ответила на часть проверок. Что осталось без оценки, отмечено в отчёте.'));
    case 'partial':
      return h('div', { class: 'notice error' }, h('p', null,
        h('b', null, failed ? `Проверка остановилась на шаге «${stageTitle(failed)}». ` : 'Проверка остановилась. '),
        failed && failed.error ? failed.error : ''));
    case 'input_rejected':
      return h('div', { class: 'notice error' }, h('p', null, h('b', null, 'Документ не принят. '),
        failed && failed.error ? failed.error : ''));
    case 'interrupted':
      return h('div', { class: 'notice error' }, h('p', null, 'Прогон прерван до записи отчёта.'));
    default:
      return null;
  }
}

// ---------------------------------------------------------------- run screen
function screenRun(runId) {
  const title = h('h1', null, 'Прогон');
  const nowText = h('span');
  const clock = h('div', { class: 'clock' }, '00:00');
  const bar = h('i');
  const summary = h('div', { class: 'muted' });
  const actions = h('div');
  const scan = h('div', { class: 'scan' }, title,
    h('div', { class: 'now', role: 'status' }, h('span', { class: 'dot' }), nowText), clock,
    h('div', { class: 'runbar', 'aria-hidden': 'true' }, bar), summary, actions);
  const noticeBox = h('div');
  const chainBox = h('div');
  const box = h('div', { class: 'wrap runview' }, scan, noticeBox, chainBox);
  clear(app).append(box);
  let chain = null;
  let sawRunning = false;
  let last = null;

  function draw(progress) {
    last = progress;
    const stages = progress.stages;
    const running = progress.status === 'running';
    const failed = ['partial', 'input_rejected', 'interrupted'].includes(progress.status);
    const done = stages.filter((s) => s.status === 'done' || s.status === 'not_needed').length;
    bar.style.setProperty('--p', (done / Math.max(1, stages.length)).toFixed(3));
    summary.textContent = `${done} из ${stages.length} этапов`;
    title.textContent = progress.input || 'Прогон';
    scan.className = `scan ${running ? 'running' : 'finished'}${failed ? ' failed' : ''}`;
    const current = stages.find((s) => s.status === 'running');
    nowText.textContent = running ? (current ? stageTitle(current) : 'Запуск') : cap(RUN_STATUS[progress.status] || progress.status);
    const startedMs = Date.parse(progress.started_at || '');
    const seconds = running && !Number.isNaN(startedMs)
      ? Math.max(0, (Date.now() - startedMs) / 1000) : stages.reduce((sum, s) => sum + (s.seconds || 0), 0);
    clock.textContent = fmtClock(seconds);
    clear(actions);
    if (progress.has_report) actions.append(h('a', { class: 'btn primary big', href: `#/report/${runId}` }, 'Открыть отчёт'));
    const notice = runNotice(progress);
    clear(noticeBox);
    if (notice) noticeBox.append(notice);
    if (chain) chain.update(progress); else { chain = stageChain(progress); chainBox.append(chain); }
  }
  async function tick() {
    let progress;
    try {
      progress = await api(`/api/runs/${runId}/progress`);
    } catch (err) {
      stopPolling();
      clear(box).append(errorBox(err, () => route()));
      return;
    }
    if (progress.status === 'running') sawRunning = true;
    draw(progress);
    if (progress.status !== 'running') {
      stopPolling();
      // Watched live to the end: go straight to the result.
      if (sawRunning && progress.has_report) go(`#/report/${runId}`);
    }
  }
  tick();
  pollTimer = setInterval(() => { if (last && last.status === 'running') tick(); }, 1000);
}

// ---------------------------------------------------------------- report screen
function screenReport(runId) {
  clear(app).append(h('div', { class: 'wrap skeleton', 'aria-label': 'Открываю отчёт' }, [38, 100, 100, 64, 82].map((w) => h('i', { style: `--w:${w}%` }))));
  api(`/api/runs/${runId}/report`).then(showReport).catch((err) => {
    clear(app).append(h('div', { class: 'wrap', style: 'padding-top:20px' }, errorBox(err),
      h('p', null, h('a', { href: `#/run/${runId}` }, 'Открыть ход прогона'))));
  });
}

// Reports whose stamp has already been shown in this browser; storage may be off (private mode).
const STAMPED = new Set();
function stampFirstTime(runId) {
  if (STAMPED.has(runId)) return false;
  STAMPED.add(runId);
  const key = `reqaudit-stamped-${runId}`;
  try {
    if (localStorage.getItem(key)) return false;
    localStorage.setItem(key, '1');
  } catch (e) { /* storage off: once per page load */ }
  return true;
}

function showReport(R) {
  const P = R.passport || {};
  const blocks = (R.document && R.document.blocks) || [];
  const blockById = new Map(blocks.map((b) => [b.id, b]));
  const findingById = new Map(R.findings.map((f) => [f.id, f]));
  const unitById = new Map(R.units.map((u) => [u.id, u]));
  const unitsOfBlock = new Map();
  for (const u of R.units) for (const id of u.block_ids) {
    if (!unitsOfBlock.has(id)) unitsOfBlock.set(id, []);
    unitsOfBlock.get(id).push(u.id);
  }
  // Quote ranges per block: where each finding's evidence sits in the block text.
  const marksOfBlock = new Map();
  for (const f of R.findings) for (const ev of f.evidence) {
    const block = blockById.get(ev.block_id);
    if (!block) continue;
    const [start, end] = ev.span || [0, block.text.length];
    if (!marksOfBlock.has(block.id)) marksOfBlock.set(block.id, []);
    marksOfBlock.get(block.id).push({ start, end, id: f.id, severity: f.severity });
  }
  const criterion = (code) => R.criteria[code] || { label: code, standard: null, level: null };
  const ORDER = ['critical', 'major', 'minor'];
  const GROUP_RU = { critical: 'Критичные', major: 'Существенные', minor: 'Замечания' };
  const state = { tab: 'doc', detail: 'units', active: null, criterion: '', unit: '', matrixAll: false, proofOpen: false };
  const verifiedAll = (f) => f.evidence.length > 0 && f.evidence.every((e) => e.verified);
  const count = (n, one, few, many) => `${n} ${plural(n, one, few, many)}`;
  const sq = (severity) => [h('span', { class: `sq ${severity}`, 'aria-hidden': 'true' }), h('span', { class: 'sr' }, SEV[severity].word)];
  const findingChip = (f, onclick) => h('button', { class: `chip ${f.severity}`, type: 'button', dataset: { f: f.id }, title: f.title, onclick },
    sq(f.severity), f.id);

  document.title = `${P.document_name || 'Отчёт'} — reqaudit`;

  // ---- head: the answer to "can development start?", nothing else competes with it
  const head = h('div', { class: 'wrap report-head' });
  const downloads = [];
  if (EMBEDDED) {
    if (R.report_md) {
      downloads.push(h('button', { class: 'btn', type: 'button', onclick: () => {
        const url = URL.createObjectURL(new Blob([R.report_md], { type: 'text/markdown;charset=utf-8' }));
        const link = h('a', { href: url, download: `${R.run_id}.report.md` });
        document.body.append(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } }, 'Скачать report.md'));
    }
  } else {
    if (R.report_md) downloads.push(h('a', { class: 'btn', href: `/api/runs/${R.run_id}/report.md`, download: '' }, 'Скачать report.md'));
    downloads.push(h('a', { class: 'btn', href: `/api/runs/${R.run_id}/report.html`, download: '' }, 'Скачать report.html'));
  }
  head.append(h('div', { class: 'title-row' }, h('h1', null, P.document_title || P.document_name || 'Отчёт'), downloads));
  const meta = [P.document_name, P.started_at ? fmtDate(P.started_at) : null,
    P.status && P.status !== 'completed' ? (RUN_STATUS[P.status] || P.status) : null].filter(Boolean);
  if (meta.length) head.append(h('div', { class: 'meta-line' }, meta.join(' · ')));

  for (const err of R.errors || []) {
    head.append(h('div', { class: 'notice error' }, h('p', null,
      h('b', null, `Проверка остановилась на шаге «${DEBUG ? err.stage : stageName(err.stage)}». `), err.message)));
  }
  if (R.check_failures && R.check_failures.length) {
    // The reviewer names a check by its title, the second look by its id: show titles in both cases.
    const cellTitle = new Map((R.cells || []).map((c) => [c.id, c.title]));
    const areas = (stage) => [...new Set(R.check_failures.filter((c) => (stage ? c.stage === stage : !['s5', 's6'].includes(c.stage)))
      .map((c) => cellTitle.get(c.cell) || c.cell))];
    const lines = [];
    if (areas('s5').length) lines.push(h('p', null, 'Не проверены: ', areas('s5').join('; '), '.'));
    if (areas('s6').length) lines.push(h('p', null, 'Найденное не перепроверено: ', areas('s6').join('; '), '.'));
    if (areas(null).length) lines.push(h('p', null, 'Также не выполнено: ', areas(null).join('; '), '.'));
    head.append(h('div', { class: 'notice' },
      h('details', null, h('summary', { style: 'cursor:pointer' }, h('b', null, 'Часть проверок не выполнена: модель не ответила')),
        lines,
        DEBUG ? R.check_failures.map((c) => h('p', { style: 'overflow-wrap:anywhere' },
          h('span', { class: 'mono' }, c.stage), ` · ${c.cell}: ${c.message}`)) : null)));
  }

  const critical = R.findings.filter((f) => f.severity === 'critical').length;
  const blocking = R.questions.filter((q) => q.blocks_development && !q.answer).length;

  // How the findings were checked: the funnel from candidates to the report, as a ledger.
  function ledger() {
    const g = R.gate_stats || {};
    const rows = [];
    const row = (label, value, total) => { if (typeof value === 'number') rows.push(h('tr', { class: total ? 'total' : null }, h('td', null, label), h('td', { class: 'num' }, value))); };
    const found = (R.progress.stages.find((s) => s.code === 's5') || {}).summary || {};
    row('Предложено возможных нарушений', found.candidates);
    if (R.rejected) row('Отклонено при перепроверке', R.rejected.by_review);
    row('Передано на сверку цитат', g.in);
    row('Отклонено: цитата не найдена в документе', g.no_evidence);
    row('Отклонено: противоречие подтверждено только с одной стороны', g.one_sided_conflict);
    row('Объединено повторов', g.merged);
    row('Прошло проверку цитат', g.out);
    if (R.editor && typeof R.editor.before === 'number' && typeof R.editor.after === 'number') {
      row('Объединено при редактуре', R.editor.before - R.editor.after);
    }
    row('В отчёте', R.findings.length, true);
    return h('table', { class: 'ledger' }, h('tbody', null, rows));
  }
  const PROOF_TEXT = 'Каждая цитата ищется в тексте документа дословно — без учёта регистра, кавычек и разметки — ' +
    'программой, без участия модели. Находка, для которой цитата не нашлась, в отчёт не попадает.';

  let verdictCard;
  if (R.verdict) {
    const V = R.verdict;
    const first = V.first.slice(0, 3).map((id) => findingById.get(id)).filter(Boolean);
    const word = h('div', { class: 'word' + (V.word.length > 6 ? ' long' : '') + (stampFirstTime(R.run_id) ? ' first' : '') }, V.word);

    const tally = [];
    if (R.units.length) tally.push(count(R.units.length, 'требование', 'требования', 'требований'));
    if (R.findings.length) {
      tally.push(count(R.findings.length, 'нарушение', 'нарушения', 'нарушений')
        + (critical ? `, из них ${count(critical, 'критичное', 'критичных', 'критичных')}` : ''));
    }
    if (R.questions.length) {
      tally.push(count(R.questions.length, 'вопрос автору', 'вопроса автору', 'вопросов автору')
        + (blocking ? ` (${blocking} — до начала разработки)` : ''));
    }

    let proof = null;
    if (R.findings.length) {
      const ok = R.findings.filter(verifiedAll).length;
      const all = ok === R.findings.length;
      const text = R.findings.length === 1
        ? (all ? 'Находка подтверждена цитатой из документа' : 'Цитата находки не найдена в документе')

    scrollToEvidence(f, n);
    pulse(f.id);
  }
  // origin: 'list' — a row beside the document; 'tab' — a row on the "Находки" tab;
  // 'doc' — a quote or a number in the margin; 'jump' — from the verdict or another tab.
  function select(id, origin) {
    const before = state.active;
    state.active = id;
    if (!id) {
      redraw(); paintActive();
      refocus(origin === 'tab' ? tabList : sideList, before);
      return;
    }
    const f = findingById.get(id);
    if (origin === 'tab' || (narrow() && origin !== 'list')) {
      // On the findings tab, or on a narrow screen where the document has no side pane: open it in the list.
      if (state.tab !== 'findings') showTab('findings');
      if (!passes(f)) resetFilters();
      redraw(); paintActive();
      const card = cardIn(tabList, id);
      if (origin === 'tab') refocus(tabList, id);
      else if (card) scrollPageTo(card, 0.02);
      return;
    }
    if (state.tab !== 'doc') showTab('doc');
    redraw(); paintActive();
    if (origin === 'jump') bringSplitIntoView();
    if (origin !== 'doc') { scrollToEvidence(f, 0); pulse(id); }
    if (origin === 'list') refocus(sideList, id);
    else {
      const card = cardIn(sideList, id);
      if (card) scrollInPane(listPane, card);
    }
  }
  function pickFromMark(ids) {
    // Several findings may quote the same words: each click moves to the next one.
    const at = ids.indexOf(state.active);
    select(ids[(at + 1) % ids.length], 'doc');
  }
  function flashBlocks(ids) {
    if (state.tab !== 'doc') showTab('doc');
    if (!narrow()) bringSplitIntoView();
    const els = ids.map((id) => docPane.querySelector(`[data-block="${CSS.escape(id)}"]`)).filter(Boolean);
    if (!els.length) return;
    scrollInPane(docPane, els[0]);
    els.forEach((el) => el.classList.add('flash'));
    setTimeout(() => els.forEach((el) => el.classList.remove('flash')), 600);
  }

  // The author answers here; the server re-checks the document with these answers.
  function answerForm() {
    const fields = R.questions.map((q) => {
      const area = h('textarea', { rows: 2, 'data-q': q.id, placeholder: 'Ответ автора; оставьте пустым, если ответа нет' });
      area.value = q.answer || '';
      return h('label', { class: 'answer-field' }, h('span', { class: 'mono muted' }, q.id), ' ', q.text, area);
    });
    const status = h('p', { class: 'muted', role: 'status' });
    const button = h('button', { class: 'btn primary', type: 'button' }, 'Перепроверить с ответами');
    button.onclick = async () => {
      const answers = {};
      for (const area of fields.map((f) => f.querySelector('textarea'))) {
        if (area.value.trim()) answers[area.dataset.q] = area.value.trim();
      }
      if (!Object.keys(answers).length) { status.textContent = 'Впишите ответ хотя бы на один вопрос.'; return; }
      button.disabled = true;
      status.textContent = 'Запускаю перепроверку…';
      try {
        const res = await api(`/api/runs/${R.run_id}/answers`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answers }) });
        go(`#/run/${res.run_id}`);
      } catch (err) {
        button.disabled = false;
        status.textContent = err.message || String(err);
      }
    };
    return h('div', { class: 'card pad answers' },
      h('h3', null, 'Ответить на вопросы'),
      h('p', { class: 'muted' }, 'Агент перепроверит находки, к которым относится каждый ответ: дефект останется (ответ вне документа его не исправляет, и агент предложит правку текста), снимется или поменяет серьёзность. Уже сделанные этапы берутся из кэша.'),
      fields, h('div', { style: 'margin-top:12px' }, button), status);
  }

  function secMatrix() {
    const box = h('div');
    if (!R.units.length || !R.checks_ran) {
      box.append(h('div', { class: 'card empty' }, 'Матрица строится по результатам проверки требований, а в этом прогоне она не выполнялась.'));
      return box;
    }
    const failed = new Set((R.check_failures || []).filter((c) => c.stage === 's5').map((c) => c.cell));
    const checked = new Set(); // "unit|criterion"
    const setChecked = new Set();
    for (const cell of R.cells || []) {
      if (failed.has(cell.title)) continue;
      for (const c of cell.criteria) {
        // A check over the whole set says nothing about one requirement's own criteria.
        if (!cell.unit_ids.length && criterion(c).level !== 'requirement') setChecked.add(c);
        for (const u of cell.unit_ids) checked.add(`${u}|${c}`);
      }
    }
    const used = new Set();
    for (const cell of R.cells || []) for (const c of cell.criteria) if (cell.unit_ids.length) used.add(c);
    for (const f of R.findings) if (f.unit_ids.length) used.add(f.criterion);
    const order = Object.keys(R.criteria).filter((c) => used.has(c));
    const levels = { requirement: 'Отдельное требование', set: 'Набор требований', document: 'Документ' };
    const groups = [];
    for (const c of order) {
      const level = criterion(c).level;
      if (groups.length && groups[groups.length - 1].level === level) groups[groups.length - 1].span++;
      else groups.push({ level, span: 1 });
    }
    const withFindings = R.units.filter((u) => R.findings.some((f) => f.unit_ids.includes(u.id)));
    const rows = state.matrixAll ? R.units : withFindings;
    const pick = (all) => { state.matrixAll = all; showTab('details'); };
    box.append(h('div', { class: 'filters' },
      h('button', { class: 'toggle', type: 'button', 'aria-pressed': String(!state.matrixAll), onclick: () => pick(false) },
        `С нарушениями · ${withFindings.length}`),
      h('button', { class: 'toggle', type: 'button', 'aria-pressed': String(state.matrixAll), onclick: () => pick(true) },
        `Все ${R.units.length}`)));
    box.append(h('div', { class: 'legend' },
      Object.keys(SEV).map((s) => h('span', { class: 'swatch' }, h('span', { class: `cellbox ${s}` }, SEV[s].letter), SEV[s].word)),
      h('span', { class: 'swatch' }, h('span', { class: 'cellbox clean' }), 'проверено, нарушений нет'),
      h('span', { class: 'swatch' }, h('span', { class: 'cellbox none' }), 'не проверялось')));
    if (!rows.length) {
      box.append(h('div', { class: 'card empty' }, 'Ни одно требование не получило замечаний.'));
      return box;
    }
    const table = h('table', { class: 'matrix card' });
    table.append(h('thead', null,
      h('tr', null, h('th', { class: 'group corner', rowspan: '2' }, 'Требование'),
        groups.map((g) => h('th', { class: 'group', colspan: String(g.span) }, levels[g.level] || g.level))),
      h('tr', null, order.map((c) => h('th', { title: criterion(c).standard || '' }, h('div', { class: 'vert' }, criterion(c).label))))));
    const body = h('tbody');
    for (const u of rows) {
      const row = h('tr', null, onActivate(h('th', { class: 'rowhead mono', tabindex: '0', title: u.summary }, unitLabel(u.id)),
        () => flashBlocks(u.block_ids)));
      for (const c of order) {
        const hits = R.findings.filter((f) => f.criterion === c && f.unit_ids.includes(u.id))
          .sort((a, b) => SEV[a.severity].rank - SEV[b.severity].rank);
        let cell;
        if (hits.length) {
          const worst = hits[0];
          cell = h('button', { type: 'button', title: hits.map((f) => `${f.id} · ${SEV[f.severity].word} · ${f.title}`).join('\n'),
            'aria-label': `${u.id}, ${criterion(c).label}: ${SEV[worst.severity].word}, ${hits.map((f) => f.id).join(', ')}`,
            onclick: () => select(worst.id, 'jump') },
            h('span', { class: `cellbox ${worst.severity}` }, hits.length > 1 ? hits.length : SEV[worst.severity].letter));
        } else if (checked.has(`${u.id}|${c}`) || setChecked.has(c)) {
          cell = h('span', { class: 'cellbox', title: 'проверено, нарушений нет' });
        } else {
          cell = h('span', { class: 'cellbox none', title: 'не проверялось' });
        }
        row.append(h('td', null, cell));
      }
      body.append(row);
    }
    table.append(body);
    box.append(h('div', { class: 'table-scroll', style: 'overflow:visible' }, table));
    return box;
  }

              h('button', { class: 'linkish', type: 'button', onclick: () => flashBlocks([x.block_id]) }, 'показать в документе'))))))));

        h('thead', null, h('tr', null, h('th', { colspan: '2' }, 'Паспорт прогона'))), h('tbody', null, rows))));
    }
    const notes = [...(P.setup_notes || []), ...((R.intake && R.intake.warnings) || []), ...((R.document && R.document.warnings) || []),
      ...((R.document && R.document.issues) || []).map((i) => (i.line ? `строка ${i.line}: ` : '') + i.message)];
    if (notes.length) box.append(h('div', { class: 'card pad', style: 'margin-top:12px' }, h('div', { class: 'section-title' }, 'Замечания к настройке и чтению файла'),
      notes.map((n) => h('p', { style: 'margin:0 0 4px' }, n))));
    return box;
  }

  const SECTIONS = [['units', 'Требования', R.units.length, secUnits], ['matrix', 'Матрица', null, secMatrix],
    ['set', 'Противоречия', null, secSet], ['run', 'Как проверялось', null, secRun]];
  function tabDetails() {
    const box = h('div', { class: 'tabpanel' });
    box.append(h('div', { class: 'subnav', role: 'group', 'aria-label': 'Раздел' }, SECTIONS.map(([id, label, n]) =>
      h('button', { class: 'toggle', type: 'button', 'aria-pressed': String(state.detail === id),
        onclick: () => { state.detail = id; showTab('details'); } }, label, n ? ` · ${n}` : null))));
    const [, , , build] = SECTIONS.find(([id]) => id === state.detail) || SECTIONS[0];
    box.append(build());
    return box;
  }

  const builders = { findings: tabFindings, questions: tabQuestions, details: tabDetails };
  function showTab(id) {
    state.tab = id;
    for (const [name, button] of tabButtons) button.setAttribute('aria-selected', String(name === id));
    clear(panel);
    if (id === 'doc') {
      panel.append(split);
      paintActive();
    } else {
      panel.append(builders[id]());
      if (id === 'findings') redraw();
    }
  }

  clear(app).append(head, tabs, panel);
  redraw();
  showTab('doc');
}

route();
})();
</script>
</body>
</html>
