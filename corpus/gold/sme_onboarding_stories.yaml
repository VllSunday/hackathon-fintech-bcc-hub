traps:
  - id: T-01
    quotes:
      - "Сделать открытие счёта для ИП быстрым и удобным, без визита в отделение."
    looks_like: verifiable
    why_not: Это цель продукта в разделе «Назначение и цели», а не требование; измеримые сроки заданы в НФТ-2 и таблице параметров.
  - id: T-02
    quotes:
      - "за 120 секунд или быстрее"
      - "Время на прохождение биометрической проверки | 2 | мин"
    looks_like: set_consistent
    why_not: Значение дано в двух единицах, но пересчёт верный (120 с = 2 мин).
  - id: T-03
    quotes:
      - "размером не более 10 МБ каждое"
      - "Максимальный размер файла документа | 10 240 | КБ"
    looks_like: set_consistent
    why_not: 10 МБ = 10 240 КБ (1 МБ = 1024 КБ), противоречия нет.
  - id: T-04
    quotes:
      - "Когда банк запрашивает реестр ИП через ШЭП"
    looks_like: set_comprehensible
    why_not: Сокращения ШЭП и «Реестр ИП» определены в глоссарии.
  - id: T-05
    quotes:
      - "Тогда в уведомлении указывается причина отказа и дата"
      - "Исключение из US-14: если отказ принят по результатам проверки по перечням ПОД/ФТ"
    looks_like: set_consistent
    why_not: Кажущееся противоречие (причина отказа сообщается / не сообщается) снято явным исключением в US-10 со ссылкой на законодательство о ПОД/ФТ.
  - id: T-06
    quotes:
      - "Когда он снова входит по номеру телефона в пределах срока хранения черновика"
      - "Срок хранения черновика | 30 | календарных дней"
    looks_like: verifiable
    why_not: В истории US-04 нет числа, но срок задан в таблице параметров раздела 6, на которую история явно ссылается.
