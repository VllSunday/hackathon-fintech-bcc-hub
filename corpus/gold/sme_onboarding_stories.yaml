document: far/sme_onboarding_stories.md
annotators: [generator]
requirements_total: 29   # 22 истории (US-01..US-21, US-11 дважды) + 7 НФТ; бизнес-правила БП-1..БП-4 отдельно не считаются
defects:
  - id: G-01
    scope: pair
    criterion: set_consistent
    severity: critical
    kind: cross_section
    quotes:
      - "Когда заявитель не ответил в течение 5 рабочих дней"
      - "Срок ответа заявителя на запрос уточнений | 10 | календарных дней"
    note: Срок ответа на запрос уточнений в US-15 (5 рабочих дней) и в таблице параметров (10 календарных дней) различается; неясно, когда автоматически отклонять заявку.
  - id: G-02
    scope: pair
    criterion: set_consistent
    severity: critical
    kind: cross_section
    quotes:
      - "Если заявитель найден в перечнях ПОД/ФТ, заявка автоматически переводится в статус «Отклонена»"
      - "Тогда заявка переводится в статус «На проверке» и назначается комплаенс-офицеру"
    note: Бизнес-правило БП-3 требует автоматического отказа при совпадении с перечнями, а критерий приёмки US-10 — передачи заявки комплаенс-офицеру; разработчик и тестировщик не знают, какое поведение верное.
  - id: G-03
    scope: pair
    criterion: set_consistent
    severity: major
    kind: cross_section
    quotes:
      - "а повторно запросить код можно через 60 секунд"
      - "Интервал до повторной отправки кода | 60 | мин"
    note: Интервал повторной отправки кода в US-01 задан в секундах, а в таблице параметров то же число в минутах; одна из величин неверна.
  - id: G-04
    scope: requirement
    criterion: set_complete
    severity: major
    kind: missing
    quotes:
      - "Тогда в заявку подставляются наименование ИП, дата регистрации, адрес и основной ОКЭД"
    note: В US-03 нет сценария недоступности ШЭП или реестра ИП (таймаут, повторы, что видит заявитель), хотя для ГБД ФЛ и биометрии такие сценарии есть.
  - id: G-05
    scope: requirement
    criterion: verifiable
    severity: major
    kind: local
    quotes:
      - "Доступность сервиса дистанционного открытия счёта — не ниже 99,5 %."
    note: Процент доступности без периода измерения и без определения недоступности; проверить «прошло/не прошло» нельзя.
  - id: G-06
    scope: requirement
    criterion: verifiable
    severity: major
    kind: local
    quotes:
      - "Экран загрузки документов должен быстро реагировать на действия пользователя."
    note: «Быстро» без порога времени и условий измерения; требование непроверяемо.
  - id: G-07
    scope: set
    criterion: unambiguous
    severity: critical
    kind: cross_section
    quotes:
      - "Биометрическая проверка личности заявителя: проверка «живого присутствия» (liveness)"
      - "Когда операционист завершает верификацию документов и нажимает «Одобрить»"
      - "Когда прошло не более 15 минут после успешной верификации"
    note: Термин «верификация» в глоссарии означает биометрию, а в US-12 — проверку документов операционистом; в US-19 непонятно, от какого события отсчитывать 15 минут на открытие счёта.
  - id: G-08
    scope: requirement
    criterion: set_comprehensible
    severity: major
    kind: local
    quotes:
      - "Когда по данным внешнего справочника заявитель является ПДЛ или его родственником"
    note: Сокращение ПДЛ не определено в глоссарии, не указано, какой справочник используется и какие степени родства учитываются; реализовать проверку однозначно нельзя.
  - id: G-09
    scope: requirement
    criterion: singular
    severity: major
    kind: local
    quotes:
      - "скачать его в PDF и получить копию на электронную почту"
    note: US-18 объединяет три обязательства (подписание, скачивание, отправку на e-mail); для отправки на почту нет критерия приёмки и не сказано, откуда берётся адрес.
  - id: G-10
    scope: requirement
    criterion: appropriate
    severity: minor
    kind: local
    quotes:
      - "Распознавание выполняется на устройстве клиента библиотекой Tesseract OCR версии 5"
    note: В пользовательскую историю вставлено проектное решение (место выполнения, библиотека и версия, формат передачи) вместо потребности.
  - id: G-11
    scope: pair
    criterion: complete
    severity: major
    kind: cross_section
    quotes:
      - "Когда этот ОКЭД входит в перечень из Приложения А"
      - "TBD (ожидается от службы комплаенс)"
    note: US-05 опирается на перечень ОКЭД из Приложения А, а в приложении вместо перечня стоит TBD; проверку вида деятельности не реализовать и не протестировать.
  - id: G-12
    scope: document
    criterion: document_integrity
    severity: minor
    kind: local
    quotes:
      - "<ФИО, должность согласующего>"
    note: Поле «Согласовано» содержит незаполненную заглушку шаблона.
  - id: G-13
    scope: pair
    criterion: traceable
    severity: minor
    kind: local
    quotes:
      - "US-11. Проверка публичных должностных лиц"
      - "US-11. Очередь комплаенс-офицера"
    note: Две разные истории имеют один идентификатор US-11; ссылки и трассировка к тестам становятся неоднозначными.
  - id: G-14
    scope: pair
    criterion: set_consistent
    severity: major
    kind: cross_section
    quotes:
      - "Отозвана | Заявитель отозвал заявку | Черновик, Подана, Требуются уточнения"
      - "Дано заявка заявителя в статусе «На проверке»"
    note: Статусная модель не допускает перехода «На проверке» → «Отозвана», а критерий приёмки US-17 проверяет именно его.
  - id: G-15
    scope: pair
    criterion: modifiable
    severity: minor
    kind: cross_section
    quotes:
      - "И на экране «Заявка» отображается IBAN открытого счёта"
      - "Тогда на экране отображаются IBAN открытого счёта, БИК банка, наименование ИП, ИИН и КБе 19"
    note: Отображение IBAN на экране «Заявка» описано и в US-19, и в US-20; при изменении состава реквизитов придётся править оба места.
  - id: G-16
    scope: set
    criterion: set_complete
    severity: major
    kind: missing
    quotes:
      - "На один ИИН может быть не больше одной активной заявки."
      - "Срок, через который можно подать новую заявку после отказа | 30 | календарных дней"
    note: Ни в одной истории нет сценария, что происходит при попытке создать вторую активную заявку или подать новую заявку раньше 30 дней после отказа (на каком шаге проверка, какое сообщение). Дефект найден при самопроверке.
  - id: G-17
    scope: requirement
    criterion: complete
    severity: major
    kind: missing
    quotes:
      - "Дано срок хранения черновика истёк"
    note: Срок хранения 30 дней задан, но не сказано, от какого момента он отсчитывается (создание черновика или последнее изменение); тестировщик не построит граничный случай удаления. Дефект найден при сверке эталона, добавлен после генерации.
  - id: G-18
    scope: set
    criterion: conforming
    severity: minor
    kind: cross_section
    quotes:
      - "Как банк, я хочу не принимать дистанционно заявки"
      - "Как банк, я хочу убедиться, что заявку подаёт сам владелец удостоверения"
    note: Истории US-05 и US-09 написаны от роли «банк», которой нет в таблице ролей раздела 2; неясно, чей это интерес и кто принимает работу. Дефект найден при сверке эталона, добавлен после генерации.
