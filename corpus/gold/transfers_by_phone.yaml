traps:
  - id: T-01
    quotes:
      - "Клиент должен быстро и без ошибок переводить деньги знакомым"
    looks_like: verifiable
    why_not: Фраза в разделе «Цели», это не требование; измеримое время ответа задано в НФТ-1.
  - id: T-02
    quotes:
      - "10 000–30 000 000 | Сумма перевода в тиынах"
    looks_like: set_consistent
    why_not: Диапазон в тиынах явно помечен единицей и точно соответствует разовому лимиту 100–300 000 ₸ (1 ₸ = 100 тиынов); ДН-1 требует передавать суммы в тиынах.
  - id: T-03
    quotes:
      - "Поиск получателя выполняется через CIF по подтверждённому номеру телефона."
    looks_like: set_comprehensible
    why_not: Сокращение CIF определено в разделе «Термины».
  - id: T-04
    quotes:
      - "Пакет «Премиум», за сегодня переведено 1 500 000 ₸ | Перевести 300 000 ₸ | Перевод выполнен"
    looks_like: set_consistent
    why_not: Итог 1 800 000 ₸ превышает стандартный лимит 1 000 000 ₸, но для пакета «Премиум» таблица задаёт отдельный дневной лимит 3 000 000 ₸, а Ф-6 ссылается на лимит пакета клиента.
  - id: T-05
    quotes:
      - "Сумма одного перевода должна находиться в пределах разового лимита из таблицы «Лимиты и тарифы», обе границы включены."
    looks_like: verifiable
    why_not: В требовании нет чисел, но границы 100 ₸ и 300 000 ₸ заданы в таблице «Лимиты и тарифы», на которую оно ссылается.
  - id: T-06
    quotes:
      - "С начала месяца переведено 500 000 ₸ | Перевести 20 000 ₸ | Комиссия 200 ₸"
    looks_like: correct
    why_not: Бесплатный объём исчерпан полностью, поэтому вся сумма 20 000 ₸ сверх него и 1 % даёт 200 ₸ — расчёт верен (если максимальная комиссия, ещё не заданная, не окажется ниже 200 ₸).
