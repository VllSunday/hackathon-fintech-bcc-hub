/* A reviewer's desk: a white sheet on a grey-green table, rules instead of shadows, one ink accent.
   Defects are drawn on the sheet with three tools: red pen (critical), yellow marker (major),
   pencil (minor). Tokens first, then components, then screens. */
:root {
  --bg: #eef0ec; --surface: #ffffff; --surface-2: #f5f6f2;
  --line: #d8dcd3; --line-strong: #b5bbae;
  --text: #161a16; --muted: #5a6259;
  --accent: #2438a6; --accent-soft: #e6e9f7; --on-accent: #ffffff;
  --red: #c4281c; --red-soft: #fbe6e3;
  --marker: #ffe27a; --marker-ink: #6b4700;
  --pencil: #6b7280;
  --ok: #1e7b4b; --ok-soft: #e1f1e8;
  --warn-soft: #fdf3cf;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r: 3px;
  --t-fast: 120ms; --t-panel: 240ms;
  --ease-out: cubic-bezier(.2, .7, .2, 1); --ease-in: cubic-bezier(.5, 0, .9, .4);
  /* two families and a mono for identifiers */
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --display: var(--sans);
  --serif: "PT Serif", Cambria, Georgia, serif;
  --mono: "IBM Plex Mono", Consolas, ui-monospace, Menlo, monospace;
  /* six sizes: meta, interface, reading, section, title, stamp */
  --fs-1: 12px; --fs-2: 14px; --fs-3: 16px; --fs-4: 20px; --fs-5: 28px; --fs-6: 34px;
  /* a quote at the moment it is pointed at: the same tool, pressed harder */
  --pulse-major: #ffc21a; --pulse-critical: #f3a59c; --pulse-minor: #d3d7de;
  --tabs-h: 45px;
}
:root[data-theme="dark"] {
  --bg: #141614; --surface: #1b1e1b; --surface-2: #222622;
  --line: #2f352f; --line-strong: #4a524a;
  --text: #e7eae5; --muted: #a1a99f;
  --accent: #9aa9f5; --accent-soft: #232a4d; --on-accent: #10142b;
  --red: #f0766b; --red-soft: #3a1e1b;
  --marker: #e9c94f; --marker-ink: #f0d27a;
  --pencil: #a3a9b3;
  --ok: #5cc08b; --ok-soft: #18301f;
  --warn-soft: #3a3214;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size: var(--fs-2); line-height: 1.45; -webkit-text-size-adjust: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); }
.mono { font-family: var(--mono); font-size: var(--fs-2); }
.muted { color: var(--muted); }
.wrap { max-width: 1680px; margin: 0 auto; padding: 0 var(--s6); }
.grow { flex: 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--sans); font-weight: 600; line-height: 1.2; }
h1 { font-size: var(--fs-5); }
h2 { font-size: var(--fs-4); }

/* Motion: screens and tabs change by a 120 ms fade, never by sliding in. Things blink only
   while a run is going; a finished report holds still except the stamp, once. */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 50% { opacity: .3; } }
@keyframes shimmer { 50% { opacity: .5; } }
#app.enter > * { animation: fade var(--t-fast) linear; }

/* top bar */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: var(--s3); min-height: 56px; }
.brand { font-family: var(--sans); font-weight: 600; font-size: var(--fs-4); letter-spacing: .01em;
  color: var(--text); text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 34px;
  padding: 6px 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface);
  color: var(--text); text-decoration: none; cursor: pointer; font-size: var(--fs-2); font-weight: 600; white-space: nowrap;
  transition: border-color var(--t-fast) var(--ease-out), background-color var(--t-fast) var(--ease-out),
    transform var(--t-fast) var(--ease-out); }
.btn:hover { border-color: var(--text); }
.btn:active { transform: translateY(1px); }
.btn.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { border-color: var(--text); }
.btn.primary:disabled { border-color: var(--line-strong); background: var(--line); color: var(--muted); cursor: not-allowed; transform: none; }
.btn.big { min-height: 40px; padding: 8px 20px; font-size: var(--fs-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: var(--s2); }
.btn.ghost:hover { border-color: transparent; text-decoration: underline; text-underline-offset: 3px; }
.btn.icon { width: 34px; padding: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; }
.pad { padding: var(--s4) 20px; }
.section-title { font-size: var(--fs-1); color: var(--muted); margin: 0 0 var(--s2); }
.notice { border: 1px solid var(--line); border-left: 3px solid var(--marker-ink); background: var(--warn-soft);
  border-radius: 2px; padding: 10px var(--s4); margin: var(--s3) 0; }
.notice.error { border-left-color: var(--red); background: var(--red-soft); }
.notice.ok { border-left-color: var(--ok); background: var(--ok-soft); }
.notice p { margin: 0 0 var(--s1); } .notice p:last-child { margin: 0; }
.notice details p { margin: 6px 0 0; }
.notice code { font-family: var(--mono); font-size: var(--fs-2); }
.empty { padding: var(--s6) var(--s4); color: var(--muted); }
.skeleton { display: grid; gap: var(--s3); padding: var(--s5) 0; }
.skeleton i { display: block; height: 14px; width: var(--w, 100%); background: var(--line); border-radius: 2px;
  animation: shimmer 1.2s var(--ease-out) infinite; }

/* upload screen: a narrow column to start a check, a wide one for the journal */
.upload { display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: var(--s7) 56px; align-items: start;
  padding-top: 40px; padding-bottom: 56px; }
.upload > section { display: grid; gap: 20px; min-width: 0; }
.drop { min-height: 180px; display: grid; align-content: end; gap: 6px; padding: var(--s5); cursor: pointer;
  background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 4px;
  transition: border-color var(--t-fast) var(--ease-out), background-color var(--t-fast) var(--ease-out); }
.drop:hover { border-color: var(--text); }
.drop.over { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.drop.has-file { border-style: solid; border-color: var(--text); }
.drop strong { font-size: var(--fs-3); font-weight: 600; overflow-wrap: anywhere; }
.drop.has-file strong { animation: fade var(--t-panel) var(--ease-out); }
.drop .hint { color: var(--muted); font-size: var(--fs-2); }
.form-row { display: flex; gap: var(--s4); align-items: center; flex-wrap: wrap; }
.journal-head { display: flex; gap: 10px; align-items: baseline; }
.journal-head span { font-family: var(--mono); font-size: var(--fs-2); color: var(--muted); }
.runs { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; }
.run, .run-head { display: grid; grid-template-columns: minmax(0, 1fr) 124px 176px repeat(4, 54px); gap: var(--s1) var(--s4);
  align-items: center; padding: var(--s3) var(--s4); }
.run-head { padding-block: var(--s2); background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: var(--fs-1); color: var(--muted); }
.run-head .num { text-align: right; }
.run { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line);
  transition: background-color var(--t-fast) var(--ease-out); }
.run:last-child { border-bottom: 0; }
.run:hover { background: var(--surface-2); }
.run:active { background: var(--accent-soft); }
.run-doc { min-width: 0; display: grid; gap: 2px; }
.run-doc b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-doc span { font-size: var(--fs-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-date { font-family: var(--mono); font-size: var(--fs-2); white-space: nowrap; }
.stat { text-align: right; }
.stat b { font-family: var(--sans); font-weight: 600; font-size: var(--fs-3); font-variant-numeric: tabular-nums; }
.stat span { display: none; font-size: var(--fs-1); color: var(--muted); }
.stat.crit b { color: var(--red); }
.stat.zero b { color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-2); min-width: 0; }
.pill::before { content: ""; flex: none; width: 8px; height: 8px; background: var(--marker); outline: 1px solid var(--marker-ink); outline-offset: -1px; }
.pill.completed::before { background: var(--ok); outline: 0; }
.pill.partial::before, .pill.interrupted::before, .pill.input_rejected::before { background: var(--red); outline: 0; }
.pill.running::before { background: var(--accent); outline: 0; animation: blink 1s var(--ease-out) infinite; }
@media (max-width: 1100px) { .upload { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .run-head { display: none; }
  .run { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .run-doc, .run-date, .run .pill { grid-column: 1 / -1; }
  .stat { text-align: left; } .stat span { display: block; }
}

/* generic tables */
table { border-collapse: collapse; width: 100%; }
.grid-table th, .grid-table td { text-align: left; padding: 10px var(--s4); border-bottom: 1px solid var(--line);
  vertical-align: top; font-size: var(--fs-2); }
.grid-table tr:last-child td { border-bottom: 0; }
.grid-table th { font-size: var(--fs-1); color: var(--muted); font-weight: 400; background: var(--surface-2); position: sticky; top: 0; }
.grid-table td.mono, .grid-table td.prio, .grid-table th { white-space: nowrap; }
.grid-table .chip { white-space: nowrap; }
.grid-table tbody tr { transition: background-color var(--t-fast) var(--ease-out); }
.grid-table tbody tr.click { cursor: pointer; }
.grid-table tbody tr.click:hover { background: var(--surface-2); }
.num { text-align: right !important; font-variant-numeric: tabular-nums; }
.table-scroll { overflow-x: auto; }

/* run screen */
.runview { padding-top: 40px; padding-bottom: 56px; }
.scan { display: grid; gap: var(--s2); justify-items: start; margin-bottom: var(--s7); }
.scan h1 { overflow-wrap: anywhere; }
.now { display: flex; align-items: center; gap: 10px; font-size: var(--fs-3); font-weight: 600; min-height: 24px; }
.now .dot { width: 10px; height: 10px; background: var(--accent); }
.scan.running .now .dot { animation: blink 1s var(--ease-out) infinite; }
.scan.finished .now .dot { background: var(--ok); }
.scan.failed .now .dot { background: var(--red); }
.clock { font-family: var(--sans); font-weight: 600; font-size: 72px; line-height: 1.05;
  letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.runbar { width: min(420px, 100%); height: 3px; background: var(--line); overflow: hidden; }
.runbar i { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(var(--p, 0));
  transition: transform var(--t-panel) var(--ease-out); }
.scan .btn { margin-top: var(--s3); }
@media (max-width: 620px) { .clock { font-size: 52px; } }

/* stage track */
.chain { display: grid; grid-template-columns: repeat(var(--stages, 10), minmax(0, 1fr)); margin: var(--s4) 0 var(--s2); }
.stage { position: relative; display: grid; align-content: start; gap: 2px; padding: 20px var(--s2) 0 0; min-width: 0; }
.stage::before { content: ""; position: absolute; top: 5px; left: 0; width: 100%; height: 1px; background: var(--line-strong);
  transition: background-color var(--t-panel) var(--ease-out); }
.stage:last-child::before { display: none; }
.stage.done::before, .stage.not_needed::before { background: var(--accent); }
.node { position: absolute; top: 0; left: 0; width: 11px; height: 11px; background: var(--bg); border: 1px solid var(--line-strong);
  transition: background-color var(--t-panel) var(--ease-out), border-color var(--t-panel) var(--ease-out); }
.stage.done .node { background: var(--accent); border-color: var(--accent); }
.stage.running .node { border: 3px solid var(--accent); animation: blink 1s var(--ease-out) infinite; }
.stage.error .node, .stage.interrupted .node { background: var(--red); border-color: var(--red); }
.stage.not_needed .node, .stage.skipped .node { border-style: dashed; }
.stage .code { font-family: var(--mono); font-size: var(--fs-1); color: var(--muted); }
.stage .name { font-weight: 600; font-size: var(--fs-2); line-height: 1.3; }
.stage .state { font-size: var(--fs-1); color: var(--muted); }
.stage.done .state, .stage.pending .state { display: none; }
.stage.running .state { color: var(--accent); }
.stage.error .state, .stage.interrupted .state { color: var(--red); }
.stage .meta { font-size: var(--fs-1); color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }
.stage.pending .name { color: var(--muted); font-weight: 400; }
@media (max-width: 1100px) {
  .chain { grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
  .stage { padding: 0 0 0 var(--s5); }
  .stage::before { top: 11px; left: 5px; width: 1px; height: calc(100% + 6px); }
  .node { top: 3px; }
}

/* report head: the answer first — stamp, one sentence, the three findings to fix */
.report-head { padding-top: var(--s5); padding-bottom: var(--s5); display: grid; gap: var(--s3); }
.report-head .notice { margin: 0; }
.title-row { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.title-row h1 { flex: 1; min-width: 240px; font-size: var(--fs-5); }
.meta-line { font-size: var(--fs-1); color: var(--muted); margin-top: calc(-1 * var(--s2)); }
.verdict { display: grid; grid-template-columns: minmax(220px, auto) minmax(0, 1fr); gap: 0; background: var(--surface);
  border: 1px solid var(--line); border-radius: 2px; --v: var(--muted); }
.verdict.no { --v: var(--red); } .verdict.conditional { --v: var(--marker-ink); } .verdict.yes { --v: var(--ok); }
.verdict > div { padding: 20px var(--s5); min-width: 0; }
.verdict > div + div { border-left: 1px solid var(--line); }
.verdict .q { font-size: var(--fs-1); color: var(--muted); margin-bottom: var(--s3); }
/* the one staged moment of the report: the verdict is stamped onto the page, once */
@keyframes stamp { from { opacity: 0; transform: rotate(-3deg) scale(1.18); } to { opacity: 1; transform: rotate(-3deg); } }
.verdict .word { display: inline-block; font-family: var(--sans); font-weight: 600; font-size: var(--fs-6);
  line-height: 1.05; color: var(--v); padding: 6px 18px 8px; border: 3px solid var(--v);
  border-radius: 3px; box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4px var(--v); transform: rotate(-3deg);
  max-width: 100%; overflow-wrap: anywhere; }
.verdict .word.first { animation: stamp var(--t-panel) var(--ease-out) 160ms backwards; }
.verdict .word.long { font-size: var(--fs-5); }
.verdict .word.plain { font-size: var(--fs-4); }
.verdict .lead { margin: 0; font-size: var(--fs-3); line-height: 1.5; max-width: 72ch; }
.verdict .incomplete { margin: var(--s2) 0 0; color: var(--muted); }
.fixes { margin: var(--s4) 0 0; padding: 0; list-style: none; border-bottom: 1px solid var(--line); }
.fixes button { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: var(--s3); align-items: center;
  padding: var(--s2) 0; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; text-align: left;
  font-size: var(--fs-3); transition: background-color var(--t-fast) linear; }
.fixes button:hover { background: var(--surface-2); }
.fixes button:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.fixes .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fixes .mono { color: var(--muted); }
.tally { margin: var(--s3) 0 0; font-size: var(--fs-2); }
.tally .sep { color: var(--line-strong); padding: 0 var(--s2); }
.proof { margin: var(--s2) 0 0; font-size: var(--fs-2); color: var(--muted); display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3);
  align-items: center; }
.proof .ok { display: inline-flex; gap: 6px; align-items: center; }
.proof .ok svg { color: var(--ok); }
.proof-box { margin-top: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--line); max-width: 560px; }
.proof-box p { margin: 0 0 var(--s2); color: var(--muted); }
.ledger { width: 100%; max-width: 560px; font-size: var(--fs-2); }
.ledger td { padding: 3px 0; border-bottom: 1px dotted var(--line); }
.ledger td.num { width: 64px; font-variant-numeric: tabular-nums; }
.ledger tr.total td { font-weight: 600; border-bottom: 0; padding-top: 6px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font-size: inherit;
  text-decoration: underline; text-underline-offset: 3px; text-decoration-color: transparent;
  transition: text-decoration-color var(--t-fast) linear; }
.linkish:hover { text-decoration-color: currentColor; }
/* a small square says the severity next to an id; the word is there for screen readers */
.sq { display: inline-block; flex: none; width: 10px; height: 10px; border: 1px solid var(--pencil); }
.sq.critical { background: var(--red); border-color: var(--red); }
.sq.major { background: var(--marker); border-color: var(--marker-ink); }
@media (max-width: 640px) { .verdict { grid-template-columns: minmax(0, 1fr); }
  .verdict > div + div { border-left: 0; border-top: 1px solid var(--line); } }

/* tabs: the chosen one is underlined at once, nothing slides */
.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); }
.tabs .wrap { display: flex; gap: 28px; min-height: var(--tabs-h); align-items: stretch; overflow-x: auto;
  box-shadow: inset 0 -1px 0 var(--line-strong); }
.tab { border: 0; background: transparent; padding: 0; cursor: pointer; font-size: var(--fs-2); color: var(--muted);
  white-space: nowrap; box-shadow: inset 0 -2px 0 transparent; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.tab .count { font-family: var(--mono); font-size: var(--fs-1); margin-left: 6px; color: var(--muted); font-weight: 400; }
.tabpanel { padding: var(--s4) 0 var(--s7); animation: fade var(--t-fast) linear; }
.subnav { display: flex; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s4); }

/* split: the sheet and the findings */
.split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(380px, 2fr); gap: var(--s4);
  height: calc(100vh - var(--tabs-h)); padding-top: var(--s4); animation: fade var(--t-fast) linear; }
.pane { overflow: auto; min-height: 0; scrollbar-width: thin; border: 1px solid var(--line); border-bottom: 0; }
.pane.doc-pane {
  /* the document is paper in both themes */
  --surface: #ffffff; --surface-2: #f5f6f2; --line: #d8dcd3; --line-strong: #b5bbae; --text: #161a16; --muted: #5a6259;
  --accent: #2438a6; --accent-soft: #e6e9f7; --red: #c4281c; --red-soft: #fbe6e3; --marker: #ffe27a; --marker-ink: #6b4700;
  --pencil: #6b7280;
  background: var(--surface); color: var(--text); }
.pane.list-pane { background: var(--surface); }
.doc { padding: 28px 36px 80px; font-family: var(--serif); font-size: var(--fs-3); }
.blk { display: grid; grid-template-columns: minmax(0, 68ch) 96px; column-gap: 20px;
  transition: background-color var(--t-fast) linear; }
.blk.flash { background: var(--accent-soft); }
.blk.doubt { box-shadow: inset 3px 0 0 var(--marker-ink); }

.blk-side { display: grid; align-content: start; justify-items: start; gap: 2px; padding-top: 5px; min-width: 0; font-family: var(--sans); }
.blk.heading .blk-text { font-weight: 700; padding-top: var(--s4); line-height: 1.3; }
.blk.h1 .blk-text { font-size: var(--fs-4); } .blk.h2 .blk-text, .blk.h3 .blk-text, .blk.h4 .blk-text { font-size: var(--fs-3); }
.blk.list_item .blk-text { padding-left: 22px; position: relative; }
.blk.list_item .blk-text::before { content: "–"; position: absolute; left: 6px; color: var(--muted); }
.blk.code .blk-text { font-family: var(--mono); font-size: var(--fs-2); white-space: pre-wrap; background: var(--surface-2);
  padding: var(--s2) var(--s3); margin: var(--s1) 0; }
.blk.hidden-text .blk-text, .blk.image_text .blk-text { border: 1px dashed var(--line-strong); padding: 6px 10px; margin: var(--s1) 0; }
.blk-note { display: block; font-family: var(--sans); font-size: var(--fs-1); color: var(--muted); font-style: normal; }
.blk.header_footer .blk-text { color: var(--muted); font-size: var(--fs-2); }
.blk.row .blk-text { padding: 0; }
.row-table { table-layout: fixed; font-size: var(--fs-2); }
.row-table td { border: 1px solid var(--line); padding: 6px 9px; vertical-align: top; line-height: 1.45; }
.blk.table .row-table td { font-weight: 700; background: var(--surface-2); }
.blk.row + .blk.row .row-table td { border-top: 0; }
.uid { font-family: var(--mono); font-size: var(--fs-1); color: var(--muted); }
/* code the document itself marks as code keeps a monospace face */
.doc code { font-family: var(--mono); font-size: var(--fs-2); }
/* three tools on the sheet, drawn from the start; a quote pointed at is pressed harder for 600 ms */
mark.q { color: inherit; cursor: pointer; padding: 1px 0; background: transparent; box-shadow: inset 0 -1px 0 var(--pencil);
  transition: background-color var(--t-fast) linear, box-shadow var(--t-fast) linear; }
mark.q:not(.critical):not(.major) { text-decoration: underline dashed var(--pencil); text-underline-offset: 4px; box-shadow: none; }
mark.q.major { background: var(--marker); box-shadow: none; }
mark.q.critical { background: var(--red-soft); box-shadow: inset 0 -2px 0 var(--red); }
mark.q:hover, mark.q.active { outline: 1px solid var(--text); outline-offset: 1px; }
mark.q.active { outline-width: 2px; }
mark.q.pulse { background: var(--pulse-minor); }
mark.q.major.pulse { background: var(--pulse-major); box-shadow: 0 0 0 2px var(--pulse-major); }
mark.q.critical.pulse { background: var(--pulse-critical); box-shadow: inset 0 -2px 0 var(--red), 0 0 0 2px var(--pulse-critical); }
.chip { display: inline-flex; gap: 6px; align-items: center; font-size: var(--fs-1); white-space: nowrap; padding: 1px var(--s1) 1px 0; border: 0;
  background: none; cursor: pointer; color: var(--muted); text-align: left; font-family: var(--mono);
  transition: color var(--t-fast) linear; }
.chip:hover, .chip.active { color: var(--text); }
.chip.active { text-decoration: underline; text-underline-offset: 3px; }

/* findings: grouped by severity, a coloured rule on the left instead of a badge */
.findings { container-type: inline-size; }
.group-head { position: sticky; top: 0; z-index: 1; margin: 0; padding: var(--s3) var(--s4) var(--s2); font-size: var(--fs-2);
  font-weight: 600; background: var(--surface); border-bottom: 1px solid var(--line); }
.group-head .n { color: var(--muted); font-weight: 400; }
.finding { --c: var(--pencil); border-bottom: 1px solid var(--line); box-shadow: inset 4px 0 0 var(--c);
  transition: background-color var(--t-fast) linear; }
.finding.critical { --c: var(--red); } .finding.major { --c: var(--marker); }
.finding:hover { background: var(--surface-2); }
.finding.active { background: var(--surface-2); }
.finding-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--s4); padding: var(--s3) var(--s4) var(--s3) 20px;
  cursor: pointer; }
.finding-row .ftitle { font-size: var(--fs-3); font-weight: 600; line-height: 1.35; }
.finding-row .fquote { font-family: var(--serif); font-size: var(--fs-2); color: var(--muted); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.finding-row .unverified { font-size: var(--fs-1); color: var(--marker-ink); }
.finding-row .fmeta { grid-column: 2; grid-row: 1 / span 3; display: grid; gap: 1px; align-content: start; justify-items: end;
  font-size: var(--fs-1); color: var(--muted); text-align: right; padding-top: 3px; max-width: 150px; }
.finding-row .fmeta .mono { font-size: var(--fs-1); white-space: nowrap; }
.finding-row .fmeta .fid { color: var(--text); }
@container (max-width: 460px) {
  .finding-row { grid-template-columns: minmax(0, 1fr); }
  .finding-row .fmeta { grid-column: 1; grid-row: auto; display: flex; flex-wrap: wrap; gap: 2px var(--s3); justify-items: start;
    text-align: left; max-width: none; padding-top: var(--s1); }
}
.finding-body { padding: 0 var(--s4) var(--s4) 20px; display: grid; gap: var(--s3); max-width: 86ch; }
.finding-body h4 { margin: 0 0 var(--s1); font-size: var(--fs-1); font-weight: 400; color: var(--muted); }
.finding-body p { margin: 0; font-size: var(--fs-2); }
.quote { border-left: 2px solid var(--line-strong); padding: var(--s2) var(--s3); background: var(--surface);
  margin: 0 0 6px; font-family: var(--serif); font-size: var(--fs-2); line-height: 1.5; overflow-wrap: anywhere; }
.quote footer { font-family: var(--sans); font-size: var(--fs-1); color: var(--muted); display: flex; gap: var(--s1) var(--s3);
  flex-wrap: wrap; align-items: center; margin-top: var(--s1); }
.quote .unverified { color: var(--marker-ink); }
.fix-text { background: var(--ok-soft); border-left: 2px solid var(--ok); padding: var(--s2) var(--s3); }
.findings details.resolved { margin: var(--s4); }
.answers { margin-top: var(--s4); }
.answer-field { display: block; margin: 10px 0; }
.answer-field textarea { display: block; width: 100%; margin-top: 4px; font: inherit; padding: 6px 8px; box-sizing: border-box; }
.findings details.resolved summary { cursor: pointer; color: var(--muted); }
.filters { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; margin-bottom: var(--s3); }
.filters select { min-height: 32px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface);
  padding: 2px 6px; font-size: var(--fs-2); max-width: 100%; min-width: 200px; }
.shown { font-size: var(--fs-1); color: var(--muted); }
.toggle { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r); padding: 4px 10px;
  cursor: pointer; font-size: var(--fs-2); display: inline-flex; gap: 6px; align-items: center;
  transition: border-color var(--t-fast) linear, background-color var(--t-fast) linear; }
.toggle:hover { border-color: var(--text); }
.toggle[aria-pressed="true"] { border-color: var(--text); background: var(--text); color: var(--surface); }
.findings-tab .findings { background: var(--surface); border: 1px solid var(--line); }
.findings-tab .group-head { top: var(--tabs-h); }

/* questions: a table on a wide screen, cards on a narrow one */
.q-table th.qcol, .q-table td.qcol { min-width: 45ch; width: 55%; }
.q-table td.qcol { font-size: var(--fs-3); }
.q-cards { display: none; gap: var(--s2); }
.q-card { padding: var(--s3) var(--s4); background: var(--surface); border: 1px solid var(--line); }
.q-card .qtext { font-size: var(--fs-3); margin: var(--s1) 0 var(--s2); }
.q-card .qmeta { font-size: var(--fs-1); color: var(--muted); display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: center; }
.q-card .qmeta .sep { color: var(--line-strong); }
.blocks-dev { color: var(--red); font-weight: 600; }
@media (max-width: 999px) { .q-table-wrap { display: none; } .q-cards { display: grid; } }

/* details */
.about { margin-bottom: var(--s3); font-size: var(--fs-2); }
.about summary { cursor: pointer; color: var(--muted); padding: var(--s2) 0; }
.about p { margin: 0 0 6px; max-width: 100ch; }
.notes h4 { margin: 0 0 var(--s1); font-size: var(--fs-2); }
.notes > div + div { margin-top: var(--s3); }
.notes ul { margin: var(--s1) 0 0; padding-left: 18px; font-size: var(--fs-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px var(--s4); align-items: center; font-size: var(--fs-1); margin: 0 0 var(--s3); color: var(--muted); }
.swatch { display: inline-flex; align-items: center; gap: 6px; }
.cellbox { display: inline-flex; width: 24px; height: 22px; align-items: center; justify-content: center; font-size: var(--fs-1);
  font-weight: 600; border: 1px solid transparent; }
.cellbox.critical { background: var(--red); color: #fff; }
.cellbox.major { background: var(--marker); color: #3b2700; border-color: var(--marker-ink); }
.cellbox.minor { border-color: var(--pencil); color: var(--text); }
.cellbox.clean { border-color: var(--line); }
.cellbox.none { background: repeating-linear-gradient(135deg, var(--line) 0 1px, transparent 1px 5px); }
.matrix { border-collapse: separate; border-spacing: 0; width: auto; }
.matrix th, .matrix td { padding: 2px 3px; text-align: center; font-size: var(--fs-1); }
.matrix thead { position: sticky; top: var(--tabs-h); z-index: 3; }
.matrix thead th { background: var(--surface); vertical-align: bottom; height: 214px; font-weight: 400; border-bottom: 1px solid var(--line-strong); }
.matrix thead th .vert { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
.matrix thead th.group { height: auto; color: var(--muted); padding: var(--s2) 5px var(--s1); border-bottom: 0; }
.matrix thead th.corner { text-align: left; padding: var(--s2) 14px; vertical-align: bottom; border-bottom: 1px solid var(--line-strong); }
.matrix tbody tr:hover th, .matrix tbody tr:hover td { background: var(--surface-2); }
.matrix th.rowhead { position: sticky; left: 0; background: var(--surface); text-align: left; padding: 3px 14px; white-space: nowrap;
  font-weight: 400; z-index: 1; cursor: pointer; }
.matrix td button { border: 0; padding: 0; background: none; cursor: pointer; }
.matrix td button:hover .cellbox { outline: 2px solid var(--text); outline-offset: 1px; }
.pair { margin-bottom: var(--s3); }
.pair-head { padding: var(--s3) var(--s4); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); }
.pair-head .ftitle { font-weight: 600; font-size: var(--fs-3); flex: 1; min-width: 220px; }
.pair-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pair-body .side { padding: var(--s3) var(--s4); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.pair-body .side:nth-child(2n) { border-right: 0; }
.pair-body .quote { margin: 6px 0 0; background: var(--surface-2); }
.pair-note { padding: var(--s3) var(--s4); font-size: var(--fs-2); }
@media (max-width: 720px) { .pair-body { grid-template-columns: minmax(0, 1fr); } .pair-body .side { border-right: 0; } }
.prio { font-weight: 600; }

/* narrow screens: the document tab is the document alone; findings live on their own tab */
@media (max-width: 980px) {
  .wrap { padding-left: var(--s4); padding-right: var(--s4); }

text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0014", "kind": "paragraph", "text": "Дать клиенту возможность узнать о достижении личного бюджета в момент покупки.", "anchor": {"page": null, "line_start": 23, "line_end": 23, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Цели"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0015", "kind": "heading", "text": "### Архитектура решения", "anchor": {"page": null, "line_start": 25, "line_end": 25, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Архитектура решения"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0016", "kind": "paragraph", "text": "Мобильное приложение → сервис настроек. Карточный процессинг → учёт расходов → сервис push.", "anchor": {"page": null, "line_start": 26, "line_end": 26, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Архитектура решения"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0017", "kind": "heading", "text": "### Дизайн процесса UI", "anchor": {"page": null, "line_start": 28, "line_end": 28, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Дизайн процесса UI"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0018", "kind": "paragraph", "text": "Карты → Расходы → Уведомления. На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить». При ошибке ввода сообщение появляется под полем.", "anchor": {"page": null, "line_start": 29, "line_end": 29, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Дизайн процесса UI"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0019", "kind": "heading", "text": "### Требования к изменениям", "anchor": {"page": null, "line_start": 31, "line_end": 31, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Требования к изменениям"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0020", "kind": "heading", "text": "#### BPMN схема процесса", "anchor": {"page": null, "line_start": 33, "line_end": 33, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Требования к изменениям", "BPMN схема процесса"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0021", "kind": "paragraph", "text": "Проведение покупки → пересчёт расходов → проверка порога → при достижении отправка push → завершение.", "anchor": {"page": null, "line_start": 34, "line_end": 34, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Требования к изменениям", "BPMN схема процесса"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0022", "kind": "heading", "text": "#### Функциональные требования", "anchor": {"page": null, "line_start": 36, "line_end": 36, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Требования к изменениям", "Функциональные требования"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0023", "kind": "list_item", "text": "* **Ф-1.** Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно. По умолчанию уведомление выключено.", "anchor": {"page": null, "line_start": 37, "line_end": 37, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Требования к изменениям", "Функциональные требования"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0024", "kind": "list_item", "text": "* **Ф-2.** Месяц определяется по дате совершения покупки в Алматы. В расходы входят проведённые покупки. Возврат уменьшает расходы месяца исходной покупки. Переводы и снятие наличных исключаются.", "anchor": {"page": null, "line_start": 38, "line_end": 38, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Требования к изменениям", "Функциональные требования"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0025", "kind": "list_item", "text": "* **Ф-3.** Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push. На карту приходится максимум один такой push за календарный месяц.", "anchor": {"page": null, "line_start": 39, "line_end": 39, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Требования к изменениям", "Функциональные требования"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0026", "kind": "list_item", "text": "* **Ф-4.** При изменении порога накопленная сумма сохраняется. Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.", "anchor": {"page": null, "line_start": 40, "line_end": 40, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Требования к изменениям", "Функциональные требования"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0027", "kind": "heading", "text": "### Sequence Diagram", "anchor": {"page": null, "line_start": 42, "line_end": 42, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Sequence Diagram"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0028", "kind": "paragraph", "text": "Процессинг → сервис расходов: проведена покупка. Сервис расходов → настройки: получить порог карты. Сервис расходов → push: передать последние четыре цифры карты и сумму при достижении порога.", "anchor": {"page": null, "line_start": 43, "line_end": 43, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Sequence Diagram"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0029", "kind": "heading", "text": "### Нефункциональные требования", "anchor": {"page": null, "line_start": 45, "line_end": 45, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Нефункциональные требования"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0030", "kind": "paragraph", "text": "Сервис передаёт push на отправку в течение минуты после получения события.", "anchor": {"page": null, "line_start": 46, "line_end": 46, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Нефункциональные требования"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0031", "kind": "heading", "text": "### Требования к данным", "anchor": {"page": null, "line_start": 48, "line_end": 48, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Требования к данным"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0032", "kind": "paragraph", "text": "Хранить идентификатор карты, месяц, идентификатор операции, сумму покупки в тиынах, признак отправки и порог в тенге.", "anchor": {"page": null, "line_start": 49, "line_end": 49, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть A. Новый функционал", "Требования к данным"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0033", "kind": "heading", "tex e": 1.0, "hidden": false, "table_header": null}, {"id": "b0082", "kind": "list_item", "text": "3. Проверить сумму и переключатель.", "anchor": {"page": null, "line_start": 119, "line_end": 119, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Логика работы метода"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0083", "kind": "list_item", "text": "4. Заменить настройку и вернуть результат сохранения.", "anchor": {"page": null, "line_start": 120, "line_end": 120, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Логика работы метода"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0084", "kind": "list_item", "text": "5. При отклонении суммы вернуть прежнее состояние и результат ERROR.", "anchor": {"page": null, "line_start": 121, "line_end": 121, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Логика работы метода"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0085", "kind": "heading", "text": "### Особые правила", "anchor": {"page": null, "line_start": 123, "line_end": 123, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Особые правила"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0086", "kind": "list_item", "text": "1. Целое число тенге, обе границы включены.", "anchor": {"page": null, "line_start": 124, "line_end": 124, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Особые правила"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0087", "kind": "list_item", "text": "2. Повторное сохранение заменяет действующую настройку.", "anchor": {"page": null, "line_start": 125, "line_end": 125, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Особые правила"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0088", "kind": "list_item", "text": "3. Изменение порога сохраняет накопленные расходы.", "anchor": {"page": null, "line_start": 126, "line_end": 126, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Особые правила"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0089", "kind": "heading", "text": "### Схема", "anchor": {"page": null, "line_start": 128, "line_end": 128, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Схема"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0090", "kind": "code", "text": "```text\nПриложение → AlertsController → хранилище настроек → AlertsController → приложение.\n```", "anchor": {"page": null, "line_start": 129, "line_end": 131, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Схема"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0091", "kind": "heading", "text": "### Параметры запроса", "anchor": {"page": null, "line_start": 133, "line_end": 133, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Параметры запроса"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0092", "kind": "heading", "text": "#### Path-параметры", "anchor": {"page": null, "line_start": 135, "line_end": 135, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Параметры запроса", "Path-параметры"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0093", "kind": "paragraph", "text": "Не используются.", "anchor": {"page": null, "line_start": 136, "line_en , "DB field"]}, {"id": "b0098", "kind": "table_row", "text": "| `enabled` | integer | 1 знак | Да | 0 или 1 | Признак включения | `enabled` |", "anchor": {"page": null, "line_start": 144, "line_end": 144, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Параметры запроса", "Query-параметры"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": ["Parameter", "Format", "Size", "Mandatory", "Logic", "Description", "DB field"]}, {"id": "b0099", "kind": "heading", "text": "#### Request body", "anchor": {"page": null, "line_start": 146, "line_end": 146, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Параметры запроса", "Request body"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0100", "kind": "list_item", "text": "* **Content-Type:** `application/json` .", "anchor": {"page": null, "line_start": 147, "line_end": 147, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Параметры запроса", "Request body"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0101", "kind": "list_item", "text": "* Тело не используется.", "anchor": {"page": null, "line_start": 148, "line_end": 148, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Параметры запроса", "Request body"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0102", "kind": "heading", "text": "### Ответ", "anchor": {"page": null, "line_start": 150, "line_end": 150, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Ответ"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0103", "kind": "paragraph", "text": "Если результат 200 или 201 — успешный. Если результат 400, 401 и далее — неуспешный.", "anchor": {"page": null, "line_start": 151, "line_end": 151, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Ответ"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": null}, {"id": "b0104", "kind": "table", "text": "| Parameter | Format | Logic | Description | DB field |", "anchor": {"page": null, "line_start": 153, "line_end": 153, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Ответ"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": ["Parameter", "Format", "Logic", "Description", "DB field"]}, {"id": "b0105", "kind": "table_row", "text": "| `result` | string | OK / ERROR | Исход сохранения | — |", "anchor": {"page": null, "line_start": 155, "line_end": 155, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Ответ"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": ["Parameter", "Format", "Logic", "Description", "DB field"]}, {"id": "b0106", "kind": "table_row", "text": "| `amount` | string | При успехе | Порог в тенге | `limit_kzt` |", "anchor": {"page": null, "line_start": 156, "line_end": 156, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Ответ"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": ["Parameter", "Format", "Logic", "Description", "DB field"]}, {"id": "b0107", "kind": "table_row", "text": "| `enabled` | string | «0» или «1» | Признак включения | `enabled` |", "anchor": {"page": null, "line_start": 157, "line_end": 157, "paragraph": null, "section_path": ["Уведомление о расходах по карте", "Часть B. REST API", "Ответ"]}, "source": "plain_text", "confidence": 1.0, "hidden": false, "table_header": ["Parameter", "Format", "Logic", "Description", "DB field"]}, {"id": "b0108", "kind": "table_row", "text": "| `message` | string | При ошибке | Описание ошибки | — |", "anchor": {"page": , "place": "строка 49"}, {"id": "R-011", "doc_label": null, "kind": "integration", "part": "Часть A. Новый функционал", "block_ids": ["b0034"], "quote": "Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API».", "summary": "Настройки сохраняются и читаются через REST API", "place": "строка 52"}, {"id": "R-012", "doc_label": null, "kind": "integration", "part": "Часть A. Новый функционал", "block_ids": ["b0034"], "quote": "Повторная доставка одного события процессинга сохраняет исходный итог.", "summary": "Идемпотентность обработки событий процессинга", "place": "строка 52"}, {"id": "R-013", "doc_label": null, "kind": "acceptance_criterion", "part": "Часть A. Новый функционал", "block_ids": ["b0040"], "quote": "| Расходы 48 500 ₸, порог 50 000 ₸ | Провести покупку на 1 500 ₸ | Итог 50 000 ₸ и один push |", "summary": "Сценарий: успешная покупка вызывает push-уведомление", "place": "строка 63"}, {"id": "R-014", "doc_label": null, "kind": "acceptance_criterion", "part": "Часть A. Новый функционал", "block_ids": ["b0041"], "quote": "| Покупка 31 января в 23:58 на 4 000 ₸ | Провести 1 февраля в 00:03 по Алматы | Февральский счётчик вырос на 4 000 ₸ |", "summary": "Сценарий: учет часового пояса при расчете границы месяца", "place": "строка 64"}, {"id": "R-015", "doc_label": null, "kind": "acceptance_criterion", "part": "Часть A. Новый функционал", "block_ids": ["b0042"], "quote": "| Расходы 19 900 ₸, порог 20 000 ₸ | Перевести 500 ₸ | Счётчик показывает 19 900 ₸ |", "summary": "Сценарий: переводы не влияют на счетчик расходов", "place": "строка 65"}, {"id": "R-016", "doc_label": null, "kind": "api_contract", "part": "Часть B. REST API", "block_ids": ["b0067", "b0068", "b0069", "b0070", "b0071", "b0072", "b0073", "b0074", "b0075", "b0076", "b0077", "b0078"], "quote": "| **Description** | Сохранение порога. Функциональные требования: чтение порога |", "summary": "Общие параметры метода API: URL, авторизация, метод", "pla
