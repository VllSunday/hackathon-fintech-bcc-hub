/* A reviewer's desk: a white sheet on a grey-green table, rules instead of shadows, one ink accent.
   Defects are drawn on the sheet with three tools: red pen (critical), yellow marker (major),
   pencil (minor). Tokens first, then components, then screens. */
:root {
  --bg: #eef0ec; --surface: #ffffff; --surface-2: #f5f6f2;
  --line: #d8dcd3; --line-strong: #b5bbae;
  --text: #161a16; --muted: #5a6259;
  --accent: #2438a6; --accent-soft: #e6e9f7; --on-accent: #ffffff;
  --red: #c4281c; --red-soft: #fbe6e3;
  --marker: #ffe27a; --marker-ink: #6b4700;
  --pencil: #6b7280;
  --ok: #1e7b4b; --ok-soft: #e1f1e8;
  --warn-soft: #fdf3cf;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r: 3px;
  --t-fast: 120ms; --t-panel: 240ms;
  --ease-out: cubic-bezier(.2, .7, .2, 1); --ease-in: cubic-bezier(.5, 0, .9, .4);
  /* two families and a mono for identifiers */
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --display: var(--sans);
  --serif: "PT Serif", Cambria, Georgia, serif;
  --mono: "IBM Plex Mono", Consolas, ui-monospace, Menlo, monospace;
  /* six sizes: meta, interface, reading, section, title, stamp */
  --fs-1: 12px; --fs-2: 14px; --fs-3: 16px; --fs-4: 20px; --fs-5: 28px; --fs-6: 34px;
  /* a quote at the moment it is pointed at: the same tool, pressed harder */
  --pulse-major: #ffc21a; --pulse-critical: #f3a59c; --pulse-minor: #d3d7de;
  --tabs-h: 45px;
}
:root[data-theme="dark"] {
  --bg: #141614; --surface: #1b1e1b; --surface-2: #222622;
  --line: #2f352f; --line-strong: #4a524a;
  --text: #e7eae5; --muted: #a1a99f;
  --accent: #9aa9f5; --accent-soft: #232a4d; --on-accent: #10142b;
  --red: #f0766b; --red-soft: #3a1e1b;
  --marker: #e9c94f; --marker-ink: #f0d27a;
  --pencil: #a3a9b3;
  --ok: #5cc08b; --ok-soft: #18301f;
  --warn-soft: #3a3214;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size: var(--fs-2); line-height: 1.45; -webkit-text-size-adjust: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); }
.mono { font-family: var(--mono); font-size: var(--fs-2); }
.muted { color: var(--muted); }
.wrap { max-width: 1680px; margin: 0 auto; padding: 0 var(--s6); }
.grow { flex: 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--sans); font-weight: 600; line-height: 1.2; }
h1 { font-size: var(--fs-5); }
h2 { font-size: var(--fs-4); }

/* Motion: screens and tabs change by a 120 ms fade, never by sliding in. Things blink only
   while a run is going; a finished report holds still except the stamp, once. */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 50% { opacity: .3; } }
@keyframes shimmer { 50% { opacity: .5; } }
#app.enter > * { animation: fade var(--t-fast) linear; }

/* top bar */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: var(--s3); min-height: 56px; }
.brand { font-family: var(--sans); font-weight: 600; font-size: var(--fs-4); letter-spacing: .01em;
  color: var(--text); text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 34px;
  padding: 6px 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface);
  color: var(--text); text-decoration: none; cursor: pointer; font-size: var(--fs-2); font-weight: 600; white-space: nowrap;
  transition: border-color var(--t-fast) var(--ease-out), background-color var(--t-fast) var(--ease-out),
    transform var(--t-fast) var(--ease-out); }
.btn:hover { border-color: var(--text); }
.btn:active { transform: translateY(1px); }
.btn.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { border-color: var(--text); }
.btn.primary:disabled { border-color: var(--line-strong); background: var(--line); color: var(--muted); cursor: not-allowed; transform: none; }
.btn.big { min-height: 40px; padding: 8px 20px; font-size: var(--fs-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: var(--s2); }
.btn.ghost:hover { border-color: transparent; text-decoration: underline; text-underline-offset: 3px; }
.btn.icon { width: 34px; padding: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; }
.pad { padding: var(--s4) 20px; }
.section-title { font-size: var(--fs-1); color: var(--muted); margin: 0 0 var(--s2); }
.notice { border: 1px solid var(--line); border-left: 3px solid var(--marker-ink); background: var(--warn-soft);
  border-radius: 2px; padding: 10px var(--s4); margin: var(--s3) 0; }
.notice.error { border-left-color: var(--red); background: var(--red-soft); }
.notice.ok { border-left-color: var(--ok); background: var(--ok-soft); }
.notice p { margin: 0 0 var(--s1); } .notice p:last-child { margin: 0; }
.notice details p { margin: 6px 0 0; }
.notice code { font-family: var(--mono); font-size: var(--fs-2); }
.empty { padding: var(--s6) var(--s4); color: var(--muted); }
.skeleton { display: grid; gap: var(--s3); padding: var(--s5) 0; }
.skeleton i { display: block; height: 14px; width: var(--w, 100%); background: var(--line); border-radius: 2px;
  animation: shimmer 1.2s var(--ease-out) infinite; }

/* upload screen: a narrow column to start a check, a wide one for the journal */
.upload { display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: var(--s7) 56px; align-items: start;
  padding-top: 40px; padding-bottom: 56px; }
.upload > section { display: grid; gap: 20px; min-width: 0; }
.drop { min-height: 180px; display: grid; align-content: end; gap: 6px; padding: var(--s5); cursor: pointer;
  background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 4px;
  transition: border-color var(--t-fast) var(--ease-out), background-color var(--t-fast) var(--ease-out); }
.drop:hover { border-color: var(--text); }
.drop.over { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.drop.has-file { border-style: solid; border-color: var(--text); }
.drop strong { font-size: var(--fs-3); font-weight: 600; overflow-wrap: anywhere; }
.drop.has-file strong { animation: fade var(--t-panel) var(--ease-out); }
.drop .hint { color: var(--muted); font-size: var(--fs-2); }
.form-row { display: flex; gap: var(--s4); align-items: center; flex-wrap: wrap; }
.journal-head { display: flex; gap: 10px; align-items: baseline; }
.journal-head span { font-family: var(--mono); font-size: var(--fs-2); color: var(--muted); }
.runs { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; }
.run, .run-head { display: grid; grid-template-columns: minmax(0, 1fr) 124px 176px repeat(4, 54px); gap: var(--s1) var(--s4);
  align-items: center; padding: var(--s3) var(--s4); }
.run-head { padding-block: var(--s2); background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: var(--fs-1); color: var(--muted); }
.run-head .num { text-align: right; }
.run { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line);
  transition: background-color var(--t-fast) var(--ease-out); }
.run:last-child { border-bottom: 0; }
.run:hover { background: var(--surface-2); }
.run:active { background: var(--accent-soft); }
.run-doc { min-width: 0; display: grid; gap: 2px; }
.run-doc b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-doc span { font-size: var(--fs-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-date { font-family: var(--mono); font-size: var(--fs-2); white-space: nowrap; }
.stat { text-align: right; }
.stat b { font-family: var(--sans); font-weight: 600; font-size: var(--fs-3); font-variant-numeric: tabular-nums; }
.stat span { display: none; font-size: var(--fs-1); color: var(--muted); }
.stat.crit b { color: var(--red); }
.stat.zero b { color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-2); min-width: 0; }
.pill::before { content: ""; flex: none; width: 8px; height: 8px; background: var(--marker); outline: 1px solid var(--marker-ink); outline-offset: -1px; }
.pill.completed::before { background: var(--ok); outline: 0; }
.pill.partial::before, .pill.interrupted::before, .pill.input_rejected::before { background: var(--red); outline: 0; }
.pill.running::before { background: var(--accent); outline: 0; animation: blink 1s var(--ease-out) infinite; }
@media (max-width: 1100px) { .upload { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .run-head { display: none; }
  .run { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .run-doc, .run-date, .run .pill { grid-column: 1 / -1; }
  .stat { text-align: left; } .stat span { display: block; }
}

/* generic tables */
table { border-collapse: collapse; width: 100%; }
.grid-table th, .grid-table td { text-align: left; padding: 10px var(--s4); border-bottom: 1px solid var(--line);
  vertical-align: top; font-size: var(--fs-2); }
.grid-table tr:last-child td { border-bottom: 0; }
.grid-table th { font-size: var(--fs-1); color: var(--muted); font-weight: 400; background: var(--surface-2); position: sticky; top: 0; }
.grid-table td.mono, .grid-table td.prio, .grid-table th { white-space: nowrap; }
.grid-table .chip { white-space: nowrap; }
.grid-table tbody tr { transition: background-color var(--t-fast) var(--ease-out); }
.grid-table tbody tr.click { cursor: pointer; }
.grid-table tbody tr.click:hover { background: var(--surface-2); }
.num { text-align: right !important; font-variant-numeric: tabular-nums; }
.table-scroll { overflow-x: auto; }

/* run screen */
.runview { padding-top: 40px; padding-bottom: 56px; }
.scan { display: grid; gap: var(--s2); justify-items: start; margin-bottom: var(--s7); }
.scan h1 { overflow-wrap: anywhere; }
.now { display: flex; align-items: center; gap: 10px; font-size: var(--fs-3); font-weight: 600; min-height: 24px; }
.now .dot { width: 10px; height: 10px; background: var(--accent); }
.scan.running .now .dot { animation: blink 1s var(--ease-out) infinite; }
.scan.finished .now .dot { background: var(--ok); }
.scan.failed .now .dot { background: var(--red); }
.clock { font-family: var(--sans); font-weight: 600; font-size: 72px; line-height: 1.05;
  letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.runbar { width: min(420px, 100%); height: 3px; background: var(--line); overflow: hidden; }
.runbar i { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(var(--p, 0));
  transition: transform var(--t-panel) var(--ease-out); }
.scan .btn { margin-top: var(--s3); }
@media (max-width: 620px) { .clock { font-size: 52px; } }

/* stage track */
.chain { display: grid; grid-template-columns: repeat(var(--stages, 10), minmax(0, 1fr)); margin: var(--s4) 0 var(--s2); }
.stage { position: relative; display: grid; align-content: start; gap: 2px; padding: 20px var(--s2) 0 0; min-width: 0; }
.stage::before { content: ""; position: absolute; top: 5px; left: 0; width: 100%; height: 1px; background: var(--line-strong);
  transition: background-color var(--t-panel) var(--ease-out); }
.stage:last-child::before { display: none; }
.stage.done::before, .stage.not_needed::before { background: var(--accent); }
.node { position: absolute; top: 0; left: 0; width: 11px; height: 11px; background: var(--bg); border: 1px solid var(--line-strong);
  transition: background-color var(--t-panel) var(--ease-out), border-color var(--t-panel) var(--ease-out); }
.stage.done .node { background: var(--accent); border-color: var(--accent); }
.stage.running .node { border: 3px solid var(--accent); animation: blink 1s var(--ease-out) infinite; }
.stage.error .node, .stage.interrupted .node { background: var(--red); border-color: var(--red); }
.stage.not_needed .node, .stage.skipped .node { border-style: dashed; }
.stage .code { font-family: var(--mono); font-size: var(--fs-1); color: var(--muted); }
.stage .name { font-weight: 600; font-size: var(--fs-2); line-height: 1.3; }
.stage .state { font-size: var(--fs-1); color: var(--muted); }
.stage.done .state, .stage.pending .state { display: none; }
.stage.running .state { color: var(--accent); }
.stage.error .state, .stage.interrupted .state { color: var(--red); }
.stage .meta { font-size: var(--fs-1); color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }
.stage.pending .name { color: var(--muted); font-weight: 400; }
@media (max-width: 1100px) {
  .chain { grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
  .stage { padding: 0 0 0 var(--s5); }
  .stage::before { top: 11px; left: 5px; width: 1px; height: calc(100% + 6px); }
  .node { top: 3px; }
}

/* report head: the answer first — stamp, one sentence, the three findings to fix */
.report-head { padding-top: var(--s5); padding-bottom: var(--s5); display: grid; gap: var(--s3); }
.report-head .notice { margin: 0; }
.title-row { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.title-row h1 { flex: 1; min-width: 240px; font-size: var(--fs-5); }
.meta-line { font-size: var(--fs-1); color: var(--muted); margin-top: calc(-1 * var(--s2)); }
.verdict { display: grid; grid-template-columns: minmax(220px, auto) minmax(0, 1fr); gap: 0; background: var(--surface);
  border: 1px solid var(--line); border-radius: 2px; --v: var(--muted); }
.verdict.no { --v: var(--red); } .verdict.conditional { --v: var(--marker-ink); } .verdict.yes { --v: var(--ok); }
.verdict > div { padding: 20px var(--s5); min-width: 0; }
.verdict > div + div { border-left: 1px solid var(--line); }
.verdict .q { font-size: var(--fs-1); color: var(--muted); margin-bottom: var(--s3); }
/* the one staged moment of the report: the verdict is stamped onto the page, once */
@keyframes stamp { from { opacity: 0; transform: rotate(-3deg) scale(1.18); } to { opacity: 1; transform: rotate(-3deg); } }
.verdict .word { display: inline-block; font-family: var(--sans); font-weight: 600; font-size: var(--fs-6);
  line-height: 1.05; color: var(--v); padding: 6px 18px 8px; border: 3px solid var(--v);
  border-radius: 3px; box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4px var(--v); transform: rotate(-3deg);
  max-width: 100%; overflow-wrap: anywhere; }
.verdict .word.first { animation: stamp var(--t-panel) var(--ease-out) 160ms backwards; }
.verdict .word.long { font-size: var(--fs-5); }
.verdict .word.plain { font-size: var(--fs-4); }
.verdict .lead { margin: 0; font-size: var(--fs-3); line-height: 1.5; max-width: 72ch; }
.verdict .incomplete { margin: var(--s2) 0 0; color: var(--muted); }

<script>

  appendix: 'приложение', other: 'прочее' };

  completed: 'готов',
  partial: 'остановлен',
  checks_incomplete: 'проверен не полностью',
  input_rejected: 'не принят',
  running: 'идёт',
  interrupted: 'прерван',
};
const STAGE_STATE = { pending: 'ожидает', running: 'идёт', done: 'готов', error: 'ошибка',
  skipped: 'не выполнялся', interrupted: 'прерван', not_needed: 'не требовался' };
// ?debug=1 (before or after the #) shows the agent's own terms: stage codes, seconds, cache.
const DEBUG = new URLSearchParams(location.search).get('debug') === '1' || /[?&]debug=1(?:&|$)/.test(location.hash);
// Stage names as an analyst would say them; the agent's own titles are shown in debug mode.
const STAGE_TITLE = { s0: 'Приём файла', s1: 'Чтение текста', s2: 'Выделение требований', s3: 'Сбор значений',
  s4: 'План проверок', s5: 'Поиск нарушений', s6: 'Перепроверка', s7: 'Сверка цитат с документом',
  s8: 'Редактура и вопросы', s8b: 'Учёт ответов автора', s9: 'Отчёт' };
function stageTitle(s) { return DEBUG ? s.title : (STAGE_TITLE[s.code] || s.title); }
function stageName(code) { return STAGE_TITLE[code] || code; }
// Stage summaries: a number and its noun in three forms (1, 2–4, 5+).
const SUMMARY_RU = {
  s1: [['blocks', 'блок текста', 'блока текста', 'блоков текста']],
  s2: [['units', 'требование', 'требования', 'требований']],
  s3: [['facts', 'значение', 'значения', 'значений'], ['conflicts', 'расхождение', 'расхождения', 'расхождений']],
  s5: [['candidates', 'возможное нарушение', 'возможных нарушения', 'возможных нарушений']],
  s6: [['confirmed', 'подтверждено', 'подтверждено', 'подтверждено'], ['rejected', 'отклонено', 'отклонено', 'отклонено']],
  s7: [['out', 'прошло проверку', 'прошло проверку', 'прошло проверку'], ['no_evidence', 'без цитаты', 'без цитаты', 'без цитаты']],
  s8: [['questions', 'вопрос', 'вопроса', 'вопросов']],

const DECISION_RU = {
  confirmed: 'После ответа автора дефект остаётся: документ нужно исправить.',
  changed: 'После ответа автора дефект остаётся, серьёзность изменена.',
  resolved: 'Находка снята: ответ автора показывает, что документ это покрывает.',

// Blocks of a scan whose two readings differ get this confidence (reading/vision.py).
const DOUBT_CONFIDENCE = 0.6;

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const [key, value] of Object.entries(props)) {
      if (value == null || value === false) continue;

      if (!part) {

        if (s.llm_calls) meta.push(h('div', null, `${s.llm_calls} ${plural(s.llm_calls, 'вызов', 'вызова', 'вызовов')} модели`));

      for (const [key, one, few, many] of SUMMARY_RU[s.code] || []) {
        const n = s.summary && s.summary[key];
        if (typeof n === 'number') meta.push(h('div', null, `${n} ${plural(n, one, few, many)}`));
      }

function screenRun(runId) {
  const title = h('h1', null, 'Прогон');
  const nowText = h('span');
  const clock = h('div', { class: 'clock' }, '00:00');
  const bar = h('i');
  const summary = h('div', { class: 'muted' });
  const actions = h('div');
  const scan = h('div', { class: 'scan' }, title,
    h('div', { class: 'now', role: 'status' }, h('span', { class: 'dot' }), nowText), clock,
    h('div', { class: 'runbar', 'aria-hidden': 'true' }, bar), summary, actions);
  const noticeBox = h('div');
  const chainBox = h('div');
  const box = h('div', { class: 'wrap runview' }, scan, noticeBox, chainBox);
  clear(app).append(box);
  let chain = null;
  let sawRunning = false;
  let last = null;

  function draw(progress) {
    last = progress;
    const stages = progress.stages;
    const running = progress.status === 'running';
    const failed = ['partial', 'input_rejected', 'interrupted'].includes(progress.status);
    const done = stages.filter((s) => s.status === 'done' || s.status === 'not_needed').length;
    bar.style.setProperty('--p', (done / Math.max(1, stages.length)).toFixed(3));
    summary.textContent = `${done} из ${stages.length} этапов`;
    title.textContent = progress.input || 'Прогон';
    scan.className = `scan ${running ? 'running' : 'finished'}${failed ? ' failed' : ''}`;
    const current = stages.find((s) => s.status === 'running');
    nowText.textContent = running ? (current ? stageTitle(current) : 'Запуск') : cap(RUN_STATUS[progress.status] || progress.status);
    const startedMs = Date.parse(progress.started_at || '');
    const seconds = running && !Number.isNaN(startedMs)
      ? Math.max(0, (Date.now() - startedMs) / 1000) : stages.reduce((sum, s) => sum + (s.seconds || 0), 0);
    clock.textContent = fmtClock(seconds);
    clear(actions);
    if (progress.has_report) actions.append(h('a', { class: 'btn primary big', href: `#/report/${runId}` }, 'Открыть отчёт'));
    const notice = runNotice(progress);
    clear(noticeBox);
    if (notice) noticeBox.append(notice);
    if (chain) chain.update(progress); else { chain = stageChain(progress); chainBox.append(chain); }
  }
  async function tick() {
    let progress;

    } catch (err) {

      clear(box).append(errorBox(err, () => route()));

  // Characters of a block shown to the reader: markdown emphasis marks are hidden, words are not touched.

    const page = target === window;
    const read = () => (page ? window.scrollY : target.scrollTop);
    const write = (value) => { if (page) window.scrollTo(0, value); else target.scrollTop = value; };
    top = Math.max(0, top);
    if (REDUCED) { write(top); return; }
    const from = read();
    const started = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - started) / 150);
      write(from + (top - from) * (1 - (1 - t) * (1 - t)));
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  function scrollPageTo(el, share) {

    const group = el.closest('.group');
    const heading = group && el !== group ? group.querySelector('.group-head') : null;
    const covered = tabs.offsetHeight + (heading ? heading.offsetHeight : 0);
    glide(window, window.scrollY + el.getBoundingClientRect().top - covered - window.innerHeight * share);
  }
  function scrollInPane(pane, el) {

    glide(pane, top - pane.clientHeight / 3);

    if (state.tab !== 'doc') showTab('doc');

  function secMatrix() {
    const box = h('div');

      h('tr', null, order.map((c) => h('th', { title: criterion(c).standard || '' }, h('div', { class: 'vert' }, criterion(c).label))))));
    const body = h('tbody');

    if (R.intake) {
      row('Формат', R.intake.detected_format);
      row('Размер', `${R.intake.size_bytes} байт`);
    }
    if (DEBUG) {
      row('Идентификатор прогона', R.run_id);
      if (R.intake) row('Кодировка', R.intake.encoding);
      if (R.document) {
        row('Цепочка чтения', (R.document.reader_chain || []).join(' → '));
        row('Блоков текста', R.document.blocks.length);
      }
      if (typeof P.llm_calls === 'number') row('Запросов к модели', `${P.llm_calls}, ответов из кэша: ${P.llm_cache_hits}`);
      if (P.llm_calls) {
        row('Токены', `вход ${P.llm_input_tokens} (из кэша провайдера ${P.llm_cached_tokens}), выход ${P.llm_output_tokens}`);
        row('Стоимость по справочнику цен', `≈ $${P.llm_cost_usd.toFixed(2).replace('.', ',')}`);
      }
    }
    if (rows.length) {
      box.append(h('div', { class: 'card table-scroll', style: 'margin-top:12px' }, h('table', { class: 'grid-table' },
        h('thead', null, h('tr', null, h('th', { colspan: '2' }, 'Паспорт прогона'))), h('tbody', null, rows))));
    }
    const notes = [...(P.setup_notes || []), ...((R.intake && R.intake.warnings) || []), ...((R.document && R.document.warnings) || []),
      ...((R.document && R.document.issues) || []).map((i) => (i.line ? `строка ${i.line}: ` : '') + i.message)];
    if (notes.length) box.append(h('div', { class: 'card pad', style: 'margin-top:12px' }, h('div', { class: 'section-title' }, 'Замечания к настройке и чтению файла'),
      notes.map((n) => h('p', { style: 'margin:0 0 4px' }, n))));
    return box;
  }

  const SECTIONS = [['units', 'Требования', R.units.length, secUnits], ['matrix', 'Матрица', null, secMatrix],
    ['set', 'Противоречия', null, secSet], ['run', 'Как проверялось', null, secRun]];
  function tabDetails() {
    const box = h('div', { class: 'tabpanel' });
    box.append(h('div', { class: 'subnav', role: 'group', 'aria-label': 'Раздел' }, SECTIONS.map(([id, label, n]) =>
      h('button', { class: 'toggle', type: 'button', 'aria-pressed': String(state.detail === id),
        onclick: () => { state.detail = id; showTab('details'); } }, label, n ? ` · ${n}` : null))));
    const [, , , build] = SECTIONS.find(([id]) => id === state.detail) || SECTIONS[0];
    box.append(build());
    return box;
  }

  const builders = { findings: tabFindings, questions: tabQuestions, details: tabDetails };
  function showTab(id) {
    state.tab = id;
    for (const [name, button] of tabButtons) button.setAttribute('aria-selected', String(name === id));
    clear(panel);
    if (id === 'doc') {
      panel.append(split);
      paintActive();
    } else {
      panel.append(builders[id]());
      if (id === 'findings') redraw();
    }
  }

  clear(app).append(head, tabs, panel);
  redraw();
  showTab('doc');
}

route();
})();
</script>
</body>
</html>
