traps:
  - id: T-01
    quotes:
      - "Проект должен сделать получение кредита для малого бизнеса простым и быстрым"
    looks_like: verifiable
    why_not: Фраза в разделе «Цели проекта», это не требование к системе; измеримые цели перечислены сразу за ней, а сроки заданы в FR-DEC-03 и NFR-12.
  - id: T-02
    quotes:
      - "Кредит на сумму свыше 50 000 000 ₸ предоставляется только под залог ликвидного имущества, кроме случая, указанного в FR-DEC-09."
      - "на модернизацию зерносушильного комплекса без залога имущества"
    looks_like: set_consistent
    why_not: Кредит 60 млн ₸ без залога в СЦ-3 подпадает под явное исключение FR-DEC-09 — 50 % суммы покрыто гарантией «Даму».
  - id: T-03
    quotes:
      - "Тайм-аут неактивной сессии заявителя — 15 минут (параметр PRM-07)."
      - "PRM-07 | Тайм-аут неактивной сессии заявителя | 900 | секунд"
    looks_like: set_consistent
    why_not: Значение дано в разных единицах, но пересчёт верен — 900 секунд равны 15 минутам, и NFR-06 явно ссылается на параметр.
  - id: T-04
    quotes:
      - "Система запрашивает через ШЭП сведения о юридическом лице или ИП по БИН/ИИН"
    looks_like: set_comprehensible
    why_not: Сокращения ШЭП и ГБД ЮЛ определены в глоссарии (раздел 2).
  - id: T-05
    quotes:
      - "Черновик хранится в течение срока, заданного параметром PRM-03"
    looks_like: complete
    why_not: Число не указано в тексте требования, но задано в таблице параметров Ж.1 (PRM-03 — 30 календарных дней), как установлено соглашением раздела 5.
  - id: T-06
    quotes:
      - "Эксперт одобряет кредит во вторник 10 ноября 2026 года"
    looks_like: set_consistent
    why_not: Заявка подана в пятницу 6 ноября 2026 года; до вторника прошло 4 календарных, но только 2 рабочих дня, к тому же время доработки в срок не включается — срок 3 рабочих дня по FR-DEC-03 соблюдён.
  - id: T-07
    quotes:
      - "Обмен с ПКБ выполняется по протоколу SOAP через защищённый канал"
    looks_like: appropriate
    why_not: Это требование к интерфейсу внешней системы в разделе интеграций; протокол задан кредитным бюро, а не выбран как проектное решение.
  - id: T-08
    quotes:
      - "входит в стоп-лист отраслей (Приложение В, таблица В.2)"
    looks_like: complete
    why_not: Стоп-лист отраслей не перечислен в требовании, но приведён в таблице В.2 Приложения В, на которую дана ссылка.
